<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>KEFE Fluid</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font: 14px -apple-system, system-ui, sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #gl { flex: 1; width: 100%; display: block; background: #000; }
  #ui {
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom,0px));
    display: flex; flex-direction: column; gap: 10px;
    border-top: 1px solid rgba(255,255,255,.1);
    background: #050505;
  }
  .row { display: flex; gap: 8px; align-items: center; }
  button, label.file-label {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.25);
    padding: 12px 16px; font: inherit; cursor: pointer; flex: 1 1 auto;
    text-align: center; border-radius: 0; min-height: 46px;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 600;
  }
  button:disabled { opacity: .4; }
  button.active { background: #fff; color: #000; border-color: #fff; }
  input[type=file] { display: none; }
  #name { font-size: 12px; color: rgba(255,255,255,.55); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .meters { display: flex; gap: 6px; height: 5px; }
  .meters > div { flex: 1; background: rgba(255,255,255,.08); position: relative; overflow: hidden; }
  .meters > div > span { position: absolute; inset: 0; width: 0%;
    background: linear-gradient(90deg, #7ad4ff, #ff5c85); transition: width .08s linear; }
  #status { font-size: 11px; color: rgba(255,255,255,.55); text-align: center;
    min-height: 16px; line-height: 1.4; }
  #status.error { color: #ff8080; }
  #status.success { color: #6fdf8f; }
  .divider { display: flex; align-items: center; gap: 8px;
    color: rgba(255,255,255,.3); font-size: 11px; text-transform: uppercase;
    letter-spacing: .1em; }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.1);
  }
  .slider-group {
    display: flex; flex-direction: column; gap: 4px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .slider-label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; color: rgba(255,255,255,.6);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .slider-label .value {
    font-weight: 700; color: #fff; font-variant-numeric: tabular-nums;
    text-transform: none; letter-spacing: 0;
  }
  .slider-row { display: flex; align-items: center; gap: 8px; }
  .slider-row input[type=range] {
    flex: 1 1 auto; height: 30px;
    -webkit-appearance: none; appearance: none;
    background: transparent; cursor: pointer;
  }
  .slider-row input[type=range]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px; background: rgba(255,255,255,.18);
  }
  .slider-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 0; margin-top: -7.5px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.4);
  }
  .slider-row input[type=range]::-moz-range-track {
    height: 3px; border-radius: 2px; background: rgba(255,255,255,.18);
  }
  .slider-row input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 0;
  }
  .slider-row button {
    flex: 0 0 auto; min-height: 30px; padding: 0 10px;
    font-size: 10px; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div class="meters">
    <div><span id="mBass"></span></div>
    <div><span id="mMids"></span></div>
    <div><span id="mTreble"></span></div>
  </div>
  <div id="name">No audio loaded</div>
  <div class="row">
    <label class="file-label" for="file">Choose audio</label>
    <input type="file" id="file"
      accept="audio/*,video/*,.mp3,.m4a,.wav,.aac,.flac,.ogg,.oga,.opus,.weba,.webm,.mp4,.m4v,.mov,.aiff,.aif">
    <button id="play" disabled>Play</button>
  </div>
  <div class="divider">or</div>
  <div class="row">
    <button id="mic">Use microphone</button>
  </div>

  <div class="slider-group">
    <div class="slider-label">
      <span>Colour intensity</span>
      <span class="value" id="intensityVal">0.15</span>
    </div>
    <div class="slider-row">
      <input type="range" id="intensitySlider"
             min="0.05" max="0.40" step="0.01" value="0.15">
      <button type="button" id="intensityReset">Reset</button>
    </div>
  </div>

  <div class="slider-group">
    <div class="slider-label">
      <span>Speed</span>
      <span class="value" id="speedVal">0.40</span>
    </div>
    <div class="slider-row">
      <input type="range" id="speedSlider"
             min="0.10" max="1.20" step="0.05" value="0.40">
      <button type="button" id="speedReset">Reset</button>
    </div>
  </div>

  <div id="status">Load a file, or use the mic and play your track on any speaker.</div>
</div>

<script>
/* ============================================================
   Values from flo-bit text_effect_fluid (fork of Pavel Dobryakov, MIT)
   The two below are live-adjustable from the UI sliders.
   ============================================================ */

let SIM_SPEED = 0.4;
let COLOUR_INTENSITY = 0.15;

const SUNRAYS_WEIGHT = 1.0;
const CURL = 30;
const DENSITY_DISSIPATION = 1.0;
const VELOCITY_DISSIPATION = 0.1;
const PRESSURE_ITERATIONS = 20;
const SPLAT_FORCE = 1000;
const SPLAT_RADIUS_SLIDER = 0.25;
const START_HUE = 0.5;
const END_HUE = 1.0;

const canvas = document.getElementById('gl');
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const SIM_RES = isMobile ? 128 : 192;
const DYE_RES = isMobile ? 512 : 1024;

let gl = null;
let W = 0, H = 0;
let dye = null, velocity = null, divergence = null, curl = null, pressure = null;
let sunraysMaskFBO = null, sunraysFBO = null;
let P = {};
let blit = null;
let lastTime = 0;

function generateColor() {
  const hue = Math.random() * (END_HUE - START_HUE) + START_HUE;
  const c = HSVtoRGB(hue, 1.0, 1.0);
  c.r *= COLOUR_INTENSITY;
  c.g *= COLOUR_INTENSITY;
  c.b *= COLOUR_INTENSITY;
  return c;
}

function HSVtoRGB(h, s, v) {
  let r, g, b;
  const i = Math.floor(h * 6);
  const f = h * 6 - i;
  const p = v * (1 - s);
  const q = v * (1 - f * s);
  const t = v * (1 - (1 - f) * s);
  switch (i % 6) {
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    case 5: r = v; g = p; b = q; break;
  }
  return { r, g, b };
}

const BASE_VS = `precision highp float;
attribute vec2 aPosition;
varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
uniform vec2 texelSize;
void main(){
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

const DISPLAY_FS = `precision highp float; precision highp sampler2D;
varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
uniform sampler2D uTexture;
uniform sampler2D uSunrays;
uniform float uSunraysWeight;
uniform vec2 texelSize;
void main(){
  vec3 c = texture2D(uTexture, vUv).rgb;
  vec3 lc = texture2D(uTexture, vL).rgb;
  vec3 rc = texture2D(uTexture, vR).rgb;
  vec3 tc = texture2D(uTexture, vT).rgb;
  vec3 bc = texture2D(uTexture, vB).rgb;
  float dx = length(rc) - length(lc);
  float dy = length(tc) - length(bc);
  vec3 n = normalize(vec3(dx, dy, length(texelSize)));
  vec3 l = vec3(0.0, 0.0, 1.0);
  float diffuse = clamp(dot(n, l) + 0.7, 0.7, 1.0);
  c *= diffuse;

  vec3 rays = texture2D(uSunrays, vUv).rgb;
  c += rays * uSunraysWeight;

  gl_FragColor = vec4(c, 1.0);
}`;

const CLEAR_FS = `precision mediump float; precision mediump sampler2D;
varying highp vec2 vUv; uniform sampler2D uTexture; uniform float value;
void main(){ gl_FragColor = value * texture2D(uTexture, vUv); }`;

const SPLAT_FS = `precision highp float; precision highp sampler2D;
varying vec2 vUv; uniform sampler2D uTarget; uniform float aspectRatio;
uniform vec3 color; uniform vec2 point; uniform float radius;
void main(){
  vec2 p = vUv - point.xy;
  p.x *= aspectRatio;
  vec3 splat = exp(-dot(p, p) / radius) * color;
  vec3 base = texture2D(uTarget, vUv).xyz;
  gl_FragColor = vec4(base + splat, 1.0);
}`;

const ADVECTION_FS = `precision highp float; precision highp sampler2D;
varying vec2 vUv; uniform sampler2D uVelocity; uniform sampler2D uSource;
uniform vec2 texelSize; uniform float dt; uniform float dissipation;
void main(){
  vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
  vec4 result = texture2D(uSource, coord);
  float decay = 1.0 + dissipation * dt;
  gl_FragColor = result / decay;
}`;

const DIVERGENCE_FS = `precision mediump float; precision mediump sampler2D;
varying highp vec2 vUv; varying highp vec2 vL; varying highp vec2 vR;
varying highp vec2 vT; varying highp vec2 vB;
uniform sampler2D uVelocity;
void main(){
  float L = texture2D(uVelocity, vL).x;
  float R = texture2D(uVelocity, vR).x;
  float T = texture2D(uVelocity, vT).y;
  float B = texture2D(uVelocity, vB).y;
  vec2 C = texture2D(uVelocity, vUv).xy;
  if (vL.x < 0.0) L = -C.x;
  if (vR.x > 1.0) R = -C.x;
  if (vT.y > 1.0) T = -C.y;
  if (vB.y < 0.0) B = -C.y;
  float div = 0.5 * (R - L + T - B);
  gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
}`;

const CURL_FS = `precision mediump float; precision mediump sampler2D;
varying highp vec2 vUv; varying highp vec2 vL; varying highp vec2 vR;
varying highp vec2 vT; varying highp vec2 vB;
uniform sampler2D uVelocity;
void main(){
  float L = texture2D(uVelocity, vL).y;
  float R = texture2D(uVelocity, vR).y;
  float T = texture2D(uVelocity, vT).x;
  float B = texture2D(uVelocity, vB).x;
  float vorticity = R - L - T + B;
  gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
}`;

const VORTICITY_FS = `precision highp float; precision highp sampler2D;
varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
uniform sampler2D uVelocity; uniform sampler2D uCurl;
uniform float curl; uniform float dt;
void main(){
  float L = texture2D(uCurl, vL).x;
  float R = texture2D(uCurl, vR).x;
  float T = texture2D(uCurl, vT).x;
  float B = texture2D(uCurl, vB).x;
  float C = texture2D(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 0.0001;
  force *= curl * C;
  force.y *= -1.0;
  vec2 velocity = texture2D(uVelocity, vUv).xy;
  velocity += force * dt;
  velocity = min(max(velocity, -1000.0), 1000.0);
  gl_FragColor = vec4(velocity, 0.0, 1.0);
}`;

const PRESSURE_FS = `precision mediump float; precision mediump sampler2D;
varying highp vec2 vUv; varying highp vec2 vL; varying highp vec2 vR;
varying highp vec2 vT; varying highp vec2 vB;
uniform sampler2D uPressure; uniform sampler2D uDivergence;
void main(){
  float L = texture2D(uPressure, vL).x;
  float R = texture2D(uPressure, vR).x;
  float T = texture2D(uPressure, vT).x;
  float B = texture2D(uPressure, vB).x;
  float divergence = texture2D(uDivergence, vUv).x;
  float pressure = (L + R + B + T - divergence) * 0.25;
  gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
}`;

const GRADIENT_SUBTRACT_FS = `precision mediump float; precision mediump sampler2D;
varying highp vec2 vUv; varying highp vec2 vL; varying highp vec2 vR;
varying highp vec2 vT; varying highp vec2 vB;
uniform sampler2D uPressure; uniform sampler2D uVelocity;
void main(){
  float L = texture2D(uPressure, vL).x;
  float R = texture2D(uPressure, vR).x;
  float T = texture2D(uPressure, vT).x;
  float B = texture2D(uPressure, vB).x;
  vec2 velocity = texture2D(uVelocity, vUv).xy;
  velocity.xy -= vec2(R - L, T - B);
  gl_FragColor = vec4(velocity, 0.0, 1.0);
}`;

const SUNRAYS_MASK_FS = `precision highp float;
precision highp sampler2D;
varying vec2 vUv;
uniform sampler2D uTexture;
void main(){
  vec4 c = texture2D(uTexture, vUv);
  float br = max(c.r, max(c.g, c.b));
  c.a = 1.0 - min(max(br * 20.0, 0.0), 0.8);
  gl_FragColor = c;
}`;

const SUNRAYS_FS = `precision highp float;
precision highp sampler2D;
varying vec2 vUv;
uniform sampler2D uTexture;
uniform vec2 texelSize;
uniform vec2 uSunPos;
void main(){
  float weight = 1.0;
  vec2 pos = vUv - uSunPos;
  vec2 dir = normalize(pos + 0.0001);
  vec2 uv = vUv - dir * texelSize * 2.0;

  vec3 accum = vec3(0.0);
  float w = 0.0;

  for (int i = 0; i < 14; i++) {
    accum += texture2D(uTexture, uv).rgb * weight;
    uv -= dir * texelSize * 2.0;
    w += weight;
    weight *= 0.97;
  }

  gl_FragColor = vec4(accum / w, 1.0);
}`;

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('[shader]', gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}
function makeProgram(fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, BASE_VS));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsSrc));
  gl.bindAttribLocation(p, 0, 'aPosition');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error('[program]', gl.getProgramInfoLog(p));
    return null;
  }
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    if (info) u[info.name] = gl.getUniformLocation(p, info.name);
  }
  return { p, u };
}
function createFBO(w, h, internal, format, type, filter) {
  gl.activeTexture(gl.TEXTURE0);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.viewport(0, 0, w, h);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return {
    texture: tex, fbo, width: w, height: h,
    texelSizeX: 1 / w, texelSizeY: 1 / h,
    attach(id) { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, tex); return id; }
  };
}
function createDoubleFBO(w, h, internal, format, type, filter) {
  let a = createFBO(w, h, internal, format, type, filter);
  let b = createFBO(w, h, internal, format, type, filter);
  return {
    width: w, height: h,
    texelSizeX: 1 / w, texelSizeY: 1 / h,
    get read() { return a; }, set read(v) { a = v; },
    get write() { return b; }, set write(v) { b = v; },
    swap() { const t = a; a = b; b = t; }
  };
}

function initGL() {
  gl = canvas.getContext('webgl2', {
    alpha: true, premultipliedAlpha: false,
    depth: false, stencil: false, antialias: false,
    preserveDrawingBuffer: true, powerPreference: 'high-performance'
  });
  if (!gl) { setStatus('WebGL2 not supported.', 'error'); return false; }
  if (!gl.getExtension('EXT_color_buffer_float')) {
    setStatus('Float textures not supported.', 'error');
    return false;
  }

  const simW = SIM_RES;
  const simH = Math.max(2, Math.round(SIM_RES * H / W));
  const dyeW = DYE_RES;
  const dyeH = Math.max(2, Math.round(DYE_RES * H / W));
  const srW = Math.max(2, Math.floor(W / 2));
  const srH = Math.max(2, Math.floor(H / 2));
  const half = gl.HALF_FLOAT;
  const lin = gl.LINEAR;
  const near = gl.NEAREST;

  dye = createDoubleFBO(dyeW, dyeH, gl.RGBA16F, gl.RGBA, half, lin);
  velocity = createDoubleFBO(simW, simH, gl.RG16F, gl.RG, half, lin);
  divergence = createFBO(simW, simH, gl.R16F, gl.RED, half, near);
  curl = createFBO(simW, simH, gl.R16F, gl.RED, half, near);
  pressure = createDoubleFBO(simW, simH, gl.R16F, gl.RED, half, near);
  sunraysMaskFBO = createFBO(srW, srH, gl.RGBA16F, gl.RGBA, half, lin);
  sunraysFBO = createFBO(srW, srH, gl.RGBA16F, gl.RGBA, half, lin);

  P.clear = makeProgram(CLEAR_FS);
  P.display = makeProgram(DISPLAY_FS);
  P.splat = makeProgram(SPLAT_FS);
  P.advection = makeProgram(ADVECTION_FS);
  P.divergence = makeProgram(DIVERGENCE_FS);
  P.curl = makeProgram(CURL_FS);
  P.vorticity = makeProgram(VORTICITY_FS);
  P.pressure = makeProgram(PRESSURE_FS);
  P.gradSub = makeProgram(GRADIENT_SUBTRACT_FS);
  P.sunraysMask = makeProgram(SUNRAYS_MASK_FS);
  P.sunrays = makeProgram(SUNRAYS_FS);

  if (!P.splat || !P.advection || !P.display || !P.sunrays || !P.sunraysMask) {
    setStatus('Shader compile failed.', 'error');
    return false;
  }

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  blit = (target, clear) => {
    if (target == null) { gl.viewport(0, 0, W, H); gl.bindFramebuffer(gl.FRAMEBUFFER, null); }
    else { gl.viewport(0, 0, target.width, target.height); gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo); }
    if (clear !== false) { gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  };

  return true;
}

function useProgram(pr) {
  if (!pr) return;
  gl.useProgram(pr.p);
  if (pr.u.texelSize) gl.uniform2f(pr.u.texelSize, 1 / velocity.width, 1 / velocity.height);
}

function correctRadius(radius) {
  const aspectRatio = W / H;
  if (aspectRatio > 1) radius *= aspectRatio;
  return radius;
}

function splat(x, y, dx, dy, color, radiusMult) {
  if (!P.splat) return;
  const rm = radiusMult || 1;
  gl.disable(gl.BLEND);
  useProgram(P.splat);
  if (P.splat.u.aspectRatio) gl.uniform1f(P.splat.u.aspectRatio, W / H);

  const radius = correctRadius(SPLAT_RADIUS_SLIDER / 100.0) * rm;

  gl.uniform1i(P.splat.u.uTarget, velocity.read.attach(0));
  gl.uniform3f(P.splat.u.color, dx, dy, 0);
  gl.uniform2f(P.splat.u.point, x, y);
  gl.uniform1f(P.splat.u.radius, radius);
  blit(velocity.write, false); velocity.swap();

  gl.uniform1i(P.splat.u.uTarget, dye.read.attach(0));
  gl.uniform3f(P.splat.u.color, color.r, color.g, color.b);
  gl.uniform2f(P.splat.u.point, x, y);
  gl.uniform1f(P.splat.u.radius, radius);
  blit(dye.write, false); dye.swap();
}

function stepFluid(dt) {
  if (!gl) return;
  gl.disable(gl.BLEND);

  useProgram(P.curl);
  gl.uniform1i(P.curl.u.uVelocity, velocity.read.attach(0));
  blit(curl);

  useProgram(P.vorticity);
  gl.uniform1i(P.vorticity.u.uVelocity, velocity.read.attach(0));
  gl.uniform1i(P.vorticity.u.uCurl, curl.attach(1));
  gl.uniform1f(P.vorticity.u.curl, CURL);
  gl.uniform1f(P.vorticity.u.dt, dt);
  blit(velocity.write); velocity.swap();

  useProgram(P.divergence);
  gl.uniform1i(P.divergence.u.uVelocity, velocity.read.attach(0));
  blit(divergence);

  useProgram(P.clear);
  gl.uniform1i(P.clear.u.uTexture, pressure.read.attach(0));
  gl.uniform1f(P.clear.u.value, 0.8);
  blit(pressure.write); pressure.swap();

  useProgram(P.pressure);
  gl.uniform1i(P.pressure.u.uDivergence, divergence.attach(0));
  for (let i = 0; i < PRESSURE_ITERATIONS; i++) {
    gl.uniform1i(P.pressure.u.uPressure, pressure.read.attach(1));
    blit(pressure.write); pressure.swap();
  }

  useProgram(P.gradSub);
  gl.uniform1i(P.gradSub.u.uPressure, pressure.read.attach(0));
  gl.uniform1i(P.gradSub.u.uVelocity, velocity.read.attach(1));
  blit(velocity.write); velocity.swap();

  useProgram(P.advection);
  gl.uniform2f(P.advection.u.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(P.advection.u.uVelocity, velocity.read.attach(0));
  gl.uniform1i(P.advection.u.uSource, velocity.read.attach(0));
  gl.uniform1f(P.advection.u.dt, dt);
  gl.uniform1f(P.advection.u.dissipation, VELOCITY_DISSIPATION);
  blit(velocity.write); velocity.swap();

  gl.uniform1i(P.advection.u.uVelocity, velocity.read.attach(0));
  gl.uniform1i(P.advection.u.uSource, dye.read.attach(1));
  gl.uniform1f(P.advection.u.dt, dt);
  gl.uniform1f(P.advection.u.dissipation, DENSITY_DISSIPATION);
  blit(dye.write); dye.swap();
}

function renderSunrays() {
  if (!gl) return;
  useProgram(P.sunraysMask);
  gl.uniform1i(P.sunraysMask.u.uTexture, dye.read.attach(0));
  blit(sunraysMaskFBO, false);

  useProgram(P.sunrays);
  gl.uniform1i(P.sunrays.u.uTexture, sunraysMaskFBO.attach(0));
  gl.uniform2f(P.sunrays.u.texelSize, 1 / sunraysFBO.width, 1 / sunraysFBO.height);
  gl.uniform2f(P.sunrays.u.uSunPos, 0.5, 0.5);
  blit(sunraysFBO, false);
}

function displayFluid() {
  if (!gl) return;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  useProgram(P.display);
  if (P.display.u.texelSize) gl.uniform2f(P.display.u.texelSize, 1 / W, 1 / H);
  gl.uniform1i(P.display.u.uTexture, dye.read.attach(0));
  gl.uniform1i(P.display.u.uSunrays, sunraysFBO.attach(1));
  gl.uniform1f(P.display.u.uSunraysWeight, SUNRAYS_WEIGHT);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ============================================================
   Audio
   ============================================================ */
let audioCtx = null;
let analyser = null;
let sourceNode = null;
let audioEl = null;
let micStream = null;
let freqData = null;

const statusEl = document.getElementById('status');
const nameEl = document.getElementById('name');
const playBtn = document.getElementById('play');
const micBtn = document.getElementById('mic');
const fileInput = document.getElementById('file');

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = kind || '';
}

function setupAudio(file) {
  if (audioEl) { audioEl.pause(); audioEl = null; sourceNode = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx) { try { audioCtx.close(); } catch(e){} audioCtx = null; }

  audioEl = new Audio();
  audioEl.src = URL.createObjectURL(file);
  audioEl.crossOrigin = 'anonymous';
  audioEl.loop = false;

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.75;
  freqData = new Uint8Array(analyser.frequencyBinCount);

  sourceNode = audioCtx.createMediaElementSource(audioEl);
  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);

  audioEl.addEventListener('error', () => setStatus('Cannot decode this file', 'error'));
  audioEl.addEventListener('loadedmetadata', () => {
    setStatus('Ready (' + Math.round(audioEl.duration) + 's) — tap Play', 'success');
  });
  audioEl.addEventListener('ended', () => {
    playBtn.textContent = 'Play';
    playBtn.classList.remove('active');
    setStatus('Ended', '');
  });

  return true;
}

async function setupMic() {
  if (audioEl) { audioEl.pause(); audioEl = null; sourceNode = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx) { try { audioCtx.close(); } catch(e){} audioCtx = null; }

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.75;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    sourceNode = audioCtx.createMediaStreamSource(micStream);
    sourceNode.connect(analyser);
    micBtn.classList.add('active');
    micBtn.textContent = 'Stop microphone';
    playBtn.disabled = true;
    playBtn.textContent = 'Play';
    playBtn.classList.remove('active');
    nameEl.textContent = 'Listening via microphone';
    setStatus('Listening — play your track.', 'success');
  } catch (e) {
    setStatus('Mic blocked: ' + (e.message || e), 'error');
  }
}

function stopMic() {
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (sourceNode) { try { sourceNode.disconnect(); } catch(e){} sourceNode = null; }
  if (audioCtx) { try { audioCtx.close(); } catch(e){} audioCtx = null; }
  analyser = null;
  freqData = null;
  micBtn.classList.remove('active');
  micBtn.textContent = 'Use microphone';
  nameEl.textContent = 'No audio loaded';
  setStatus('Stopped.', '');
}

function getBands() {
  if (!analyser || !freqData) return { bass: 0, mids: 0, treble: 0, energy: 0 };
  analyser.getByteFrequencyData(freqData);
  let bass = 0, mids = 0, treble = 0;
  for (let i = 1; i < 12; i++)   bass   += freqData[i];
  for (let i = 12; i < 93; i++)  mids   += freqData[i];
  for (let i = 93; i < 740; i++) treble += freqData[i];
  bass   = bass   / (11  * 255);
  mids   = mids   / (81  * 255);
  treble = treble / (647 * 255);
  const energy = Math.min(1, bass * 0.5 + mids * 0.35 + treble * 0.15);
  return { bass, mids, treble, energy };
}

/* ============================================================
   Emitters — calm, sparse, breathing
   ============================================================ */
let lastBass = 0, lastTreble = 0, lastDrift = 0;

function applyAudio(bands, time) {
  // Continuous drift path — the baseline motion
  if (time - lastDrift > 0.05) {
    lastDrift = time;
    const pathSpeed = 0.85;
    const ax = 0.34, ay = 0.30;
    const sx = 0.5 + Math.sin(time * pathSpeed) * ax;
    const sy = 0.5 + Math.cos(time * pathSpeed * 0.73) * ay;
    const vx =  Math.cos(time * pathSpeed) * ax * pathSpeed;
    const vy = -Math.sin(time * pathSpeed * 0.73) * ay * pathSpeed * 0.73;
    const col = generateColor();
    const force = (SPLAT_FORCE * (0.3 + bands.energy * 0.7)) * 0.35;
    splat(sx, sy, vx * force, vy * force, col, 1.0);
  }

  // Bass — occasional punctuation
  if (bands.bass > 0.60 && time - lastBass > 0.55) {
    lastBass = time;
    const col = generateColor();
    const px = -0.15 + Math.random() * 1.3;
    const py = -0.15 + Math.random() * 1.3;
    const ox = px - 0.5;
    const oy = py - 0.5;
    const od = Math.hypot(ox, oy) + 0.001;
    const swirlX = -oy / od;
    const swirlY =  ox / od;
    const radialMix = 0.25;
    const dx = swirlX * (1 - radialMix) + (ox / od) * radialMix;
    const dy = swirlY * (1 - radialMix) + (oy / od) * radialMix;
    const force = SPLAT_FORCE * (0.5 + bands.energy * 0.8);
    splat(px, py, dx * force, dy * force, col, 1.2);
  }

  // Treble — sparse small accents
  if (bands.treble > 0.40 && time - lastTreble > 0.55) {
    lastTreble = time;
    const fragCount = 1 + Math.floor(Math.random() * 2);
    for (let i = 0; i < fragCount; i++) {
      const px = -0.1 + Math.random() * 1.2;
      const py = -0.1 + Math.random() * 1.2;
      const ang = Math.random() * Math.PI * 2;
      const col = generateColor();
      const force = SPLAT_FORCE * (0.2 + Math.random() * 0.35);
      splat(px, py, Math.cos(ang) * force, Math.sin(ang) * force, col, 0.5);
    }
  }
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(canvas.clientWidth * dpr);
  H = Math.round(canvas.clientHeight * dpr);
  if (W < 2 || H < 2) return;
  canvas.width = W;
  canvas.height = H;
  if (gl) { initGL(); }
}

let lastFrameT = 0;
const startT = performance.now();

function frame(now) {
  const time = (now - startT) / 1000;
  const rawDt = lastFrameT ? Math.min(0.05, time - lastFrameT) : 0.016;
  lastFrameT = time;

  const dt = rawDt * SIM_SPEED;

  const bands = getBands();
  applyAudio(bands, time);

  if (gl) {
    stepFluid(dt);
    renderSunrays();
    displayFluid();
  }

  document.getElementById('mBass').style.width = Math.round(bands.bass * 100) + '%';
  document.getElementById('mMids').style.width = Math.round(bands.mids * 100) + '%';
  document.getElementById('mTreble').style.width = Math.round(bands.treble * 100) + '%';

  requestAnimationFrame(frame);
}

/* ============================================================
   UI wiring
   ============================================================ */
fileInput.addEventListener('change', () => {
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;
  nameEl.textContent = f.name + ' (' + (f.size / 1024 / 1024).toFixed(1) + ' MB)';
  setStatus('Loading…', '');
  const ok = setupAudio(f);
  if (ok) {
    playBtn.disabled = false;
    playBtn.textContent = 'Play';
    playBtn.classList.remove('active');
    micBtn.classList.remove('active');
    micBtn.textContent = 'Use microphone';
  } else {
    playBtn.disabled = true;
  }
});

playBtn.addEventListener('click', async () => {
  if (!audioEl) return;
  try {
    if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
    if (audioEl.paused) {
      await audioEl.play();
      playBtn.textContent = 'Pause';
      playBtn.classList.add('active');
      setStatus('Playing', 'success');
    } else {
      audioEl.pause();
      playBtn.textContent = 'Play';
      playBtn.classList.remove('active');
      setStatus('Paused', '');
    }
  } catch (e) {
    setStatus('Playback failed: ' + (e.message || e), 'error');
  }
});

micBtn.addEventListener('click', () => {
  if (micStream) stopMic();
  else setupMic();
});

/* ---- Live sliders ---- */
const intensitySlider = document.getElementById('intensitySlider');
const intensityVal = document.getElementById('intensityVal');
const intensityReset = document.getElementById('intensityReset');

const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
const speedReset = document.getElementById('speedReset');

intensitySlider.addEventListener('input', () => {
  COLOUR_INTENSITY = Number(intensitySlider.value);
  intensityVal.textContent = COLOUR_INTENSITY.toFixed(2);
});
intensityReset.addEventListener('click', () => {
  COLOUR_INTENSITY = 0.15;
  intensitySlider.value = '0.15';
  intensityVal.textContent = '0.15';
});

speedSlider.addEventListener('input', () => {
  SIM_SPEED = Number(speedSlider.value);
  speedVal.textContent = SIM_SPEED.toFixed(2);
});
speedReset.addEventListener('click', () => {
  SIM_SPEED = 0.4;
  speedSlider.value = '0.40';
  speedVal.textContent = '0.40';
});

window.addEventListener('resize', () => setTimeout(resize, 150));
window.addEventListener('orientationchange', () => setTimeout(resize, 300));

resize();
if (!initGL()) {
  setStatus('WebGL2 not available.', 'error');
} else {
  setStatus('Load a file, or use the mic and play your track on any speaker.', '');
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
