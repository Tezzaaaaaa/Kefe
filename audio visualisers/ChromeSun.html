<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kefe — Ra</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:#000; color:#e5e7eb;
    font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  #stage { flex:1; position:relative; background:#000; }
  #stage canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #ui { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    padding:10px 14px; background:#050505; border-top:1px solid #1a1a1a;
    font-size:11px; letter-spacing:0.5px; text-transform:uppercase; }
  #ui select,#ui button,#ui label { background:#0e0e0e; color:#fff;
    border:1px solid #2a2a2a; padding:8px 12px; border-radius:0;
    font:inherit; letter-spacing:inherit; text-transform:inherit;
    cursor:pointer; min-height:34px; display:inline-flex;
    align-items:center; justify-content:center; transition:border-color .15s; }
  #ui select:hover,#ui button:hover,#ui label:hover { border-color:#555; }
  #ui button.active { background:#fff; color:#000; border-color:#fff; }
  #ui button:disabled { opacity:.35; cursor:default; }
  #ui input[type=file] { display:none; }
  #ui .status { opacity:.55; padding-left:12px; border-left:1px solid #1a1a1a;
    margin-left:4px; flex:1; min-width:100px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; text-transform:none; letter-spacing:0; }
  #ui .slider { display:flex; align-items:center; gap:6px; padding:0 10px;
    border:1px solid #2a2a2a; background:#0e0e0e; min-height:34px; }
  #ui .slider label { padding:0; min-height:auto; border:0; background:none; }
  #ui .slider input[type=range] { -webkit-appearance:none; appearance:none;
    width:78px; height:3px; background:#2a2a2a; border-radius:2px;
    outline:none; cursor:pointer; }
  #ui .slider input[type=range]::-webkit-slider-thumb { -webkit-appearance:none;
    width:12px; height:12px; border-radius:50%; background:#fff; cursor:pointer; border:0; }
  #ui .slider input[type=range]::-moz-range-thumb { width:12px; height:12px;
    border:0; border-radius:50%; background:#fff; cursor:pointer; }
  #ui .slider .val { min-width:36px; text-align:right; color:#fff;
    font-variant-numeric:tabular-nums; text-transform:none; letter-spacing:0; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui">
  <label for="file">Load audio</label>
  <input type="file" id="file" accept="audio/*">
  <button id="play" disabled>Play</button>
  <button id="mic">Mic</button>
  <div class="slider"><label>Speed</label>
    <input type="range" id="speed" min="0" max="100" step="1" value="5">
    <span class="val" id="speedVal">5%</span></div>
  <div class="slider"><label>Spread</label>
    <input type="range" id="spread" min="0.5" max="4" step="0.05" value="2.5">
    <span class="val" id="spreadVal">2.50&times;</span></div>
  <div class="slider"><label>Reaction</label>
    <input type="range" id="reaction" min="0" max="3" step="0.05" value="1.5">
    <span class="val" id="reactionVal">1.50&times;</span></div>
  <div class="slider"><label>Flare</label>
    <input type="range" id="flare" min="0" max="3" step="0.05" value="1">
    <span class="val" id="flareVal">1.00&times;</span></div>
  <div class="slider"><label>Breath</label>
    <input type="range" id="breath" min="0" max="3" step="0.05" value="1">
    <span class="val" id="breathVal">1.00&times;</span></div>
  <div class="slider"><label>Focus</label>
    <input type="range" id="focus" min="0" max="2" step="0.05" value="1">
    <span class="val" id="focusVal">1.00&times;</span></div>
  <span class="status" id="status">NO AUDIO</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   Kefe — Ra
   A perfect sphere of bronze and white-hot spikes at rest.
   Bass inflates and densifies it. Vocals drive travelling flares.
   Transients (snares, hats, plucks) fire random clusters of spikes
   that shoot out and snap back. Mouse hover pulls a cone of focus
   across the surface — rods near the cursor brighten and lean.
   ============================================================ */

var stage=document.getElementById('stage');
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);

var camera=new THREE.PerspectiveCamera(35,1,1,20000);
camera.position.set(0,0,42);
camera.lookAt(0,0,0);

var renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x000000,1);
stage.appendChild(renderer.domElement);

/* ---- lights ---- */
scene.add(new THREE.AmbientLight(0x2a1408,1.1));
var key=new THREE.DirectionalLight(0xffe8b0,1.35); key.position.set(6,7,9); scene.add(key);
var rim=new THREE.DirectionalLight(0xff7a28,0.75); rim.position.set(-7,-5,-8); scene.add(rim);
var centre=new THREE.PointLight(0xffffff,1.6,26); centre.position.set(0,0,0); scene.add(centre);

/* ---- audio ---- */
var audioCtx=null,analyser=null,sourceNode=null,micSource=null,micStream=null,decodedBuffer=null;
var freqBytes=null,timeFloats=null;
var sBass=0,sMid=0,sTreb=0,sVocal=0,sEnergy=0,sKick=0,sTransient=0;
var bassAvg=0.15,vocalAvg=0.15,trebAvg=0.12;
var SMOOTH=0.18;

var playBtn=document.getElementById('play'),micBtn=document.getElementById('mic'),
    fileInput=document.getElementById('file'),statusEl=document.getElementById('status'),
    speedIn=document.getElementById('speed'),speedVal=document.getElementById('speedVal'),
    spreadIn=document.getElementById('spread'),spreadVal=document.getElementById('spreadVal'),
    reactionIn=document.getElementById('reaction'),reactionVal=document.getElementById('reactionVal'),
    flareIn=document.getElementById('flare'),flareVal=document.getElementById('flareVal'),
    breathIn=document.getElementById('breath'),breathVal=document.getElementById('breathVal'),
    focusIn=document.getElementById('focus'),focusVal=document.getElementById('focusVal');

var speedMul=0.05, spreadMul=2.5, reactionMul=1.5, flareMul=1.0, breathMul=1.0, focusMul=1.0;

function setStatus(t,k){statusEl.textContent=t;
  statusEl.style.color=k==='err'?'#f88':k==='ok'?'#9fa':'';}

function initAudio(){
  if(audioCtx)return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=2048;analyser.smoothingTimeConstant=0.78;
  freqBytes=new Uint8Array(analyser.frequencyBinCount);
  timeFloats=new Float32Array(analyser.fftSize);
}
function killSrc(){if(sourceNode){try{sourceNode.stop()}catch(e){}
  try{sourceNode.disconnect()}catch(e){}sourceNode=null;}}
function killMic(){if(micSource){try{micSource.disconnect()}catch(e){}micSource=null;}
  if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null;}
  micBtn.classList.remove('active');micBtn.textContent='Mic';}

fileInput.addEventListener('change',async function(e){
  var f=e.target.files[0];if(!f)return;
  initAudio();if(audioCtx.state==='suspended')await audioCtx.resume();
  killSrc();killMic();playBtn.classList.remove('active');playBtn.textContent='Play';
  setStatus('DECODING');
  try{var ab=await f.arrayBuffer();
    decodedBuffer=await audioCtx.decodeAudioData(ab);
    playBtn.disabled=false;
    setStatus(f.name.length>24?f.name.slice(0,22)+'…':f.name,'ok');
  }catch(err){decodedBuffer=null;playBtn.disabled=true;setStatus('DECODE FAIL','err');}
});

playBtn.addEventListener('click',async function(){
  if(!decodedBuffer)return;
  initAudio();if(audioCtx.state==='suspended')await audioCtx.resume();
  if(sourceNode){killSrc();playBtn.classList.remove('active');
    playBtn.textContent='Play';setStatus('PAUSED');return;}
  killMic();
  sourceNode=audioCtx.createBufferSource();
  sourceNode.buffer=decodedBuffer;sourceNode.loop=true;
  sourceNode.connect(analyser);analyser.connect(audioCtx.destination);
  sourceNode.start(0);
  playBtn.classList.add('active');playBtn.textContent='Pause';setStatus('PLAYING','ok');
});

micBtn.addEventListener('click',async function(){
  initAudio();if(audioCtx.state==='suspended')await audioCtx.resume();
  if(micStream){killMic();setStatus('MIC OFF');return;}
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    killSrc();playBtn.classList.remove('active');playBtn.textContent='Play';
    micSource=audioCtx.createMediaStreamSource(micStream);micSource.connect(analyser);
    micBtn.classList.add('active');micBtn.textContent='Stop mic';setStatus('MIC LIVE','ok');
  }catch(err){setStatus('MIC DENIED','err');}
});

speedIn.addEventListener('input',function(){
  // Speed curve:
  //   0   → frozen
  //   5   → 1x baseline
  //   50  → ~1.6x (still slow in the middle — barely above baseline)
  //   75  → ~3x
  //   100 → 8x
  // Quartic ease: the middle of the slider stays near baseline, all the
  // real speed happens in the top quarter.
  var pct=Number(speedIn.value);
  var sm;
  if(pct<=5){
    sm=pct/5;
  }else if(pct<=90){
    var u=(pct-5)/85;
    sm=1.0 - u*0.5;
  }else{
    var u=(pct-90)/10;
    sm=0.5 + u*0.1;
  }
  speedMul=sm;
  speedVal.textContent=pct+'%';
});
// run once at startup so the initial value takes effect
speedIn.dispatchEvent(new Event('input'));
spreadIn.addEventListener('input',function(){spreadMul=Number(spreadIn.value);spreadVal.textContent=spreadMul.toFixed(2)+'\u00d7';});
reactionIn.addEventListener('input',function(){reactionMul=Number(reactionIn.value);reactionVal.textContent=reactionMul.toFixed(2)+'\u00d7';});
flareIn.addEventListener('input',function(){flareMul=Number(flareIn.value);flareVal.textContent=flareMul.toFixed(2)+'\u00d7';});
breathIn.addEventListener('input',function(){breathMul=Number(breathIn.value);breathVal.textContent=breathMul.toFixed(2)+'\u00d7';});
focusIn.addEventListener('input',function(){focusMul=Number(focusIn.value);focusVal.textContent=focusMul.toFixed(2)+'\u00d7';});

/* ---- mouse tracking ---- */
var mouseNX=0, mouseNY=0;         // normalised -1..1
var mousePX=0, mousePY=0;         // smoothed position
addEventListener('mousemove',function(e){
  var r=stage.getBoundingClientRect();
  mouseNX=((e.clientX-r.left)/r.width)*2-1;
  mouseNY=-(((e.clientY-r.top)/r.height)*2-1);
});
addEventListener('mouseleave',function(){mouseNX=0;mouseNY=0;});

/* ---- band energy + onsets ---- */
function updateAudio(){
  if(!analyser){
    var t=performance.now()*0.001;
    sBass=0.30+Math.sin(t*0.9)*0.12;
    sMid=0.25+Math.sin(t*0.7)*0.08;
    sTreb=0.20+Math.sin(t*1.4)*0.10;
    sVocal=0.25+Math.sin(t*0.5)*0.10;
    sEnergy=0.28+Math.sin(t*0.6)*0.05;
    sKick=0.10+Math.sin(t*1.9)*0.06;
    sTransient=0.08+Math.sin(t*2.6)*0.05;
    return;
  }
  analyser.getByteFrequencyData(freqBytes);
  analyser.getFloatTimeDomainData(timeFloats);
  var n=freqBytes.length;
  var nyq=audioCtx.sampleRate/2,bins=n;

  function band(hzLo,hzHi){
    var b0=Math.floor(hzLo/nyq*bins);
    var b1=Math.max(b0+1,Math.ceil(hzHi/nyq*bins));
    if(b1>bins)b1=bins;
    var s=0,c=0;
    for(var b=b0;b<b1;b++){s+=freqBytes[b];c++;}
    return (c?s/c:0)/255;
  }

  var rb=band(30,140);
  var rm=band(140,800);
  var rt=band(800,3500);
  var rv=band(900,3800);
  var re=(rb+rm+rt)/3;

  bassAvg+=(rb-bassAvg)*0.05;
  vocalAvg+=(rv-vocalAvg)*0.05;
  trebAvg+=(rt-trebAvg)*0.06;

  var kickNow=Math.max(0,rb-bassAvg*1.35);
  // transient: treble spikes not explained by the running mean
  var transNow=Math.max(0,rt-trebAvg*1.5);

  function env(cur,val,att,rel){return val>cur?cur+(val-cur)*att:cur+(val-cur)*rel;}

  sBass=env(sBass,Math.min(1.6,rb*3.0),0.85,0.04);
  sMid=env(sMid,Math.min(1.6,rm*2.5),0.60,0.03);
  sTreb=env(sTreb,Math.min(1.6,rt*2.8),0.70,0.04);
  sVocal=env(sVocal,Math.min(1.6,rv*2.8),0.65,0.03);
  sEnergy=env(sEnergy,Math.min(1.6,re*2.4),0.55,0.03);
  sKick=env(sKick,Math.min(1.6,kickNow*4.0),0.98,0.06);
  sTransient=env(sTransient,Math.min(1.6,transNow*4.0),0.98,0.18);
}

/* ---- colour ramp: patina bronze base → white-hot tip ---- */
var RAMP=[
  {c:new THREE.Color(0.28,0.14,0.05), e:new THREE.Color(0.10,0.03,0.00)}, // deep bronze patina
  {c:new THREE.Color(0.42,0.22,0.07), e:new THREE.Color(0.16,0.06,0.00)},
  {c:new THREE.Color(0.62,0.34,0.10), e:new THREE.Color(0.26,0.11,0.01)},
  {c:new THREE.Color(0.88,0.52,0.14), e:new THREE.Color(0.40,0.20,0.02)},
  {c:new THREE.Color(1.00,0.72,0.24), e:new THREE.Color(0.52,0.34,0.06)},
  {c:new THREE.Color(1.00,0.88,0.42), e:new THREE.Color(0.62,0.48,0.14)},
  {c:new THREE.Color(1.00,0.98,0.72), e:new THREE.Color(0.75,0.68,0.32)}  // white-hot
];

/* ---- rod geometry: tapered spike (sharp at tip) ---- */
var rodGeom=null;
function getRodGeom(){
  if(!rodGeom){
    // Bottom radius 1, top radius 0.02 — an obelisk spike.
    // After rotateZ(-90°) the sharp end faces +X (our outward axis).
    rodGeom=new THREE.CylinderGeometry(0.02,1.0,1.0,7,1,false);
    rodGeom.rotateZ(-Math.PI/2);
  }
  return rodGeom;
}

/* ---- state ---- */
var MAX_PER_COLOR=5000;
var meshes=[];
var rods=[];
var driftClock=0, spinClock=0;
var smoothBass=0,smoothMid=0,smoothTreb=0,smoothVocal=0,smoothEnergy=0,smoothKick=0,smoothTransient=0;

var _up=new THREE.Vector3(0,1,0);
var _xAxis=new THREE.Vector3(1,0,0);
var _v1=new THREE.Vector3(),_v2=new THREE.Vector3();
var _qA=new THREE.Quaternion(),_qS=new THREE.Quaternion(),_qF=new THREE.Quaternion();
var _dummy=new THREE.Object3D();

/* ---- build ---- */
function buildScene(){
  for(var i=0;i<meshes.length;i++){
    scene.remove(meshes[i]);
    meshes[i].material.dispose();
  }
  meshes.length=0; rods.length=0;
  driftClock=0; spinClock=0;
  smoothBass=smoothMid=smoothTreb=smoothVocal=smoothEnergy=smoothKick=smoothTransient=0;

  for(var ci=0;ci<RAMP.length;ci++){
    var mat=new THREE.MeshStandardMaterial({
      color:RAMP[ci].c, emissive:RAMP[ci].e,
      metalness:1.0, roughness:0.22,
      side:THREE.DoubleSide, flatShading:false
    });
    var m=new THREE.InstancedMesh(getRodGeom(),mat,MAX_PER_COLOR);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.frustumCulled=false;
    m.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(MAX_PER_COLOR*3),3);
    m.instanceColor.setUsage(THREE.DynamicDrawUsage);
    scene.add(m);
    meshes.push(m);
  }

  /* ---- SEED: shells distributed with an extra one squeezed in near the edge */
  // The lT list below is not evenly spaced: we place one extra shell close to
  // the outermost, so the outer shell reads as "doubled up".
  var LAYER_TS=[
    0.000, 0.111, 0.222, 0.333, 0.444, 0.556, 0.667, 0.778, 0.880, 0.940, 1.000
  ];
  var LAYERS=LAYER_TS.length;
  var BASE_R=1.0, MAX_R=3.2;
  var DENSITY=40;                // rods per unit surface area
  var golden=Math.PI*(3-Math.sqrt(5));

  for(var layer=0;layer<LAYERS;layer++){
    var lT=LAYER_TS[layer];
    var shellR=BASE_R+(MAX_R-BASE_R)*lT;
    // CONSTANT across layers: every rod on every shell is the same quiet length.
    var quietLen=1.55;
    // INVERTED: inner shells get the brightest end of the ramp, outer get darkest
    var colourIdx=Math.min(RAMP.length-1,Math.round((1-lT)*(RAMP.length-1)));

    var area=4*Math.PI*shellR*shellR;
    var count=Math.max(24,Math.round(area*DENSITY));
    var phase=layer*golden*0.5;

    for(var k=0;k<count;k++){
      var y=1-(k/(count-1))*2;
      var rY=Math.sqrt(Math.max(0,1-y*y));
      var theta=golden*k+phase;
      var nx=Math.cos(theta)*rY;
      var ny=y;
      var nz=Math.sin(theta)*rY;

      rods.push({
        nx:nx,ny:ny,nz:nz,
        baseRadius:shellR,
        quietLen:quietLen,
        flareLen:quietLen*0.55,
        radius:0.050,
        colourIdx:colourIdx,
        currentFlare:0,
        // per-rod random values so each rod has its own reaction threshold
        fireThreshold: 0.15 + Math.random()*0.55,
        kickOff:       0.15 + Math.random()*0.60,
        currentShot:0,
        // subtle sway
        sway:Math.random()*Math.PI*2,
        swaySpeed:0.20+Math.random()*0.20,
        swayAmp:0.006+Math.random()*0.010,
        // spin
        spinPhase:Math.random()*Math.PI*2,
        spinSpeed:0.12+Math.random()*0.22
      });
    }
  }

  // precompute each rod's tangent frame once
  for(var i=0;i<rods.length;i++){
    var r=rods[i];
    _v1.set(r.nx,r.ny,r.nz);
    _v2.crossVectors(_up,_v1);
    if(_v2.lengthSq()<1e-6)_v2.set(1,0,0);
    _v2.normalize();
    r.t1x=_v2.x; r.t1y=_v2.y; r.t1z=_v2.z;
    r.t2x=r.ny*r.t1z-r.nz*r.t1y;
    r.t2y=r.nz*r.t1x-r.nx*r.t1z;
    r.t2z=r.nx*r.t1y-r.ny*r.t1x;
  }
}

/* ---- main update ---- */
function update(dt){
  smoothBass   +=(sBass   -smoothBass   )*0.10;
  smoothMid    +=(sMid    -smoothMid    )*0.10;
  smoothTreb   +=(sTreb   -smoothTreb   )*0.10;
  smoothVocal  +=(sVocal  -smoothVocal  )*0.10;
  smoothEnergy +=(sEnergy -smoothEnergy )*0.10;
  smoothKick   +=(sKick   -smoothKick   )*0.15;
  smoothTransient+=(sTransient-smoothTransient)*0.25;

  // Only advance the animation clock when there's audio energy.
  // At silence, nothing moves.
  var audioAlive = Math.min(1, sEnergy*6 + sBass*4 + sVocal*4 + sTransient*3);
  driftClock+=dt*speedMul*audioAlive;
  spinClock +=dt*speedMul*audioAlive;

  // mouse screen position → 3D direction on the sphere (project cursor onto
  // a plane in front of camera, then normalise)
  mousePX+=(mouseNX-mousePX)*0.12;
  mousePY+=(mouseNY-mousePY)*0.12;
  // 35° FOV at ~42 units distance → half-height at z=0 ≈ 42*tan(17.5°) ≈ 13.2
  var halfH=13.2, aspect=camera.aspect||1;
  var mx=mousePX*halfH*aspect;
  var my=mousePY*halfH;
  var mz=6.0;                              // slightly in front of sphere
  var mlen=Math.sqrt(mx*mx+my*my+mz*mz)||1;
  mx/=mlen; my/=mlen; mz/=mlen;

  var counts=new Array(RAMP.length); for(var z=0;z<RAMP.length;z++)counts[z]=0;

  // Active transient cluster — rotates each time a transient fires.
  // Rods in this cluster get a strong outward shot.
  var transientStrength=smoothTransient*reactionMul*2.5;

  for(var i=0;i<rods.length;i++){
    var r=rods[i];

    // ---- per-rod wobble, boosted for inner rods so they visibly dance ----
    // Compute a radius-based boost: inner rods (small baseRadius) get a
    // much bigger wobble, outer rods a smaller one. Prevents the inner
    // shell from looking frozen.
    var innerBoost = 1.0 + (1.0 - Math.min(1, r.baseRadius/2.2)) * 5.0;

    // Two noise terms: a slow sin (constant life) plus a fresh random
    // jitter each frame so nothing is ever perfectly still.
    var wobX = Math.sin(driftClock*2.3 + r.spinPhase*5.1);
    var wobY = Math.cos(driftClock*1.9 + r.spinPhase*7.7);
    // Random jitter removed — silence is perfect stillness.
    var speedGate = 1.0;
    var jitterX = 0;
    var jitterY = 0;

    // At rest, sway is zero. Only audio opens it.
    var restSway = 0;
    var audioSway = (smoothBass*0.45 + smoothMid*0.20 + smoothVocal*0.25)*innerBoost;
    var swayAmt = (restSway + audioSway) * (1 + 0.20*smoothMid);

    var t1Push = (wobX + jitterX) * swayAmt;
    var t2Push = (wobY + jitterY) * swayAmt;

    // ---- per-rod vocal reaction — pure white noise per frame ----
    // No clock. No phase. Just a random roll every frame. The probability
    // of firing is proportional to the live vocal energy, so different
    // rods fire on every vocal hit — neighbours have no relationship to
    // each other. No wave, no bands, no clusters.
    var fireRoll = Math.random();
    var vocalProb = smoothVocal * flareMul * 1.6 * speedGate;
    var targetFlare = 0;
    if(fireRoll < vocalProb){
      targetFlare = 0.6 + Math.random()*1.6;
    }
    // very fast lerp — the rod snaps out and back
    r.currentFlare += (targetFlare - r.currentFlare) * 0.55;

    // ---- per-rod transient reaction — also pure white noise ----
    // Independent random roll each frame, weighted by transient strength.
    // Kick / snare / hat produce a fresh random spray of rods every hit.
    var shotTarget = 0;
    if(smoothTransient > 0.03){
      var shotRoll = Math.random();
      var shotProb = smoothTransient * transientStrength * 0.9 * speedGate;
      if(shotRoll < shotProb){
        shotTarget = 1.0 + Math.random()*2.2;
      }
    }
    r.currentShot += (shotTarget - r.currentShot) * 0.62;

    // ---- mouse focus ----
    var dot=r.nx*mx+r.ny*my+r.nz*mz;         // -1..1
    var focusMask=Math.max(0,(dot-0.72)/0.28); // 0 outside cone
    focusMask*=focusMask;
    var focusPush=focusMask*smoothBass*0.35*focusMul;
    var focusFlare=focusMask*(0.35+0.5*smoothVocal)*focusMul;

    // ---- direction: base + tangent sway + slight focus lean ----
    var dx=r.nx*(1+focusPush*0.4)+r.t1x*(t1Push)+r.t2x*(t2Push+focusPush*0.25);
    var dy=r.ny*(1+focusPush*0.4)+r.t1y*(t1Push)+r.t2y*(t2Push+focusPush*0.25);
    var dz=r.nz*(1+focusPush*0.4)+r.t1z*(t1Push)+r.t2z*(t2Push+focusPush*0.25);
    var dl=Math.sqrt(dx*dx+dy*dy+dz*dz)||1; dx/=dl;dy/=dl;dz/=dl;

    // ---- length: quiet + vocal flare + transient shot + focus flare ----
    var breath=1+(smoothKick*0.09*breathMul)+(smoothEnergy*0.025*breathMul);
    var flareLen=r.flareLen*(r.currentFlare+r.currentShot*0.85+focusFlare);
    var len=(r.quietLen+flareLen)*breath;

    // ---- root on the sphere, tip outward ----
    var baseR=r.baseRadius*spreadMul*(1+smoothBass*0.06*reactionMul);
    var rx=dx*baseR, ry=dy*baseR, rz=dz*baseR;
    var cx=rx+dx*len*0.5;
    var cy=ry+dy*len*0.5;
    var cz=rz+dz*len*0.5;

    // ---- colour highlight: rods in the focus cone get one ramp step up ----
    var ci=r.colourIdx;
    if(focusMask>0.4 && ci<RAMP.length-1) ci++;
    if(r.currentShot>0.3 && ci<RAMP.length-1) ci++;

    if(ci>=0 && ci<meshes.length && counts[ci]<MAX_PER_COLOR){
      _dummy.position.set(cx,cy,cz);
      _v1.set(dx,dy,dz);
      _qA.setFromUnitVectors(_xAxis,_v1);
      var spin=r.spinPhase+spinClock*r.spinSpeed;
      _qS.setFromAxisAngle(_xAxis,spin);
      _qF.copy(_qA).multiply(_qS);
      _dummy.quaternion.copy(_qF);
      _dummy.scale.set(len,r.radius,r.radius);
      _dummy.updateMatrix();
      var arr=meshes[ci].instanceMatrix.array;
      var o=counts[ci]*16;
      for(var m=0;m<16;m++) arr[o+m]=_dummy.matrix.elements[m];

      // per-instance brightness: brighter in focus cone, brighter when shot
      var bright=1+focusMask*0.5*focusMul+r.currentShot*0.6;
      var col=meshes[ci].instanceColor.array;
      col[counts[ci]*3  ]=bright;
      col[counts[ci]*3+1]=bright;
      col[counts[ci]*3+2]=bright;
      counts[ci]++;
    }
  }

  // cull — with fixed shells, nothing needs culling at runtime, but
  // keep it in case the ball grows
  if(rods.length>26000){
    rods=rods.slice(-25000);
  }

  for(var k=0;k<meshes.length;k++){
    meshes[k].count=counts[k];
    meshes[k].instanceMatrix.needsUpdate=true;
    meshes[k].instanceColor.needsUpdate=true;
  }
}

function resize(){
  var r=stage.getBoundingClientRect();
  var w=Math.max(2,Math.round(r.width));
  var h=Math.max(2,Math.round(r.height));
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);

var lastT=0;
function frame(now){
  var dt=lastT?Math.min(0.033,(now-lastT)/1000):0.016;
  lastT=now;
  updateAudio();
  update(dt);

  // very slow camera orbit — barely perceptible, keeps the 3D readable
  var t=now*0.00006;
  camera.position.set(Math.sin(t)*42,Math.cos(t*0.6)*20,Math.cos(t)*42);
  camera.lookAt(0,0,0);

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

resize();
buildScene();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
