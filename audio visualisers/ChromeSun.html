<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kefe — Rods</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:#000; color:#e5e7eb;
    font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  #stage { flex:1; position:relative; background:#000; }
  #stage canvas { display:block; width:100%; height:100%; }
  #ui { display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    padding:10px 14px; background:#050505; border-top:1px solid #1a1a1a;
    font-size:11px; letter-spacing:0.5px; text-transform:uppercase; }
  #ui select,#ui button,#ui label { background:#0e0e0e; color:#fff;
    border:1px solid #2a2a2a; padding:8px 12px; border-radius:0;
    font:inherit; letter-spacing:inherit; text-transform:inherit;
    cursor:pointer; min-height:34px; display:inline-flex;
    align-items:center; justify-content:center; transition:border-color .15s; }
  #ui select:hover,#ui button:hover,#ui label:hover { border-color:#555; }
  #ui button.active { background:#fff; color:#000; border-color:#fff; }
  #ui button:disabled { opacity:.35; cursor:default; }
  #ui input[type=file] { display:none; }
  #ui .status { opacity:.55; padding-left:12px; border-left:1px solid #1a1a1a;
    margin-left:4px; flex:1; min-width:120px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; text-transform:none; letter-spacing:0; }
  #ui .slider { display:flex; align-items:center; gap:6px; padding:0 10px;
    border:1px solid #2a2a2a; background:#0e0e0e; min-height:34px; }
  #ui .slider label { padding:0; min-height:auto; border:0; background:none; }
  #ui .slider input[type=range] { -webkit-appearance:none; appearance:none;
    width:90px; height:3px; background:#2a2a2a; border-radius:2px;
    outline:none; cursor:pointer; }
  #ui .slider input[type=range]::-webkit-slider-thumb { -webkit-appearance:none;
    width:12px; height:12px; border-radius:50%; background:#fff; cursor:pointer; border:0; }
  #ui .slider input[type=range]::-moz-range-thumb { width:12px; height:12px;
    border:0; border-radius:50%; background:#fff; cursor:pointer; }
  #ui .slider .val { min-width:38px; text-align:right; color:#fff;
    font-variant-numeric:tabular-nums; text-transform:none; letter-spacing:0; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui">
  <select id="preset">
    <option>Bronze Filaments</option>
    <option>Cool Steel</option>
    <option>Molten Core</option>
  </select>
  <label for="file">Load audio</label>
  <input type="file" id="file" accept="audio/*">
  <button id="play" disabled>Play</button>
  <button id="mic">Mic</button>
  <div class="slider">
    <label>Intensity</label>
    <input type="range" id="intensity" min="0.02" max="1" step="0.01" value="0.18">
    <span class="val" id="intensityVal">0.18</span>
  </div>
  <div class="slider">
    <label>Speed</label>
    <input type="range" id="prongSpeed" min="0.1" max="3" step="0.05" value="1">
    <span class="val" id="prongSpeedVal">1.00&times;</span>
  </div>
  <div class="slider">
    <label>Spread</label>
    <input type="range" id="spread" min="0.5" max="3" step="0.05" value="1">
    <span class="val" id="spreadVal">1.00&times;</span>
  </div>
  <span class="status" id="status">NO AUDIO</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   Kefe — Branching metal rods
   Silver/gold/bronze cylinders radiate outward from a hub.
   Each rod steps clockwise in a smooth continuous arc, spawning
   a twin at its tip every cycle, rotated 30deg off the parent.
   Branch generation cycles gold -> silver -> bronze.
   Camera is fixed. FOV is fixed. Audio drives speed subtly.
   ============================================================ */

var stage=document.getElementById('stage');
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);
var camera=new THREE.PerspectiveCamera(35,1,1,20000);
camera.position.set(0,0,22);
camera.lookAt(0,0,0);

var renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x000000,1);
stage.appendChild(renderer.domElement);

/* ---------------- lights ---------------- */
var key=new THREE.DirectionalLight(0xffffff,1.15); key.position.set(4,5,7); scene.add(key);
var rim=new THREE.DirectionalLight(0xaaccff,0.65); rim.position.set(-5,-3,-6); scene.add(rim);
var fill=new THREE.PointLight(0xffffff,0.4); fill.position.set(0,0,3); scene.add(fill);
scene.add(new THREE.AmbientLight(0x506070,0.55));

/* ---------------- audio ---------------- */
var audioCtx=null,analyser=null,sourceNode=null,micSource=null,micStream=null,decodedBuffer=null;
var freqBytes=null,timeFloats=null;
var sBass=0,sEnergy=0,SMOOTH=0.18,BAND_COUNT=128;
var bands=new Float32Array(BAND_COUNT);

var playBtn=document.getElementById('play'),micBtn=document.getElementById('mic'),
    fileInput=document.getElementById('file'),statusEl=document.getElementById('status'),
    presetSel=document.getElementById('preset'),
    intensityIn=document.getElementById('intensity'),intensityVal=document.getElementById('intensityVal'),
    speedIn=document.getElementById('prongSpeed'),speedVal=document.getElementById('prongSpeedVal'),
    spreadIn=document.getElementById('spread'),spreadVal=document.getElementById('spreadVal');

var intensity=0.18, prongSpeedMul=1.0, spreadMul=1.0;

function setStatus(t,k){statusEl.textContent=t;
  statusEl.style.color=k==='err'?'#f88':k==='ok'?'#9fa':'';}

function initAudio(){
  if(audioCtx)return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=2048;analyser.smoothingTimeConstant=0.78;
  freqBytes=new Uint8Array(analyser.frequencyBinCount);
  timeFloats=new Float32Array(analyser.fftSize);
}
function killSrc(){if(sourceNode){try{sourceNode.stop()}catch(e){}
  try{sourceNode.disconnect()}catch(e){}sourceNode=null;}}
function killMic(){if(micSource){try{micSource.disconnect()}catch(e){}micSource=null;}
  if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null;}
  micBtn.classList.remove('active');micBtn.textContent='Mic';}

fileInput.addEventListener('change',async function(e){
  var f=e.target.files[0];if(!f)return;
  initAudio();if(audioCtx.state==='suspended')await audioCtx.resume();
  killSrc();killMic();playBtn.classList.remove('active');playBtn.textContent='Play';
  setStatus('DECODING');
  try{var ab=await f.arrayBuffer();
    decodedBuffer=await audioCtx.decodeAudioData(ab);
    playBtn.disabled=false;
    setStatus(f.name.length>24?f.name.slice(0,22)+'…':f.name,'ok');
  }catch(err){decodedBuffer=null;playBtn.disabled=true;setStatus('DECODE FAIL','err');}
});

playBtn.addEventListener('click',async function(){
  if(!decodedBuffer)return;
  initAudio();if(audioCtx.state==='suspended')await audioCtx.resume();
  if(sourceNode){killSrc();playBtn.classList.remove('active');
    playBtn.textContent='Play';setStatus('PAUSED');return;}
  killMic();
  sourceNode=audioCtx.createBufferSource();
  sourceNode.buffer=decodedBuffer;sourceNode.loop=true;
  sourceNode.connect(analyser);analyser.connect(audioCtx.destination);
  sourceNode.start(0);
  playBtn.classList.add('active');playBtn.textContent='Pause';setStatus('PLAYING','ok');
});

micBtn.addEventListener('click',async function(){
  initAudio();if(audioCtx.state==='suspended')await audioCtx.resume();
  if(micStream){killMic();setStatus('MIC OFF');return;}
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    killSrc();playBtn.classList.remove('active');playBtn.textContent='Play';
    micSource=audioCtx.createMediaStreamSource(micStream);micSource.connect(analyser);
    micBtn.classList.add('active');micBtn.textContent='Stop mic';setStatus('MIC LIVE','ok');
  }catch(err){setStatus('MIC DENIED','err');}
});

intensityIn.addEventListener('input',function(){
  intensity=Number(intensityIn.value);intensityVal.textContent=intensity.toFixed(2);
});
speedIn.addEventListener('input',function(){
  prongSpeedMul=Number(speedIn.value);speedVal.textContent=prongSpeedMul.toFixed(2)+'\u00d7';
});
spreadIn.addEventListener('input',function(){
  spreadMul=Number(spreadIn.value);spreadVal.textContent=spreadMul.toFixed(2)+'\u00d7';
});

function updateAudio(){
  if(!analyser){
    var t=performance.now()*0.001;
    sBass=0.10+Math.sin(t*1.1)*0.05;
    sEnergy=0.12+Math.sin(t*0.7)*0.04;
    for(var i=0;i<BAND_COUNT;i++)bands[i]=0.15+Math.sin(i*0.2+t)*0.05;
    return;
  }
  analyser.getByteFrequencyData(freqBytes);
  analyser.getFloatTimeDomainData(timeFloats);
  var n=freqBytes.length,be=Math.floor(n*0.12),bs=0,all=0;
  for(var i=0;i<n;i++){var v=freqBytes[i];all+=v;if(i<be)bs+=v;}
  var rb=bs/(be*255)||0,re=all/(n*255)||0;
  sBass+=(rb-sBass)*SMOOTH;sEnergy+=(re-sEnergy)*SMOOTH;
  var nyq=audioCtx.sampleRate/2,bins=freqBytes.length;
  var fMin=30,fMax=16000,ratio=fMax/fMin;
  for(var j=0;j<BAND_COUNT;j++){
    var f0=fMin*Math.pow(ratio,j/BAND_COUNT);
    var f1=fMin*Math.pow(ratio,(j+1)/BAND_COUNT);
    var b0=Math.floor(f0/nyq*bins);
    var b1=Math.max(b0+1,Math.ceil(f1/nyq*bins));
    if(b1>bins)b1=bins;
    var ss=0,cc=0;
    for(var b=b0;b<b1;b++){ss+=freqBytes[b];cc++;}
    var vv=(cc?ss/cc:0)/255;vv=Math.pow(vv,1.1);bands[j]=Math.min(1,vv);
  }
}

/* ---------------- metal colours ---------------- */
var METAL=[
  {c:new THREE.Color(1.00,0.85,0.35), e:new THREE.Color(0.30,0.22,0.05)}, // gold
  {c:new THREE.Color(0.90,0.92,0.96), e:new THREE.Color(0.15,0.17,0.22)}, // silver
  {c:new THREE.Color(0.80,0.52,0.28), e:new THREE.Color(0.22,0.11,0.04)}  // bronze
];

/* ---------------- rod geometry cache ---------------- */
var rodGeom=null;
function getRodGeom(){
  if(!rodGeom){
    rodGeom=new THREE.CylinderGeometry(1,1,1,8,1,true);
    rodGeom.rotateZ(Math.PI/2);   // length axis along +X
  }
  return rodGeom;
}

/* ---------------- preset ---------------- */
var MAX_PER_COLOR=5000;
var meshPerColor=[];
var branches=[];
var stepClock=0;
var lastBaseStep=0;
var smoothBass=0, smoothEnergy=0;

function buildScene(){
  // dispose old
  for(var i=0;i<meshPerColor.length;i++){
    scene.remove(meshPerColor[i]);
    meshPerColor[i].geometry=null;
    meshPerColor[i].material.dispose();
  }
  meshPerColor.length=0;

  for(var ci=0;ci<3;ci++){
    var mat=new THREE.MeshStandardMaterial({
      color:METAL[ci].c, emissive:METAL[ci].e,
      metalness:1.0, roughness:0.22, side:THREE.DoubleSide
    });
    var m=new THREE.InstancedMesh(getRodGeom(),mat,MAX_PER_COLOR);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.frustumCulled=false;
    // per-instance brightness multiplier
    m.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(MAX_PER_COLOR*3),3);
    m.instanceColor.setUsage(THREE.DynamicDrawUsage);
    scene.add(m);
    meshPerColor.push(m);
  }

  // Seed initial branches — a wide ring of primary rods
  branches.length=0;
  stepClock=0;
  lastBaseStep=0;

  var N=24;   // rings
  var R=54;   // rods per ring
  for(var r=0;r<N;r++){
    var rT=r/(N-1);
    for(var k=0;k<R;k++){
      var ang=(k/R)*Math.PI*2 + rT*0.35;
      branches.push({
        baseAngle:ang,
        baseRadius:2.20*(0.35+0.9*rT)*spreadMul,
        z:4.5-9.0*rT,
        length:1.00*(0.75+0.55*(1-rT)),
        radius:0.024,
        gen:0,
        offsetBase:0,
        rotSpeed:0.04+Math.random()*0.03,
        spawned:false,
        phase:Math.random()*Math.PI*2
      });
    }
  }
}

/* ---------- smooth eased step offset ---------- */
function smoothstep(t){return t*t*(3-2*t);}

/* ---------- main update ---------- */
var tmpDummy=new THREE.Object3D();
var CULL_R=18;

function update(dt){
  smoothBass+=(sBass-smoothBass)*0.08;
  smoothEnergy+=(sEnergy-smoothEnergy)*0.08;

  // continuous step clock — small base offset (0.5 deg per tick)
  var baseOffsetDeg=0.5;
  var stepDur=0.09;   // seconds per sub-step
  stepClock+=(dt/stepDur)*prongSpeedMul*(1+smoothEnergy*0.15);
  var baseStep=Math.floor(stepClock);
  var frac=stepClock-baseStep;
  var eased=smoothstep(frac);
  var stepAdvanced=false;
  if(baseStep!==lastBaseStep){
    lastBaseStep=baseStep;
    stepAdvanced=true;
  }

  var counts=[0,0,0];
  var time=performance.now()*0.001;

  for(var i=0;i<branches.length;i++){
    var b=branches[i];

    if(stepAdvanced) b.offsetBase+=baseOffsetDeg;
    var smoothOffset=(b.offsetBase + baseOffsetDeg*eased)*Math.PI/180;

    var ang=b.baseAngle + smoothOffset + time*b.rotSpeed*prongSpeedMul;

    var ca=Math.cos(ang),sa=Math.sin(ang);
    var cx=ca*(b.baseRadius+b.length*0.5);
    var cy=sa*(b.baseRadius+b.length*0.5);

    var ci=b.gen%3;
    if(counts[ci]<MAX_PER_COLOR){
      tmpDummy.position.set(cx,cy,b.z);
      tmpDummy.rotation.set(0,0,ang);
      tmpDummy.scale.set(b.length,b.radius,b.radius);
      tmpDummy.updateMatrix();
      var arr=meshPerColor[ci].instanceMatrix.array;
      var o=counts[ci]*16;
      for(var m=0;m<16;m++) arr[o+m]=tmpDummy.matrix.elements[m];
      var col=meshPerColor[ci].instanceColor.array;
      var fade=Math.max(0.35,1-b.gen*0.05);
      col[counts[ci]*3  ]=fade;
      col[counts[ci]*3+1]=fade;
      col[counts[ci]*3+2]=fade;
      counts[ci]++;
    }

    // spawn twin at tip after enough offset accumulated
    if(stepAdvanced && !b.spawned && b.offsetBase>=(b.gen+1)*8){
      var tipR=b.baseRadius+b.length;
      branches.push({
        baseAngle:b.baseAngle + b.offsetBase*Math.PI/180 + 30*Math.PI/180,
        baseRadius:tipR,
        z:b.z,
        length:b.length*0.88,
        radius:b.radius*0.9,
        gen:b.gen+1,
        offsetBase:0,
        rotSpeed:b.rotSpeed*0.95,
        spawned:false,
        phase:Math.random()*Math.PI*2
      });
      b.spawned=true;
    }
  }

  // cull far branches
  if(branches.length>800){
    var keep=[];
    for(var j=0;j<branches.length;j++){
      var bb=branches[j];
      if(bb.baseRadius+bb.length<CULL_R*spreadMul) keep.push(bb);
    }
    branches=keep;
  }

  for(var k=0;k<3;k++){
    meshPerColor[k].count=counts[k];
    meshPerColor[k].instanceMatrix.needsUpdate=true;
    meshPerColor[k].instanceColor.needsUpdate=true;
  }
}

/* ---------- load / preset ---------- */
presetSel.addEventListener('change',function(){buildScene();});

/* ---------- resize ---------- */
function resize(){
  var r=stage.getBoundingClientRect();
  var w=Math.max(2,Math.round(r.width));
  var h=Math.max(2,Math.round(r.height));
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);

/* ---------- loop ---------- */
var lastT=0;
function frame(now){
  var dt=lastT?Math.min(0.033,(now-lastT)/1000):0.016;
  lastT=now;
  updateAudio();
  update(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

resize();
buildScene();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
