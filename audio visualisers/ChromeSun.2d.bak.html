<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kefe — Woven Thorn Ring</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:#000; color:#e5e7eb; padding:20px;
    font:14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .wrap { width:min(1100px, 96vw); }
  .stage { position:relative; }
  canvas {
    display:block; width:100%; aspect-ratio:16/9;
    background:#000; border-radius:14px;
    box-shadow:0 0 0 1px #1f2430, 0 20px 60px rgba(0,0,0,.6);
  }
  .stage.drag::after {
    content:"Drop audio file";
    position:absolute; inset:0; display:grid; place-items:center;
    border:2px dashed #d4a04a; border-radius:14px;
    background:rgba(212,160,74,.08); color:#d4a04a;
    font-size:18px; font-weight:600; pointer-events:none;
  }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:14px; }
  select, button, label.file {
    background:#141822; color:#e5e7eb; border:1px solid #262c3a;
    border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer;
  }
  button:hover, label.file:hover { border-color:#3b4356; }
  button.active { border-color:#d4a04a; color:#d4a04a; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  #hint { opacity:.55; margin-left:auto; max-width:40%; overflow:hidden;
          text-overflow:ellipsis; white-space:nowrap; }
  input[type=file] { display:none; }
  .status { margin-top:10px; min-height:18px; font-size:13px; opacity:.7; }
  .status.err { color:#f87171; opacity:1; }
  .status.ok { color:#d4a04a; opacity:1; }
  .ctrl {
    display:flex; align-items:center; gap:8px;
    background:#141822; border:1px solid #262c3a;
    border-radius:8px; padding:6px 12px;
    font-size:13px; color:#cbd5e1;
  }
  .ctrl label { opacity:.7; }
  .ctrl input[type=range] {
    -webkit-appearance:none; appearance:none;
    width:110px; height:4px; background:#262c3a;
    border-radius:2px; outline:none; cursor:pointer;
  }
  .ctrl input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none;
    width:14px; height:14px; border-radius:50%;
    background:#d4a04a; cursor:pointer;
    box-shadow:0 0 8px rgba(212,160,74,.5);
  }
  .ctrl input[type=range]::-moz-range-thumb {
    width:14px; height:14px; border:none; border-radius:50%;
    background:#d4a04a; cursor:pointer;
  }
  .ctrl .val { min-width:34px; text-align:right;
               font-variant-numeric:tabular-nums; color:#d4a04a; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage"><canvas id="c"></canvas></div>
  <div class="bar">
    <label>Preset <select id="preset"></select></label>
    <label class="file">Load audio<input type="file" id="file"
      accept="audio/*,.wav,.mp3,.ogg,.oga,.opus,.flac,.m4a,.aac,.webm,.aiff,.aif,.mp4"></label>
    <button id="play" disabled>Play</button>
    <button id="mic">Mic</button>
    <div class="ctrl">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="0" max="100" value="33" step="1">
      <span class="val" id="speedVal">1.0×</span>
    </div>
    <div class="ctrl">
      <label for="weave">Weave</label>
      <input type="range" id="weave" min="0" max="100" value="50" step="1">
      <span class="val" id="weaveVal">1.0×</span>
    </div>
    <span id="hint">Load a file or drag one onto the canvas</span>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
/* ================================================================
   Kefe — growing woven thorn ring
   ----------------------------------------------------------------
   • Fibers emerge as short stubs at the hole, growing longer
     as they extend outward
   • Over/under twill weave tight near the hole, untangling outward
   • Beat untangles the outer long rays and shoots them further
   • Rings continue past every screen corner
   ================================================================ */
(function (g) {
  'use strict';

  var PRESETS = {
    'Bronze Filaments': {
      rings: 34,
      innerRadius: 0.42,
      outerRadius: 2.30,
      fiberDensity: 130,

      innerLen: 0.06,
      outerLen: 1.35,
      lenPower: 1.6,

      leanAmount: 0.62,
      weaveFreq: 5,
      weaveAmp: 0.20,
      weaveSpeed: 5.5,
      ringPhaseStep: 0.42,
      weaveFalloff: 1.55,

      untangleAmount: 0.95,
      rayExtend: 1.35,
      bassExtend: 0.50,
      trebleShimmer: 0.22,

      thornJitter: 0.30,
      baseJitter: 0.008,
      perFiberPhase: 0.20,

      barWidth: 0.0105,
      highlightWidth: 0.38,
      underAlpha: 0.45,

      rotationSpeed: 0.03,
      attack: 0.42, release: 0.16,

      bodyStops: [
        [0.000, [ 20,  10,   3, 0.00]],
        [0.006, [255, 220, 145, 1.00]],
        [0.028, [230, 180,  95, 1.00]],
        [0.075, [180, 130,  62, 0.92]],
        [0.160, [130,  88,  38, 0.78]],
        [0.290, [ 82,  52,  20, 0.56]],
        [0.450, [ 45,  28,  10, 0.32]],
        [0.620, [ 22,  13,   4, 0.14]],
        [0.800, [ 10,   5,   2, 0.05]],
        [1.000, [  0,   0,   0, 0.00]]
      ],
      highlightStops: [
        [0.000, [255, 240, 190, 0.00]],
        [0.006, [255, 245, 200, 0.95]],
        [0.028, [255, 225, 165, 0.95]],
        [0.075, [240, 195, 120, 0.85]],
        [0.160, [200, 145,  75, 0.58]],
        [0.290, [140,  90,  40, 0.30]],
        [0.450, [ 70,  42,  16, 0.10]],
        [0.620, [ 25,  14,   5, 0.03]],
        [0.800, [ 10,   5,   2, 0.01]],
        [1.000, [  0,   0,   0, 0.00]]
      ]
    },
    'Cool Steel': {
      rings: 34, innerRadius: 0.42, outerRadius: 2.30,
      fiberDensity: 130,
      innerLen: 0.06, outerLen: 1.35, lenPower: 1.6,
      leanAmount: 0.62, weaveFreq: 5, weaveAmp: 0.20, weaveSpeed: 5.5,
      ringPhaseStep: 0.42, weaveFalloff: 1.55,
      untangleAmount: 0.95, rayExtend: 1.35, bassExtend: 0.50, trebleShimmer: 0.22,
      thornJitter: 0.30, baseJitter: 0.008, perFiberPhase: 0.20,
      barWidth: 0.0105, highlightWidth: 0.38, underAlpha: 0.45,
      rotationSpeed: 0.03, attack: 0.42, release: 0.16,
      bodyStops: [
        [0.000, [  5,  10,  22, 0.00]],
        [0.006, [200, 230, 255, 1.00]],
        [0.028, [170, 205, 245, 1.00]],
        [0.075, [120, 165, 215, 0.92]],
        [0.160, [ 82, 120, 175, 0.78]],
        [0.290, [ 50,  78, 125, 0.56]],
        [0.450, [ 25,  42,  75, 0.32]],
        [0.620, [ 12,  22,  45, 0.14]],
        [0.800, [  5,  10,  22, 0.05]],
        [1.000, [  0,   0,   0, 0.00]]
      ],
      highlightStops: [
        [0.000, [220, 240, 255, 0.00]],
        [0.006, [235, 248, 255, 0.95]],
        [0.028, [220, 240, 255, 0.95]],
        [0.075, [180, 215, 250, 0.85]],
        [0.160, [140, 180, 225, 0.58]],
        [0.290, [ 90, 130, 180, 0.30]],
        [0.450, [ 45,  70, 115, 0.10]],
        [0.620, [ 20,  35,  70, 0.03]],
        [0.800, [  5,  10,  22, 0.01]],
        [1.000, [  0,   0,   0, 0.00]]
      ]
    },
    'Molten Core': {
      rings: 34, innerRadius: 0.42, outerRadius: 2.30,
      fiberDensity: 130,
      innerLen: 0.06, outerLen: 1.32, lenPower: 1.6,
      leanAmount: 0.62, weaveFreq: 5, weaveAmp: 0.20, weaveSpeed: 5.5,
      ringPhaseStep: 0.42, weaveFalloff: 1.55,
      untangleAmount: 0.95, rayExtend: 1.35, bassExtend: 0.50, trebleShimmer: 0.22,
      thornJitter: 0.30, baseJitter: 0.008, perFiberPhase: 0.20,
      barWidth: 0.0110, highlightWidth: 0.38, underAlpha: 0.45,
      rotationSpeed: 0.05, attack: 0.48, release: 0.14,
      bodyStops: [
        [0.000, [ 25,   6,   2, 0.00]],
        [0.006, [255, 210, 140, 1.00]],
        [0.028, [235, 150,  70, 1.00]],
        [0.075, [195, 100,  40, 0.92]],
        [0.160, [145,  68,  25, 0.78]],
        [0.290, [ 92,  42,  15, 0.56]],
        [0.450, [ 52,  22,   8, 0.32]],
        [0.620, [ 25,  10,   4, 0.14]],
        [0.800, [ 10,   4,   2, 0.05]],
        [1.000, [  0,   0,   0, 0.00]]
      ],
      highlightStops: [
        [0.000, [255, 240, 200, 0.00]],
        [0.006, [255, 245, 210, 0.95]],
        [0.028, [255, 220, 160, 0.95]],
        [0.075, [245, 180, 105, 0.85]],
        [0.160, [205, 125,  58, 0.58]],
        [0.290, [150,  82,  32, 0.30]],
        [0.450, [ 80,  40,  14, 0.10]],
        [0.620, [ 30,  13,   4, 0.03]],
        [0.800, [ 10,   4,   2, 0.01]],
        [1.000, [  0,   0,   0, 0.00]]
      ]
    }
  };
  Object.keys(PRESETS).forEach(function (k) { PRESETS[k].name = k; });

  var ui = { speedMul: 1.0, weaveMul: 1.0 };

  function createState() {
    return {
      vals: new Float32Array(0),
      pulse: 0, lastT: 0, dt: 1/60,
      beatSmooth: 0,
      weavePhase: 0,
      bassE: 0, midE: 0, trebleE: 0,
      cachedKey: '', cache: null
    };
  }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  function smooth(state, target, p, dt) {
    var n = target.length;
    if (state.vals.length !== n) state.vals = new Float32Array(n);
    var rate = dt * 60;
    var a = 1 - Math.pow(1 - clamp01(p.attack), rate);
    var r = 1 - Math.pow(1 - clamp01(p.release), rate);
    var v = state.vals;
    for (var i = 0; i < n; i++) {
      var cur = v[i], tgt = clamp01(target[i]);
      v[i] = cur + (tgt - cur) * (tgt > cur ? a : r);
    }
  }

  function updatePulse(state, analysis, dt) {
    if (analysis.beat) state.pulse = 1;
    else state.pulse = Math.max(0, state.pulse - dt * 4);
  }

  function rnd(i, salt) {
    var x = Math.sin(i * 12.9898 + salt * 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  function buildCache(p, R) {
    var N = p.rings;
    var rIn = p.innerRadius * R;
    var rOut = p.outerRadius * R;
    var barW = p.barWidth * R;

    var rings = [];

    for (var ri = 0; ri < N; ri++) {
      var t = ri / (N - 1);              // 0 outer, 1 inner
      var ringR = rOut - t * (rOut - rIn);

      var tcount = Math.max(12, Math.round(p.fiberDensity * (ringR / R)));

      // Length grows outward: short at inner, long at outer
      var growth = Math.pow(1 - t, p.lenPower);
      var baseLen = p.innerLen * R + (p.outerLen * R - p.innerLen * R) * growth;

      // Weave is strong near the hole, weakens outward
      var weaveWeight = Math.pow(t, p.weaveFalloff);
      var rayness = 1 - weaveWeight;

      var ringOffset = ri * p.ringPhaseStep;

      var angles   = new Float32Array(tcount);
      var ringRs   = new Float32Array(tcount);
      var baseLens = new Float32Array(tcount);
      var hws      = new Float32Array(tcount);
      var hiHws    = new Float32Array(tcount);
      var leanDirs = new Int8Array(tcount);
      var phases   = new Float32Array(tcount);
      var bandIdxs = new Uint8Array(tcount);

      // Audio band: outer long rays → bass, inner weave → treble
      var bandIdx = Math.max(1, Math.min(127, Math.round(t * 126)));

      for (var k = 0; k < tcount; k++) {
        var angle = (k / tcount) * Math.PI * 2 + ringOffset;

        var j1 = rnd(ri * 997 + k * 3,  1.0);
        var j2 = rnd(ri * 331 + k * 7,  2.0);
        var j3 = rnd(ri * 137 + k * 11, 3.0);

        var lenMul = 1 - p.thornJitter * 0.5 + j2 * p.thornJitter;
        var baseJit = (j3 - 0.5) * p.baseJitter * R;

        angles[k] = angle;
        ringRs[k] = ringR + baseJit;
        baseLens[k] = baseLen * lenMul;

        var wMul = 0.85 + j1 * 0.3;
        hws[k] = barW * 0.5 * wMul;
        hiHws[k] = hws[k] * p.highlightWidth;

        leanDirs[k] = ((k + ri) % 2 === 0) ? 1 : -1;
        phases[k] = j1 * Math.PI * 2;
        bandIdxs[k] = bandIdx;
      }

      rings.push({
        t: t, ringR: ringR, tcount: tcount,
        weaveWeight: weaveWeight, rayness: rayness,
        angles: angles, ringRs: ringRs, baseLens: baseLens,
        hws: hws, hiHws: hiHws, leanDirs: leanDirs,
        phases: phases, bandIdxs: bandIdxs
      });
    }
    return rings;
  }

  function ensureCache(state, p, R) {
    var key = p.name + '|' + Math.round(R * 2);
    if (state.cachedKey === key && state.cache) return state.cache;
    state.cachedKey = key;
    state.cache = buildCache(p, R);
    return state.cache;
  }

  function drawFilaments(ctx, state, analysis, p, W, H) {
    if (W <= 0 || H <= 0) return;

    var BAND_COUNT = 128;
    smooth(state, analysis.bands, p, state.dt);
    var bandVals = state.vals;

    var bBass = 0, bMid = 0, bTre = 0;
    for (var i = 0; i < 30; i++) bBass += bandVals[i];
    for (var i2 = 30; i2 < 80; i2++) bMid += bandVals[i2];
    for (var i3 = 80; i3 < BAND_COUNT; i3++) bTre += bandVals[i3];
    bBass /= 30; bMid /= 50; bTre /= 48;

    state.bassE   += (bBass - state.bassE)   * 0.22;
    state.midE    += (bMid  - state.midE)    * 0.18;
    state.trebleE += (bTre  - state.trebleE) * 0.30;

    var beatTarget = analysis.beat ? 1 : 0;
    var rate = beatTarget > state.beatSmooth ? 28 : 5.5;
    state.beatSmooth += (beatTarget - state.beatSmooth) * Math.min(1, state.dt * rate);
    if (analysis.beat) state.pulse = 1;
    else state.pulse = Math.max(0, state.pulse - state.dt * 3.5);

    var weaveSpeed = p.weaveSpeed * (1 + state.trebleE * 1.2) * ui.speedMul;
    state.weavePhase += weaveSpeed * state.dt;

    var cx = W / 2, cy = H / 2;
    var R  = Math.min(W, H) / 2;
    if (R <= 0) return;

    var halfW = W / 2, halfH = H / 2;
    var cornerDist = Math.sqrt(halfW * halfW + halfH * halfH);

    var cache = ensureCache(state, p, R);
    var innerR = p.innerRadius * R;
    var gradEnd = (p.outerRadius + p.outerLen) * R;

    var rot = p.rotationSpeed * ui.speedMul * (state.lastT / 1000);

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);

    var bodyGrad = ctx.createRadialGradient(0, 0, innerR, 0, 0, gradEnd);
    for (var sb = 0; sb < p.bodyStops.length; sb++) {
      var stb = p.bodyStops[sb];
      bodyGrad.addColorStop(stb[0], 'rgba(' + stb[1][0] + ',' + stb[1][1] + ',' + stb[1][2] + ',' + stb[1][3] + ')');
    }
    var hiGrad = ctx.createRadialGradient(0, 0, innerR, 0, 0, gradEnd);
    for (var sh = 0; sh < p.highlightStops.length; sh++) {
      var sth = p.highlightStops[sh];
      hiGrad.addColorStop(sth[0], 'rgba(' + sth[1][0] + ',' + sth[1][1] + ',' + sth[1][2] + ',' + sth[1][3] + ')');
    }

    var beatSmooth = state.beatSmooth;
    var pulse = state.pulse;
    var pulseSq = pulse * pulse;
    var wavePhase = state.weavePhase;
    var bassE = state.bassE;
    var trebleE = state.trebleE;
    var weaveMul = ui.weaveMul;
    var lastT = state.lastT;

    for (var ri = 0; ri < cache.length; ri++) {
      var ring = cache[ri];
      if (ring.ringR - ring.baseLens[0] > cornerDist + R * 0.4) continue;

      var tcount = ring.tcount;
      var weaveWeight = ring.weaveWeight;
      var rayness = ring.rayness;

      var bandIdx = ring.bandIdxs[0];
      var ringAudio = clamp01(bandVals[bandIdx] * (1 + 0.3 * pulseSq));
      var audioLenMul = 0.55 + 0.75 * ringAudio;

      var untangle = beatSmooth * rayness;
      var liveWov = 1 - untangle * p.untangleAmount;

      var extend = 1
        + untangle * p.rayExtend
        + bassE * p.bassExtend * rayness;

      var wStrength = weaveWeight * weaveMul;
      var leanBase = p.leanAmount * wStrength * liveWov;

      var ringParity = (ri % 2 === 0) ? 0 : 1;
      var useTwoPass = wStrength > 0.05;

      // ---- BODY ----
      if (useTwoPass) {
        ctx.fillStyle = bodyGrad;
        ctx.globalAlpha = p.underAlpha;
        ctx.beginPath();
        for (var k = 0; k < tcount; k++) {
          if (((k + ringParity) % 2) !== 0) continue;
          drawOneFiber(ctx, ring, k, leanBase, wavePhase, weaveMul,
                       lastT, trebleE, p, audioLenMul, extend, rayness);
        }
        ctx.fill();

        ctx.globalAlpha = 1.0;
        ctx.beginPath();
        for (var k2 = 0; k2 < tcount; k2++) {
          if (((k2 + ringParity) % 2) !== 1) continue;
          drawOneFiber(ctx, ring, k2, leanBase, wavePhase, weaveMul,
                       lastT, trebleE, p, audioLenMul, extend, rayness);
        }
        ctx.fill();
      } else {
        ctx.fillStyle = bodyGrad;
        ctx.globalAlpha = 1.0;
        ctx.beginPath();
        for (var k3 = 0; k3 < tcount; k3++) {
          drawOneFiber(ctx, ring, k3, leanBase, wavePhase, weaveMul,
                       lastT, trebleE, p, audioLenMul, extend, rayness);
        }
        ctx.fill();
      }

      // ---- HIGHLIGHT ----
      if (useTwoPass) {
        ctx.fillStyle = hiGrad;
        ctx.globalAlpha = p.underAlpha * 0.85;
        ctx.beginPath();
        for (var kh = 0; kh < tcount; kh++) {
          if (((kh + ringParity) % 2) !== 0) continue;
          drawOneHighlight(ctx, ring, kh, leanBase, wavePhase, weaveMul,
                           lastT, trebleE, p, audioLenMul, extend, rayness);
        }
        ctx.fill();

        ctx.globalAlpha = 1.0;
        ctx.beginPath();
        for (var kh2 = 0; kh2 < tcount; kh2++) {
          if (((kh2 + ringParity) % 2) !== 1) continue;
          drawOneHighlight(ctx, ring, kh2, leanBase, wavePhase, weaveMul,
                           lastT, trebleE, p, audioLenMul, extend, rayness);
        }
        ctx.fill();
      } else {
        ctx.fillStyle = hiGrad;
        ctx.globalAlpha = 1.0;
        ctx.beginPath();
        for (var kh3 = 0; kh3 < tcount; kh3++) {
          drawOneHighlight(ctx, ring, kh3, leanBase, wavePhase, weaveMul,
                           lastT, trebleE, p, audioLenMul, extend, rayness);
        }
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1.0;

    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(0, 0, innerR * 0.995, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawOneFiber(ctx, ring, k, leanBase, wavePhase, weaveMul,
                        lastT, trebleE, p, audioLenMul, extend, rayness) {
    var ang = ring.angles[k];
    var br  = ring.ringRs[k];
    var hw  = ring.hws[k];
    var leanDir = ring.leanDirs[k];
    var phase   = ring.phases[k];

    var wave = Math.sin(ang * p.weaveFreq + wavePhase + phase * p.perFiberPhase);
    var waveLean = wave * p.weaveAmp * weaveMul;
    var shimmer = Math.sin(lastT * 0.02 + k * 1.7) * p.trebleShimmer * trebleE;

    var totalLean = (leanBase * leanDir + waveLean) * (1 - rayness * 0.6);
    totalLean += shimmer * leanDir * (1 - rayness);

    var liveLen = ring.baseLens[k] * audioLenMul * extend;

    var ca = Math.cos(ang), sa = Math.sin(ang);
    var caE = Math.cos(ang + totalLean), saE = Math.sin(ang + totalLean);
    var pax = -sa, pay = ca;
    var paxE = -saE, payE = caE;

    var bx = ca * br, by = sa * br;
    var tx = caE * (br + liveLen), ty = saE * (br + liveLen);

    ctx.moveTo(bx + pax * hw, by + pay * hw);
    ctx.lineTo(bx - pax * hw, by - pay * hw);
    ctx.lineTo(tx - paxE * hw, ty - payE * hw);
    ctx.lineTo(tx + paxE * hw, ty + payE * hw);
    ctx.closePath();
  }

  function drawOneHighlight(ctx, ring, k, leanBase, wavePhase, weaveMul,
                            lastT, trebleE, p, audioLenMul, extend, rayness) {
    var ang = ring.angles[k];
    var br  = ring.ringRs[k];
    var hiHw = ring.hiHws[k];
    var leanDir = ring.leanDirs[k];
    var phase   = ring.phases[k];

    var wave = Math.sin(ang * p.weaveFreq + wavePhase + phase * p.perFiberPhase);
    var waveLean = wave * p.weaveAmp * weaveMul;
    var shimmer = Math.sin(lastT * 0.02 + k * 1.7) * p.trebleShimmer * trebleE;

    var totalLean = (leanBase * leanDir + waveLean) * (1 - rayness * 0.6);
    totalLean += shimmer * leanDir * (1 - rayness);

    var liveLen = ring.baseLens[k] * audioLenMul * extend;

    var ca = Math.cos(ang), sa = Math.sin(ang);
    var caE = Math.cos(ang + totalLean), saE = Math.sin(ang + totalLean);
    var pax = -sa, pay = ca;
    var paxE = -saE, payE = caE;

    var bx = ca * br, by = sa * br;
    var tx = caE * (br + liveLen), ty = saE * (br + liveLen);

    ctx.moveTo(bx + pax * hiHw, by + pay * hiHw);
    ctx.lineTo(bx - pax * hiHw, by - pay * hiHw);
    ctx.lineTo(tx - paxE * hiHw, ty - payE * hiHw);
    ctx.lineTo(tx + paxE * hiHw, ty + payE * hiHw);
    ctx.closePath();
  }

  function draw(ctx, analysis, state, preset, opts) {
    var p = (typeof preset === 'string') ? PRESETS[preset] : preset;
    if (!p) return;
    var W = opts.width || ctx.canvas.width;
    var H = opts.height || ctx.canvas.height;
    var t = opts.time == null ? performance.now() : opts.time;
    var dt = state.lastT ? Math.min(0.05, (t - state.lastT) / 1000) : 1/60;
    state.lastT = t;
    state.dt = dt;
    updatePulse(state, analysis, dt);

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    drawFilaments(ctx, state, analysis, p, W, H);
  }

  function list() { return Object.keys(PRESETS); }

  g.Kefe = {
    presets: PRESETS,
    createState: createState,
    drawVisualiser: draw,
    listPresets: list,
    getPreset: function (n) { return PRESETS[n]; },
    setSpeed: function (m) { ui.speedMul = m; },
    setWeave: function (m) { ui.weaveMul = m; },
    getUi: function () { return ui; }
  };
})(window);

/* ================================================================
   Preview harness — original audio pipeline + sliders
   ================================================================ */
(function () {
  'use strict';

  var canvas    = document.getElementById('c');
  var ctx       = canvas.getContext('2d');
  var presetSel = document.getElementById('preset');
  var fileInput = document.getElementById('file');
  var playBtn   = document.getElementById('play');
  var micBtn    = document.getElementById('mic');
  var hint      = document.getElementById('hint');
  var statusEl  = document.getElementById('status');
  var stage     = document.getElementById('stage');
  var speedIn   = document.getElementById('speed');
  var weaveIn   = document.getElementById('weave');
  var speedVal  = document.getElementById('speedVal');
  var weaveVal  = document.getElementById('weaveVal');

  var W = 0, H = 0;

  Kefe.listPresets().forEach(function (name) {
    var o = document.createElement('option');
    o.value = name; o.textContent = name;
    presetSel.appendChild(o);
  });
  presetSel.value = 'Bronze Filaments';

  function updateSpeed() {
    var v = parseInt(speedIn.value, 10) / 33.33;
    Kefe.setSpeed(v);
    speedVal.textContent = v.toFixed(1) + '×';
  }
  function updateWeave() {
    var v = parseInt(weaveIn.value, 10) / 50;
    Kefe.setWeave(v);
    weaveVal.textContent = v.toFixed(1) + '×';
  }
  speedIn.addEventListener('input', updateSpeed);
  weaveIn.addEventListener('input', updateWeave);
  updateSpeed();
  updateWeave();

  var BAND_COUNT = 128;
  var analysis = {
    bands: new Float32Array(BAND_COUNT),
    waveform: new Float32Array(512),
    energy: 0,
    beat: false
  };

  var audioCtx = null, analyser = null, freqData = null, timeData = null;
  var micNode = null, analyserOut = false;
  var energyAvg = 0, lastBeat = 0;
  var agcPeak = 0.2;
  var decodedBuffer = null, sourceNode = null;
  var startedAt = 0, pausedAt = 0, isPlaying = false;
  var currentName = '';

  function setStatus(msg, cls) {
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  function ensureAudio() {
    if (audioCtx) return audioCtx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { setStatus('Web Audio API not supported in this browser.', 'err'); return null; }
    audioCtx = new AC();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.55;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);
    return audioCtx;
  }

  function connectOutput() {
    if (!analyserOut) { analyser.connect(audioCtx.destination); analyserOut = true; }
  }
  function disconnectOutput() {
    if (analyserOut) { analyser.disconnect(); analyserOut = false; }
  }

  function computeBands() {
    var nyq = audioCtx.sampleRate / 2;
    var bins = freqData.length;
    var fMin = 30, fMax = 16000;
    var ratio = fMax / fMin;
    var framePeak = 0.001;
    for (var i = 0; i < BAND_COUNT; i++) {
      var f0 = fMin * Math.pow(ratio, i / BAND_COUNT);
      var f1 = fMin * Math.pow(ratio, (i + 1) / BAND_COUNT);
      var b0 = Math.floor(f0 / nyq * bins);
      var b1 = Math.max(b0 + 1, Math.ceil(f1 / nyq * bins));
      if (b1 > bins) b1 = bins;
      var s = 0, c = 0;
      for (var b = b0; b < b1; b++) { s += freqData[b]; c++; }
      var v = (c ? s / c : 0) / 255;
      v *= 1 + (i / BAND_COUNT) * 1.0;
      v = Math.pow(v, 1.1);
      analysis.bands[i] = v;
      if (v > framePeak) framePeak = v;
    }
    agcPeak += (Math.max(framePeak, 0.15) - agcPeak) * 0.05;
    agcPeak *= 0.9995;
    agcPeak = Math.max(agcPeak, 0.15);
    var gain = 0.85 / agcPeak;
    for (var j = 0; j < BAND_COUNT; j++) {
      analysis.bands[j] = Math.min(1, analysis.bands[j] * gain);
    }
  }

  function computeWave() {
    var n = analysis.waveform.length;
    var step = timeData.length / n;
    for (var i = 0; i < n; i++) {
      analysis.waveform[i] = (timeData[Math.floor(i * step)] - 128) / 128;
    }
  }

  function computeEnergy(now) {
    var s = 0;
    for (var i = 0; i < timeData.length; i++) {
      var v = (timeData[i] - 128) / 128;
      s += v * v;
    }
    var rms = Math.sqrt(s / timeData.length);
    analysis.energy += (Math.min(1, rms * 2.5) - analysis.energy) * 0.25;
    energyAvg += (analysis.energy - energyAvg) * 0.02;
    var isBeat = analysis.energy > Math.max(0.08, energyAvg * 1.35) && (now - lastBeat) > 180;
    if (isBeat) lastBeat = now;
    analysis.beat = isBeat;
  }

  function resize() {
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (w <= 0 || h <= 0) return;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      W = w; H = h;
    }
  }

  function stopSource() {
    if (sourceNode) {
      try { sourceNode.stop(); } catch (e) {}
      try { sourceNode.disconnect(); } catch (e) {}
      sourceNode = null;
    }
  }

  function playBuffer() {
    if (!decodedBuffer) return;
    ensureAudio();
    audioCtx.resume();
    connectOutput();
    stopSource();
    sourceNode = audioCtx.createBufferSource();
    sourceNode.buffer = decodedBuffer;
    sourceNode.loop = true;
    sourceNode.connect(analyser);
    sourceNode.start(0, pausedAt);
    startedAt = audioCtx.currentTime;
    isPlaying = true;
    playBtn.textContent = 'Pause';
  }

  function pauseBuffer() {
    if (!decodedBuffer) return;
    var elapsed = audioCtx.currentTime - startedAt;
    pausedAt = (pausedAt + elapsed) % decodedBuffer.duration;
    stopSource();
    isPlaying = false;
    playBtn.textContent = 'Play';
  }

  var SUPPORTED = ['wav','mp3','ogg','oga','opus','flac','m4a','aac','webm','aiff','aif','mp4','caf','mka'];

  function loadFile(file) {
    if (!file) return;
    ensureAudio();
    if (!audioCtx) return;

    stopSource();
    isPlaying = false;
    pausedAt = 0; startedAt = 0;
    decodedBuffer = null;
    agcPeak = 0.2;
    playBtn.disabled = true;
    playBtn.textContent = 'Play';
    currentName = file.name || 'audio';

    setStatus('Reading ' + currentName + ' …');

    file.arrayBuffer().then(function (ab) {
      setStatus('Decoding ' + currentName + ' …');
      return new Promise(function (res, rej) {
        audioCtx.decodeAudioData(ab.slice(0), res, rej);
      });
    }).then(function (buf) {
      decodedBuffer = buf;
      setStatus('Loaded "' + currentName + '" · ' + buf.duration.toFixed(1) + 's · ' +
                buf.sampleRate + ' Hz · ' + buf.numberOfChannels + 'ch', 'ok');
      hint.textContent = currentName;
      playBtn.disabled = false;
      playBuffer();
    }).catch(function (err) {
      var ext = (currentName.split('.').pop() || '').toLowerCase();
      var known = SUPPORTED.indexOf(ext) !== -1;
      setStatus('Could not decode "' + currentName + '". ' +
        (known ? 'Browser can\'t decode this format.' : 'Format "' + ext + '" may not be supported.'),
        'err');
      hint.textContent = 'Load a file or drag one onto the canvas';
    });
  }

  var vstate = Kefe.createState();

  function loop(now) {
    requestAnimationFrame(loop);
    resize();
    if (analyser) {
      analyser.getByteFrequencyData(freqData);
      analyser.getByteTimeDomainData(timeData);
      computeBands();
      computeWave();
      computeEnergy(now);
    }
    try {
      Kefe.drawVisualiser(ctx, analysis, vstate, presetSel.value, { width: W, height: H, time: now });
    } catch (e) {
      console.error('Render error:', e);
    }
  }
  requestAnimationFrame(loop);

  fileInput.addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) loadFile(f);
    fileInput.value = '';
  });

  playBtn.addEventListener('click', function () {
    if (!decodedBuffer) return;
    audioCtx.resume();
    if (isPlaying) pauseBuffer();
    else playBuffer();
  });

  micBtn.addEventListener('click', function () {
    ensureAudio();
    if (!audioCtx) return;
    audioCtx.resume();

    if (micNode) {
      try { micNode.disconnect(); } catch (e) {}
      micNode = null;
      micBtn.classList.remove('active');
      if (decodedBuffer) connectOutput();
      hint.textContent = currentName || 'Load a file or drag one onto the canvas';
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Microphone not available in this browser.', 'err');
      return;
    }

    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      if (isPlaying) pauseBuffer();
      disconnectOutput();
      micNode = audioCtx.createMediaStreamSource(stream);
      micNode.connect(analyser);
      micBtn.classList.add('active');
      hint.textContent = 'Microphone live';
      setStatus('Listening to microphone.', 'ok');
    }).catch(function (err) {
      setStatus('Mic permission denied or unavailable: ' + (err.message || err.name), 'err');
    });
  });

  ['dragenter', 'dragover'].forEach(function (ev) {
    stage.addEventListener(ev, function (e) { e.preventDefault(); stage.classList.add('drag'); });
  });
  ['dragleave', 'dragend'].forEach(function (ev) {
    stage.addEventListener(ev, function (e) { e.preventDefault(); stage.classList.remove('drag'); });
  });
  stage.addEventListener('drop', function (e) {
    e.preventDefault();
    stage.classList.remove('drag');
    var dt = e.dataTransfer;
    if (!dt) return;
    var f = (dt.files && dt.files[0]) || null;
    if (f) loadFile(f);
  });

  function reportSupport() {
    var el = document.createElement('audio');
    var fmts = [
      ['WAV','audio/wav'],['MP3','audio/mpeg'],['OGG','audio/ogg'],
      ['Opus','audio/ogg; codecs="opus"'],['FLAC','audio/flac'],
      ['AAC','audio/aac'],['M4A','audio/mp4'],['WebM','audio/webm']
    ];
    var sup = fmts.filter(function (f) { return el.canPlayType(f[1]); })
                  .map(function (f) { return f[0]; });
    setStatus('Browser supports: ' + (sup.join(', ') || 'nothing detected'), 'ok');
  }
  reportSupport();
})();
</script>
</body>
</html>
