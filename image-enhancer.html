<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="KEFE Image Enhancer — upscale and enhance images up to 4K in your browser.">
  <title>KEFE Image Enhancer</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./image-enhancer.css">
</head>
<body>
  <main class="enhancer-app">
    <header class="topbar">
      <a class="brand" href="./"><img src="./kefe-logo.svg" alt="KEFE"><span>IMAGE ENHANCER</span></a>
      <div class="top-actions"><button id="resetBtn" class="ghost" type="button">Reset</button><button id="downloadTop" class="primary" type="button" disabled>Download</button></div>
    </header>

    <section class="workspace">
      <aside class="controls">
        <div class="section"><div class="section-title">01 <strong>Image</strong></div>
          <label class="drop" id="dropZone"><input id="imageInput" type="file" accept="image/*"><span class="drop-icon">↑</span><strong>Choose image</strong><small>JPG, PNG, WEBP, TIFF</small></label>
          <div id="fileInfo" class="status">No image loaded</div>
        </div>
        <div class="section"><div class="section-title">02 <strong>Output</strong></div>
          <label>Resolution<select id="resolution"><option value="original">Original</option><option value="1080">1080p</option><option value="1440">1440p</option><option value="2160" selected>4K UHD · 2160p</option></select></label>
          <label>Format<select id="format"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WEBP</option></select></label>
          <label id="qualityWrap">Quality <output id="qualityValue">94%</output><input id="quality" type="range" min="70" max="100" value="94"></label>
        </div>
        <div class="section"><div class="section-title">03 <strong>Enhance</strong></div>
          <label>Sharpness <output id="sharpnessValue">35</output><input id="sharpness" type="range" min="0" max="100" value="35"></label>
          <label>Clarity <output id="clarityValue">18</output><input id="clarity" type="range" min="0" max="100" value="18"></label>
          <label>Denoise <output id="denoiseValue">12</output><input id="denoise" type="range" min="0" max="100" value="12"></label>
          <label class="switch-row"><span>Auto tone</span><input id="autoTone" type="checkbox" checked><i></i></label>
          <label class="switch-row"><span>Preserve detail</span><input id="preserve" type="checkbox" checked><i></i></label>
        </div>
        <button id="enhanceBtn" class="primary full" type="button" disabled>Enhance Image</button>
        <div class="note">Processing is local in your browser. Images are not uploaded.</div>
      </aside>

      <section class="preview-area">
        <div class="preview-head"><div><strong>Preview</strong><span id="previewMeta">Add an image to begin</span></div><div class="compare"><button id="beforeBtn" class="active" type="button">Before</button><button id="afterBtn" type="button">After</button></div></div>
        <div class="canvas-shell" id="canvasShell"><div class="empty"><div>+</div><strong>Drop an image here</strong><span>Enhance and upscale to up to 4K UHD</span></div><canvas id="previewCanvas" hidden></canvas></div>
        <div class="preview-foot"><span id="dimensions">—</span><span id="scaleInfo">—</span></div>
      </section>
    </section>
  </main>
  <script src="./image-enhancer.js"></script>
</body>
</html>
