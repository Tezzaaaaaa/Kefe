<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEFE — Brat Effect Preview</title><style>html,body{margin:0;background:#111;color:#fff;font:14px system-ui,sans-serif;height:100%}body{display:grid;place-items:center}.wrap{width:min(92vw,720px)}canvas{display:block;width:100%;aspect-ratio:9/16;background:#8ACE00}.bar{display:flex;gap:10px;align-items:center;margin-top:14px}.bar button{padding:8px 14px;border:0;border-radius:6px}.bar input{flex:1}.meta{margin-top:10px;color:#aaa} </style></head><body><div class="wrap"><canvas id="c" width="540" height="960"></canvas><div class="bar"><button id="play">Play</button><input id="seek" type="range" min="0" max="100" value="0"><span id="time">0.00s</span></div><div class="meta">Brat preview · lowercase · condensed · tight tracking · soft blur · abrupt word cuts</div></div><script>const c=document.querySelector('#c'),x=c.getContext('2d'),seek=document.querySelector('#seek'),play=document.querySelector('#play'),timeEl=document.querySelector('#time');const lines=[{t:0,words:['i','got','it']},{t:1.25,words:['i','got','it','bad']},{t:2.65,words:['now','you','want','it']},{t:4.2,words:['say','my','name']}];let duration=5.8,playing=false,start=0,pos=0;function draw(t){x.fillStyle='#8ACE00';x.fillRect(0,0,c.width,c.height);let line=lines[0],idx=0;for(let i=0;i<lines.length;i++){if(t>=lines[i].t){line=lines[i];idx=i}}let p=lines[idx].t;let next=lines[idx+1]?.t??duration;let n=Math.min(line.words.length,Math.max(1,Math.floor(((t-p)/Math.max(.12,next-p))*line.words.length)+1));let text=line.words.slice(0,n).join(' ');x.save();x.textAlign='center';x.textBaseline='middle';x.font='700 92px Arial Narrow,Arial,sans-serif';x.scale(1.08,1);x.filter='blur(1.8px)';x.fillStyle='#111';x.fillText(text,c.width/2/1.08,c.height*.5);x.restore();timeEl.textContent=t.toFixed(2)+'s'}function frame(now){if(playing){pos=(now-start)/1000;if(pos>=duration){pos=duration;playing=false;play.textContent='Play'}seek.value=pos/duration*100}draw(pos);if(playing)requestAnimationFrame(frame)}seek.oninput=()=>{pos=+seek.value/100*duration;draw(pos)};play.onclick=()=>{if(playing){playing=false;play.textContent='Play'}else{playing=true;start=performance.now()-pos*1000;play.textContent='Pause';requestAnimationFrame(frame)}};draw(0)</script></body></html>
