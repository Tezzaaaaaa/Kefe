<div class="kefe-settings-panel" id="kefe-settings-panel" data-layout="workspaces">
  <div class="kefe-workspace-tabs" role="tablist" aria-label="Editor workspace" data-workspace-tablist>
    <button class="kefe-workspace-tab" type="button" role="tab" id="kefe-tab-content" data-workspace-tab="content" aria-controls="kefe-workspace-content-panel" aria-selected="true" tabindex="0">Content</button>
    <button class="kefe-workspace-tab" type="button" role="tab" id="kefe-tab-appearance" data-workspace-tab="design" aria-controls="kefe-workspace-appearance-panel" aria-selected="false" tabindex="-1">Appearance</button>
    <button class="kefe-workspace-tab" type="button" role="tab" id="kefe-tab-audio-visuals" data-workspace-tab="audio-visuals" aria-controls="kefe-workspace-audio-visuals-panel" aria-selected="false" tabindex="-1">Audio &amp; Visualiser</button>
  </div>

  <div class="kefe-settings-columns kefe-workspaces" data-accordion="multi">
    <section class="kefe-panel kefe-workspace" id="kefe-workspace-content-panel" data-group="content" role="tabpanel" aria-labelledby="kefe-tab-content" tabindex="0">
      <h2 class="kefe-workspace-title" id="kefe-workspace-content">Content</h2>
      <div class="kefe-workspace-stack">
        <section class="section" data-expanded="true" data-section-id="media">
          <div class="section-content" id="settings-panel-media"><div class="content-inner">
            <div class="kefe-slot" data-kefe-slot="media"></div>
          </div></div>
        </section>
        <section class="section" data-expanded="true" data-section-id="lyric-sync">
          <div class="section-content" id="settings-panel-lyric-sync"><div class="content-inner">
            <div class="kefe-slot" data-kefe-slot="lyric-sync"></div>
          </div></div>
        </section>
      </div>
    </section>

    <section class="kefe-panel kefe-workspace" id="kefe-workspace-appearance-panel" data-group="design" role="tabpanel" aria-labelledby="kefe-tab-appearance" tabindex="0" hidden aria-hidden="true">
      <h2 class="kefe-workspace-title" id="kefe-workspace-design">Appearance</h2>
      <div class="kefe-workspace-stack">
        <section class="section" data-expanded="true" data-section-id="lyric-effects">
          <div class="section-content" id="settings-panel-lyric-effects"><div class="content-inner">
            <div class="kefe-slot" data-kefe-slot="lyric-effects"></div>
          </div></div>
        </section>
        <section class="section" data-expanded="true" data-section-id="background">
          <div class="section-content" id="settings-panel-background"><div class="content-inner">
            <div class="kefe-slot" data-kefe-slot="background"></div>
          </div></div>
        </section>
      </div>
    </section>

    <section class="kefe-panel kefe-workspace" id="kefe-workspace-audio-visuals-panel" data-group="audio-visuals" role="tabpanel" aria-labelledby="kefe-tab-audio-visuals" tabindex="0" hidden aria-hidden="true">
      <h2 class="kefe-workspace-title" id="kefe-workspace-audio-visuals">Audio &amp; Visualiser</h2>
      <div class="kefe-workspace-stack">
        <section class="section" data-expanded="true" data-section-id="visualisers">
          <div class="section-content" id="settings-panel-visualisers"><div class="content-inner">
            <div class="kefe-slot" data-kefe-slot="visualisers"></div>
          </div></div>
        </section>
        <details class="kefe-advanced-controls">
          <summary>Advanced</summary>
          <section class="section" data-expanded="true" data-section-id="export">
          <div class="section-content" id="settings-panel-export"><div class="content-inner">
            <div class="kefe-slot" data-kefe-slot="export"></div>
          </div></div>
        
        </details></section>
      </div>
    </section>
  </div>
  <div class="kefe-reset-footer">
    <a class="kefe-settings-github" href="https://github.com/Tezzaaaaaa/Kefe" target="_blank" rel="noopener noreferrer" aria-label="KEFE on GitHub">
      <span data-kefe-icon="github" data-icon-size="16" aria-hidden="true"></span><span>GitHub</span>
    </a>
    <button class="kefe-btn" type="button" id="kefe-reset">Reset all settings</button>
  </div>
</div>
