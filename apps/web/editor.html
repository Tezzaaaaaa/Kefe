<script>
(() => {
  const root = document.documentElement;
  const key = 'kefe.theme';
  try {
    const saved = localStorage.getItem(key);
    if (saved === 'day' || saved === 'night') root.dataset.theme = saved;
  } catch (_) {}
  function syncThemeToggle() {
    const button = document.getElementById('kefeThemeToggle');
    if (!button) return;
    const isNight = root.dataset.theme === 'night';
    button.textContent = isNight ? '☀ Day' : '☾ Night';
    button.setAttribute('aria-label', isNight ? 'Switch to day mode' : 'Switch to night mode');
    button.title = isNight ? 'Switch to day mode' : 'Switch to night mode';
  }
  document.addEventListener('click', event => {
    const button = event.target.closest && event.target.closest('#kefeThemeToggle');
    if (!button) return;
    root.dataset.theme = root.dataset.theme === 'night' ? 'day' : 'night';
    try { localStorage.setItem(key, root.dataset.theme); } catch (_) {}
    syncThemeToggle();
  });
  document.addEventListener('DOMContentLoaded', syncThemeToggle);
  syncThemeToggle();
})();
</script>

<script>
(() => {
  const selector = 'input[type="range"]:not(#kefeTime):not(.kefe-slider)';
  function syncSlider(input) {
    const min = Number(input.min || 0);
    const max = Number(input.max || 100);
    const value = Number(input.value || 0);
    const progress = max > min ? Math.max(0, Math.min(100, ((value - min) / (max - min)) * 100)) : 0;
    input.style.setProperty('--kefe-slider-progress', progress + '%');
  }
  function syncAllSliders() {
    document.querySelectorAll(selector).forEach(syncSlider);
  }
  document.addEventListener('input', event => {
    if (event.target instanceof HTMLInputElement && event.target.matches(selector)) syncSlider(event.target);
  }, true);
  document.addEventListener('change', event => {
    if (event.target instanceof HTMLInputElement && event.target.matches(selector)) syncSlider(event.target);
  }, true);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', syncAllSliders, { once: true });
  else syncAllSliders();
})();
</script>

<script>
(() => {
  const button = document.getElementById('kefeMuteToggle');
  const popover = document.getElementById('kefeVolumePopover');
  const slider = document.getElementById('kefeVolume');
  const output = document.getElementById('kefeVolumeValue');
  const audio = document.getElementById('kefeAudio');
  if (!button || !popover || !slider || !output || !audio) return;
  let lastVolume = 1;
  const setOpen = open => {
    popover.hidden = !open;
    button.setAttribute('aria-expanded', String(open));
    if (open) slider.focus({ preventScroll: true });
  };
  const syncVolume = () => {
    const volume = Math.max(0, Math.min(100, Number(slider.value) || 0));
    audio.volume = volume / 100;
    if (volume > 0) lastVolume = volume / 100;
    output.value = volume + '%';
    output.textContent = volume + '%';
    button.textContent = volume === 0 ? '◖̸' : '◖';
    button.setAttribute('aria-label', volume === 0 ? 'Volume muted; open volume options' : 'Open volume options');
    button.title = volume === 0 ? 'Muted — open volume options' : 'Volume options';
  };
  button.addEventListener('click', () => setOpen(popover.hidden));
  slider.addEventListener('input', syncVolume);
  document.addEventListener('pointerdown', event => {
    if (!popover.hidden && !popover.contains(event.target) && !button.contains(event.target)) setOpen(false);
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !popover.hidden) { setOpen(false); button.focus({ preventScroll: true }); }
  });
  audio.addEventListener('volumechange', () => {
    if (!audio.muted) slider.value = String(Math.round(audio.volume * 100));
    syncVolume();
  });
  syncVolume();
})();
</script>
