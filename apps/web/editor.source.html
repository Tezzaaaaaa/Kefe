<script>
/* Boot gate: the legacy shell is built synchronously and the beUI bridges swap its controls in afterwards.
   Keep the page hidden until the DOM stops gaining elements, then reveal it once, so the old toolbar/nav
   is never painted. The saved theme is applied here so day mode never flashes night first. */
(function () {
  var root = document.documentElement;
  root.dataset.theme = 'night';
  try { var saved = localStorage.getItem('kefe.theme'); if (saved === 'day' || saved === 'night') root.dataset.theme = saved; } catch (_) {}
  root.classList.add('kefe-booting');
  var done = false, quiet = 0, observer = null;
  function reveal() {
    if (done) return;
    done = true;
    if (observer) observer.disconnect();
    clearTimeout(quiet);
    requestAnimationFrame(function () {
      root.classList.remove('kefe-booting');
      root.classList.add('kefe-ready');
      window.dispatchEvent(new Event('kefe-shell-ready'));
    });
  }
  function mounted() { return !!(document.querySelector('.beui-sidebar-nav-host button') && document.querySelector('.beui-range-host')); }
  function arm() { clearTimeout(quiet); quiet = setTimeout(function () { if (mounted()) reveal(); else arm(); }, 140); }
  function begin() {
    observer = new MutationObserver(function (records) {
      for (var i = 0; i < records.length; i++) {
        for (var j = 0; j < records[i].addedNodes.length; j++) {
          if (records[i].addedNodes[j].nodeType === 1) { arm(); return; }
        }
      }
    });
    observer.observe(root, { childList: true, subtree: true });
    arm();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', begin, { once: true }); else begin();
  setTimeout(reveal, 2500); // never leave the page hidden if a bridge fails
})();
</script>

<script>
(() => {
  const root = document.documentElement;
  const key = 'kefe.theme';
  try {
    const saved = localStorage.getItem(key);
    if (saved === 'day' || saved === 'night') root.dataset.theme = saved;
  } catch (_) {}
  function ensureThemeToggle() {
    let button = document.getElementById('kefeThemeToggle');
    if (button) return button;
    const headerActions = document.querySelector('.kefe-top-actions');
    const headerNav = document.querySelector('.kefe-top-nav');
    const headerProfile = document.querySelector('.kefe-top-profile');
    const headerSlot = headerActions || headerNav || headerProfile || document.querySelector('.kefe-sidebar-bottom');
    if (!headerSlot) return null;
    button = document.createElement('button');
    button.type = 'button';
    button.id = 'kefeThemeToggle';
    button.className = headerSlot.matches('.kefe-sidebar-bottom')
      ? 'kefe-sidebar-link kefe-theme-toggle'
      : 'kefe-top-link kefe-theme-toggle';
    button.setAttribute('data-top-panel', 'theme');
    const githubLink = headerSlot.querySelector('.kefe-sidebar-github');
    if (githubLink) headerSlot.insertBefore(button, githubLink);
    else headerSlot.appendChild(button);
    return button;
  }
  function syncThemeToggle() {
    const button = ensureThemeToggle();
    if (!button) return;
    const isNight = root.dataset.theme === 'night';
    button.innerHTML = '<span aria-hidden="true">' + (isNight ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>' : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>') + '</span>' + (isNight ? 'Day' : 'Night');
    button.setAttribute('aria-label', isNight ? 'Switch to day mode' : 'Switch to night mode');
    button.title = isNight ? 'Switch to day mode' : 'Switch to night mode';
  }
  document.addEventListener('click', event => {
    const button = event.target.closest && event.target.closest('#kefeThemeToggle');
    if (!button) return;
    root.dataset.theme = root.dataset.theme === 'night' ? 'day' : 'night';
    try { localStorage.setItem(key, root.dataset.theme); } catch (_) {}
    syncThemeToggle();
  });
  document.addEventListener('DOMContentLoaded', syncThemeToggle);
  syncThemeToggle();
})();
</script>

<script>
(() => {
  const selector = 'input[type="range"]:not(#kefeTime):not(.kefe-slider)';
  function syncSlider(input) {
    const min = Number(input.min || 0);
    const max = Number(input.max || 100);
    const value = Number(input.value || 0);
    const progress = max > min ? Math.max(0, Math.min(100, ((value - min) / (max - min)) * 100)) : 0;
    input.style.setProperty('--kefe-slider-progress', progress + '%');
  }
  function syncAllSliders() {
    document.querySelectorAll(selector).forEach(syncSlider);
  }
  document.addEventListener('input', event => {
    if (event.target instanceof HTMLInputElement && event.target.matches(selector)) syncSlider(event.target);
  }, true);
  document.addEventListener('change', event => {
    if (event.target instanceof HTMLInputElement && event.target.matches(selector)) syncSlider(event.target);
  }, true);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', syncAllSliders, { once: true });
  else syncAllSliders();
})();
</script>

<script>
(() => {
  const button = document.getElementById('kefeMuteToggle');
  const popover = document.getElementById('kefeVolumePopover');
  const slider = document.getElementById('kefeVolume');
  const output = document.getElementById('kefeVolumeValue');
  const audio = document.getElementById('kefeAudio');
  if (!button || !popover || !slider || !output || !audio) return;
  let lastVolume = 1;
  const setOpen = open => {
    popover.hidden = !open;
    button.setAttribute('aria-expanded', String(open));
    if (open) slider.focus({ preventScroll: true });
  };
  const syncVolume = () => {
    const volume = Math.max(0, Math.min(100, Number(slider.value) || 0));
    audio.volume = volume / 100;
    if (volume > 0) lastVolume = volume / 100;
    output.value = volume + '%';
    output.textContent = volume + '%';
    button.innerHTML = volume === 0 ? "<svg viewBox='0 0 24 24' aria-hidden='true'><path d='M11 5 6 9H3v6h3l5 4z'/><path d='m16 9 5 6m0-6-5 6'/></svg>" : "<svg viewBox='0 0 24 24' aria-hidden='true'><path d='M11 5 6 9H3v6h3l5 4z'/><path d='M15.5 8.5a5 5 0 0 1 0 7'/><path d='M18.5 5.5a9 9 0 0 1 0 13'/></svg>";
    button.setAttribute('aria-label', volume === 0 ? 'Volume muted; open volume options' : 'Open volume options');
    button.title = volume === 0 ? 'Muted — open volume options' : 'Volume options';
  };
  button.addEventListener('click', () => setOpen(popover.hidden));
  slider.addEventListener('input', syncVolume);
  document.addEventListener('pointerdown', event => {
    if (!popover.hidden && !popover.contains(event.target) && !button.contains(event.target)) setOpen(false);
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !popover.hidden) { setOpen(false); button.focus({ preventScroll: true }); }
  });
  audio.addEventListener('volumechange', () => {
    if (!audio.muted) slider.value = String(Math.round(audio.volume * 100));
    syncVolume();
  });
  syncVolume();
})();
</script>
