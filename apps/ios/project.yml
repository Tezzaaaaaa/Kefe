name: KEFE
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  KEFE:
    type: application
    platform: iOS
    sources:
      - KefeApp.swift
      - KefeLockScreenCoordinator.swift
      - KefeLyricsAttributes.swift
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kefe.app
        PRODUCT_NAME: KEFE
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KEFELockScreenWidget
        embed: true
  KEFELockScreenWidget:
    type: app-extension
    platform: iOS
    sources:
      - KefeLyricsLiveActivity.swift
      - KefeWidgetBundle.swift
      - KefeLyricsAttributes.swift
    info:
      path: WidgetInfo.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kefe.app.lock-screen
        PRODUCT_NAME: KEFELockScreenWidget
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
