<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compact Neumorphic Audio Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        neu: {
                            base: '#e4e4e7', light: '#ffffff', dark: '#d1d1d6',
                            shadow: 'rgba(163, 177, 198, 0.5)', highlight: 'rgba(255, 255, 255, 0.9)',
                            textDark: '#3f3f46', textMuted: '#71717a', accent: '#3b82f6'
                        }
                    },
                    boxShadow: {
                        'neu-flat': '6px 6px 12px rgba(163, 177, 198, 0.5), -6px -6px 12px rgba(255, 255, 255, 0.8)',
                        'neu-flat-sm': '3px 3px 6px rgba(163, 177, 198, 0.5), -3px -3px 6px rgba(255, 255, 255, 0.8)',
                        'neu-pressed': 'inset 3px 3px 6px rgba(163, 177, 198, 0.5), inset -3px -3px 6px rgba(255, 255, 255, 0.8)',
                        'neu-pressed-lg': 'inset 6px 6px 12px rgba(163, 177, 198, 0.5), inset -6px -6px 12px rgba(255, 255, 255, 0.8)',
                    }
                }
            }
        }
    </script>
    <style>
        body { background:transparent; color:#3f3f46; user-select:none; }\n        body > div.w-full.max-w-\\[340px\\] { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); margin:0; touch-action:none; }
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:#e4e4e7; border-radius:8px; }
        ::-webkit-scrollbar-thumb { background:#d1d1d6; border-radius:8px; }
        .analog-hand { transform-origin:bottom center; transition:transform .1s cubic-bezier(.4,2.08,.55,.44); }
        @keyframes pulseGlow { 0%,100%{transform:scale(1);opacity:.8} 50%{transform:scale(1.05);opacity:1} }
        .eq-anim span { animation:pulseGlow 1.2s infinite ease-in-out alternate; }
        .eq-anim span:nth-child(2){animation-delay:.3s}
        .eq-anim span:nth-child(3){animation-delay:.6s}
    </style><style id="kefe-skin-options">

body.skin-dribbble-light>div.w-full.max-w-\\[340px\\]>div:nth-of-type(5),

<body class="h-full flex items-center justify-center p-3 sm:p-4 overflow-auto">
    <audio id="audioElement" preload="auto"></audio>
    <div class="w-full max-w-[340px] bg-neu-base rounded-[32px] shadow-neu-flat p-4 sm:p-5 flex flex-col gap-4 relative transition-all duration-300">
        <div class="flex items-center justify-between">
            <div>
                <div id="digitalClock" class="text-2xl sm:text-3xl font-bold tracking-tight text-neu-textDark">9/08</div>
                <div id="digitalTimeAmPm" class="text-[10px] sm:text-xs font-semibold text-neu-textMuted uppercase tracking-wider">6 PM</div>
            </div>
            <div class="flex items-center gap-1.5">
                <button id="minimizeMiniPlayerBtn" type="button" title="Minimize MiniPlayer" aria-label="Minimize MiniPlayer" class="w-6 h-6 rounded-full bg-neu-base shadow-neu-flat flex items-center justify-center text-neu-textMuted hover:text-neu-textDark active:shadow-neu-pressed transition cursor-pointer"><i class="fa-solid fa-minus text-[8px]"></i></button>
                <button id="closeMiniPlayerBtn" type="button" title="Close MiniPlayer" aria-label="Close MiniPlayer" class="w-6 h-6 rounded-full bg-neu-base shadow-neu-flat flex items-center justify-center text-neu-textMuted hover:text-rose-500 active:shadow-neu-pressed transition cursor-pointer"><i class="fa-solid fa-xmark text-[8px]"></i></button>
                <button id="themeInfoBtn" title="Player Status" class="w-8 h-8 rounded-full bg-neu-base shadow-neu-flat flex items-center justify-center text-neu-textMuted hover:text-neu-textDark active:shadow-neu-pressed transition cursor-pointer"><span class="text-[10px] font-bold">R</span></button>
                <div id="trackCountBadge" class="px-2.5 py-1 rounded-full bg-neu-base shadow-neu-pressed flex items-center justify-center text-[10px] font-bold text-neu-textMuted">03</div>
            </div>
        </div>
        <div class="bg-neu-base rounded-2xl shadow-neu-pressed p-3 flex items-center justify-between">
            <div class="flex flex-col overflow-hidden pr-1">
                <span class="text-[8px] uppercase font-semibold text-neu-textMuted tracking-wider">Your last project</span>
                <div class="flex items-center gap-1.5 mt-0.5">
                    <span id="currentProjectTitle" class="text-xs font-bold text-neu-textDark truncate max-w-[110px]">T.029</span>
                    <button id="favBadgeBtn" class="text-[9px] px-1.5 py-0.5 rounded-full bg-neu-base shadow-neu-flat text-neu-textMuted font-bold uppercase transition active:shadow-neu-pressed cursor-pointer">FAV</button>
                </div>
            </div>
            <div class="flex items-center gap-1.5 flex-shrink-0">
                <button id="openQueueBtn" title="Playlist Queue" class="w-7 h-7 rounded-full bg-neu-base shadow-neu-flat flex items-center justify-center text-neu-textMuted hover:text-blue-500 active:shadow-neu-pressed transition cursor-pointer"><i class="fa-solid fa-headphones text-[10px]"></i></button>
                <button id="openSearchBtn" title="Search Catalog & am-dl" class="w-7 h-7 rounded-full bg-neu-base shadow-neu-flat flex items-center justify-center text-neu-textMuted hover:text-blue-500 active:shadow-neu-pressed transition cursor-pointer"><i class="fa-solid fa-magnifying-glass text-[10px]"></i></button>
                <button id="openGlobeSearchBtn" title="Browse am-dl Catalog" class="w-7 h-7 rounded-full bg-neu-base shadow-neu-flat flex items-center justify-center text-neu-textMuted hover:text-blue-500 active:shadow-neu-pressed transition cursor-pointer"><i class="fa-solid fa-globe text-[10px]"></i></button>
                <label id="uploadIconBtn" title="Upload Local Audio" class="w-7 h-7 rounded-full bg-neu-base shadow-neu-flat flex items-center justify-center text-neu-textMuted hover:text-blue-500 active:shadow-neu-pressed transition cursor-pointer"><i class="fa-solid fa-cloud-arrow-up text-[10px]"></i><input type="file" id="audioFileInput" accept="audio/*" multiple class="hidden"></label>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-3 items-center">
            <div class="aspect-square bg-neu-base rounded-full shadow-neu-pressed-lg relative flex items-center justify-center p-2.5">
                <div class="absolute top-1.5 w-0.5 h-1.5 bg-neu-dark opacity-50 rounded-full"></div><div class="absolute bottom-1.5 w-0.5 h-1.5 bg-neu-dark opacity-50 rounded-full"></div><div class="absolute left-1.5 h-0.5 w-1.5 bg-neu-dark opacity-50 rounded-full"></div><div class="absolute right-1.5 h-0.5 w-1.5 bg-neu-dark opacity-50 rounded-full"></div>

            </div>

                    <img id="trackArtwork" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=80" alt="Album Art" class="w-full h-full object-cover rounded-xl shadow-neu-pressed transition duration-300 group-hover:scale-105" onerror="this.src='https://placehold.co/300x300/e4e4e7/3f3f46?text=Audio'">
                    <button id="artworkFavBtn" title="Favorite Track" class="absolute top-2 right-2 w-6 h-6 rounded-full bg-neu-base shadow-neu-flat flex items-center justify-center text-neu-textMuted hover:text-rose-500 active:shadow-neu-pressed transition cursor-pointer"><i id="artworkFavIcon" class="fa-solid fa-heart text-[9px]"></i></button>

function searchLocalCatalog(query){const terms=query.toLowerCase().split(/\s+/).filter(Boolean);return LOCAL_CATALOG.filter(item=>terms.some(t=>(item.title+' '+item.artist+' '+item.album+' '+item.tags).toLowerCase().includes(t))).map((item,i)=>({id:'local-cat-'+i+'-'+Date.now(),title:item.title,artist:item.artist,album:item.album,artwork:item.artwork,url:item.url,source:'Demo',playable:true}))}
function showSearchMessage(icon,iconClass,message){searchResultsContainer.innerHTML='<div class="flex flex-col items-center justify-center py-10 text-neu-textMuted gap-2"><i class="fa-solid '+icon+' text-2xl '+iconClass+'"></i><p class="text-[11px] text-center px-4">'+escapeHtml(message)+'</p></div>'}
function renderSearchResults(results,query,notes){searchResultsContainer.innerHTML='';if(!results.length)return showSearchMessage('fa-triangle-exclamation','opacity-40','No matching tracks found for "'+query+'".');const sources=[...new Set(results.map(r=>r.source))].join(' + '),header=document.createElement('div');header.className='flex items-center justify-between px-1 pb-0.5';header.innerHTML='<span class="text-[9px] font-bold uppercase tracking-wider text-neu-textMuted">'+results.length+' result'+(results.length===1?'':'s')+' · '+escapeHtml(sources)+'</span>'+(notes.length?'<span class="text-[8px] font-semibold text-amber-600" title="'+escapeHtml(notes.join(' | '))+'">partial</span>':'');searchResultsContainer.appendChild(header);results.slice(0,30).forEach(song=>{const div=document.createElement('div'),sourceColor=song.source==='am-dl'?'text-violet-500':song.source==='iTunes'?'text-blue-500':'text-amber-500';div.className='p-2.5 rounded-2xl bg-neu-base shadow-neu-flat flex items-center justify-between gap-2.5 hover:shadow-neu-pressed transition';div.innerHTML='<div class="flex items-center gap-2.5 overflow-hidden"><img src="'+escapeHtml(song.artwork)+'" alt="Art" class="w-10 h-10 rounded-xl object-cover shadow-sm flex-shrink-0" onerror="this.src=\''+PLACEHOLDER_ART+'\'"><div class="overflow-hidden"><h4 class="text-[11px] font-bold text-neu-textDark truncate">'+escapeHtml(song.title)+'</h4><p class="text-[9px] text-neu-textMuted truncate">'+escapeHtml(song.artist)+' • '+escapeHtml(song.album)+'</p><span class="text-[8px] font-bold uppercase tracking-wide '+sourceColor+'">'+escapeHtml(song.source)+'</span></div></div><div class="flex items-center gap-1.5 flex-shrink-0"><button class="add-searched px-2.5 py-1.5 rounded-xl bg-neu-base shadow-neu-flat text-[10px] font-bold text-blue-600 hover:text-blue-700 active:shadow-neu-pressed transition flex items-center gap-1 cursor-pointer"><i class="fa-solid fa-plus text-[9px]"></i> Add</button><button class="download-searched px-2.5 py-1.5 rounded-xl bg-neu-base shadow-neu-flat text-[10px] font-bold text-emerald-600 hover:text-emerald-700 active:shadow-neu-pressed transition flex items-center gap-1 cursor-pointer"'+(song.playable?'':' disabled')+'><i class="fa-solid fa-download text-[9px]"></i></button></div>';div.querySelector('.add-searched').onclick=()=>{playlist.push({id:song.id+'-'+Date.now(),title:song.title,artist:song.artist,album:song.album,artwork:song.artwork,url:song.url||'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',isFavorite:false});renderPlaylist()};div.querySelector('.download-searched').onclick=async()=>{if(!song.playable||!song.url)return;const btn=div.querySelector('.download-searched'),safeName=(song.artist+' - '+song.title).replace(/[\\/:*?"<>|]/g,'_');btn.innerHTML='<i class="fa-solid fa-spinner animate-spin"></i>';try{const res=await fetch(song.url,{mode:'cors'});if(!res.ok)throw new Error('HTTP '+res.status);const blob=await res.blob(),blobUrl=URL.createObjectURL(blob),a=document.createElement('a');a.href=blobUrl;a.download=safeName+'.mp3';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(blobUrl)}catch(err){const a=document.createElement('a');a.href=song.url;a.download=safeName+'.mp3';a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}setTimeout(()=>btn.innerHTML='<i class="fa-solid fa-download text-[9px]"></i>',1000)};searchResultsContainer.appendChild(div)})}
async function executeSearch(query){query=(query||'').trim();if(!query)return;const token=++searchToken;searchSourceStatus.textContent='Searching am-dl & iTunes…';showSearchMessage('fa-spinner','text-blue-500 animate-spin','Querying catalogs for "'+query+'"...');const notes=[],results=[];try{results.push(...await searchAmdl(query))}catch(err){notes.push('am-dl unavailable')}if(token!==searchToken)return;try{results.push(...await searchItunes(query))}catch(err){notes.push('iTunes unavailable')}if(token!==searchToken)return;if(!results.length){results.push(...searchLocalCatalog(query));if(results.length)notes.push('showing offline demo catalog')}renderSearchResults(dedupeTracks(results),query,notes)}
function openSearchModal(){searchModal.classList.remove('opacity-0','pointer-events-none');searchModalContent.classList.remove('scale-95');setTimeout(()=>searchInput.focus(),120)}function closeSearchModal(){searchModal.classList.add('opacity-0','pointer-events-none');searchModalContent.classList.add('scale-95')}openSearchBtn.onclick=openSearchModal;openGlobeSearchBtn.onclick=openSearchModal;closeSearchModalBtn.onclick=closeSearchModal;searchModal.onclick=e=>e.target===searchModal&&closeSearchModal();document.querySelectorAll('.quick-tag').forEach(tag=>tag.onclick=()=>{searchInput.value=tag.textContent.trim();executeSearch(searchInput.value)});executeSearchBtn.onclick=()=>executeSearch(searchInput.value);searchInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(searchDebounceTimer);executeSearch(searchInput.value)}};searchInput.oninput=()=>{clearTimeout(searchDebounceTimer);const value=searchInput.value.trim();if(value.length>=2)searchDebounceTimer=setTimeout(()=>executeSearch(value),550)};document.onkeydown=e=>e.key==='Escape'&&!searchModal.classList.contains('pointer-events-none')&&closeSearchModal();loadTrack(0,false)});
    
const minimizeMiniPlayerBtn=document.getElementById('minimizeMiniPlayerBtn');
const closeMiniPlayerBtn=document.getElementById('closeMiniPlayerBtn');
minimizeMiniPlayerBtn?.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();window.parent.postMessage({type:'kefe-miniplayer-window',action:'minimize'},'*')});
closeMiniPlayerBtn?.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();window.parent.postMessage({type:'kefe-miniplayer-window',action:'close'},'*')});

const miniPlayerCard=document.querySelector('body > div.w-full.max-w-\\[340px\\]');
if(miniPlayerCard){
  let dragging=false,lastX=0,lastY=0;
  miniPlayerCard.style.cursor='grab';
  miniPlayerCard.style.touchAction='none';
  miniPlayerCard.addEventListener('pointerdown',event=>{
    if(event.target instanceof Element&&event.target.closest('button,label,input,select,textarea,a'))return;
    event.preventDefault();
    dragging=true;
    lastX=event.clientX;
    lastY=event.clientY;
    miniPlayerCard.setPointerCapture?.(event.pointerId);
    miniPlayerCard.style.cursor='grabbing';
    window.parent.postMessage({type:'kefe-miniplayer-drag',action:'start',x:lastX,y:lastY},'*');
  });
  miniPlayerCard.addEventListener('pointermove',event=>{
    if(!dragging)return;
    event.preventDefault();
    const dx=event.clientX-lastX,dy=event.clientY-lastY;
    if(!dx&&!dy)return;
    lastX=event.clientX;
    lastY=event.clientY;
    window.parent.postMessage({type:'kefe-miniplayer-drag',action:'move',dx,dy},'*');
  });
  miniPlayerCard.addEventListener('pointerup',event=>{
    if(!dragging)return;
    dragging=false;
    miniPlayerCard.releasePointerCapture?.(event.pointerId);
    miniPlayerCard.style.cursor='grab';
    window.parent.postMessage({type:'kefe-miniplayer-drag',action:'end',x:event.clientX,y:event.clientY},'*');
  });
  miniPlayerCard.addEventListener('pointercancel',event=>{
    if(!dragging)return;
    dragging=false;
    miniPlayerCard.releasePointerCapture?.(event.pointerId);
    miniPlayerCard.style.cursor='grab';
    window.parent.postMessage({type:'kefe-miniplayer-drag',action:'end',x:event.clientX,y:event.clientY},'*');
  });
}</script>
