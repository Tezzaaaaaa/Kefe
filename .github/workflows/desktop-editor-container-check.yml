name: Desktop editor container browser verification

concurrency:
  group: kefe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/desktop-editor-container-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-editor-container:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Test empty preview and desktop container locally
        run: |
          cat > /tmp/kefe-desktop-container-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          function makeTestWav() {
            const sampleRate = 8000, samples = sampleRate;
            const buffer = Buffer.alloc(44 + samples * 2);
            buffer.write('RIFF', 0); buffer.writeUInt32LE(36 + samples * 2, 4); buffer.write('WAVE', 8);
            buffer.write('fmt ', 12); buffer.writeUInt32LE(16, 16); buffer.writeUInt16LE(1, 20);
            buffer.writeUInt16LE(1, 22); buffer.writeUInt32LE(sampleRate, 24);
            buffer.writeUInt32LE(sampleRate * 2, 28); buffer.writeUInt16LE(2, 32);
            buffer.writeUInt16LE(16, 34); buffer.write('data', 36); buffer.writeUInt32LE(samples * 2, 40);
            return buffer;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--use-gl=angle', '--use-angle=swiftshader'] });
            const baseUrl = process.env.KEFE_BASE_URL || 'http://127.0.0.1:4173';
            const label = process.env.KEFE_BASE_URL ? 'published GitHub Pages' : 'local source';
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            try {
              await page.goto(baseUrl + '/editor.html', { waitUntil: 'domcontentloaded' });
              await page.waitForFunction(() => document.querySelectorAll('.kefe-editing > .kefe-vis-tabs [role="tab"]').length === 3, { timeout: 20000 });
              await page.waitForSelector('.kefe-stage.is-empty');
              await page.waitForTimeout(300);

              const emptyState = await page.evaluate(() => ({
                stageEmpty: document.querySelector('.kefe-stage').classList.contains('is-empty'),
                particleCanvasRemoved: !document.getElementById('kefeVisualiserCanvas'),
                particleControlsRemoved: !document.getElementById('visualiserPresetGrid')
              }));
              assert.equal(emptyState.stageEmpty, true, label + ': preview should start empty');
              assert.equal(emptyState.particleCanvasRemoved, true, label + ': particle renderer canvas must be removed');
              assert.equal(emptyState.particleControlsRemoved, true, label + ': particle preset controls must be removed');

              const aspect = page.locator('#kefeAspect');
              assert.equal(await aspect.isVisible(), true, label + ': aspect ratio selector must be visible and clickable');
              await aspect.selectOption('9:16');
              await page.waitForFunction(() => document.querySelector('.kefe-stage')?.classList.contains('is-9x16') && document.getElementById('kefeCanvas')?.width === 1080 && document.getElementById('kefeCanvas')?.height === 1920);
              await aspect.selectOption('1:1');
              await page.waitForFunction(() => document.querySelector('.kefe-stage')?.classList.contains('is-1x1') && document.getElementById('kefeCanvas')?.width === 1080 && document.getElementById('kefeCanvas')?.height === 1080);
              await aspect.selectOption('16:9');
              await page.waitForFunction(() => document.querySelector('.kefe-stage')?.classList.contains('is-16x9') && document.getElementById('kefeCanvas')?.width === 1920 && document.getElementById('kefeCanvas')?.height === 1080);
              const enhancedWords = await page.evaluate(() => window.kefeLyricModel.parseLrc('[00:02.00]<00:02.00>Hello <00:02.40>world')[0]?.words);
              assert.deepEqual(enhancedWords?.map(word => word.text), ['Hello', 'world'],
                label + ': enhanced LRC word timestamps must be parsed');
              assert.deepEqual(enhancedWords?.map(word => word.time), [2, 2.4],
                label + ': enhanced LRC word timestamps must retain their timing');

              await page.locator('#mediaInput').setInputFiles({
                name: 'KEFE Preview Visibility Verification.wav',
                mimeType: 'audio/wav',
                buffer: makeTestWav()
              });
              await page.waitForFunction(() => !document.querySelector('.kefe-stage')?.classList.contains('is-empty'));
              assert.equal(await page.locator('#kefeVisualiserCanvas').count(), 0, label + ': particle canvas must remain absent after upload');
              await page.locator('.kefe-sidebar [data-shell-panel="visualiser"]').click();
              await page.locator('#kefeVisGradientView:not([hidden])').waitFor();
              const visualiserPower = page.locator('.kefe-panel[data-panel-view="visualiser"] .kefe-switch').first();
              if (await visualiserPower.getAttribute('aria-checked') !== 'true') await visualiserPower.click();
              await page.waitForFunction(() => window.kefeGradientLayer?.state?.().on === true);
              assert.deepEqual(errors, [], label + ': browser runtime errors: ' + errors.join('; '));
              console.log(JSON.stringify({ result: 'PASS', label, emptyState, afterUpload: 'particle renderer absent; Liquid Flow enabled explicitly', runtimeErrors: errors }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          python3 -m http.server 4173 --directory apps/web > /tmp/kefe-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:4173/index.html -o /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/index.html -o /dev/null || { cat /tmp/kefe-http.log; exit 1; }
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/kefe-desktop-container-check.cjs

      - name: Wait for the latest GitHub Pages build
        run: |
          live_url='https://tezzaaaaaa.github.io/Kefe/apps/web/editor.html'
          expected_marker=$(grep -o 'app/ui/workspace-shell.css?v=[^\"]*' apps/web/editor.html | head -n 1)
          expected_editor=$(grep -o 'app/editor.js?v=[^\"]*' apps/web/editor.html | head -n 1)
          expected_visualiser=$(grep -o 'app/visualiser/gradient.js?v=[^\"]*' apps/web/editor.html | head -n 1)
          expected_styles=$(grep -o 'app/ui/styles.css?v=[^\"]*' apps/web/editor.html | head -n 1)
          if [ -z "$expected_marker" ] || [ -z "$expected_editor" ] || [ -z "$expected_visualiser" ] || [ -z "$expected_styles" ]; then echo 'Could not determine the expected desktop asset markers.' >&2; exit 1; fi
          for attempt in $(seq 1 48); do
            if curl --fail --silent "$live_url" -o /tmp/kefe-live-index.html && grep -Fq "$expected_marker" /tmp/kefe-live-index.html && grep -Fq "$expected_editor" /tmp/kefe-live-index.html && grep -Fq "$expected_visualiser" /tmp/kefe-live-index.html && grep -Fq "$expected_styles" /tmp/kefe-live-index.html; then
              echo "Expected desktop assets are published: $expected_marker and $expected_styles"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not publish the expected editor assets ($expected_marker; $expected_editor; $expected_visualiser; $expected_styles) in time." >&2
          exit 1

      - name: Test published GitHub Pages desktop layout
        env:
          KEFE_BASE_URL: https://tezzaaaaaa.github.io/Kefe/apps/web
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/kefe-desktop-container-check.cjs
