name: Package KEFE release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0-beta.1"
        required: true
        default: "v0.1.0-beta.1"
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate version tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Version must look like v0.1.0 or v0.1.0-beta.1" >&2
            exit 1
          fi

      - name: Assemble browser app package
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          mkdir -p dist/kefe-visualiser
          cp -R artifacts/kefe-visualiser/public/legacy/. dist/kefe-visualiser/
          cp README.md LICENSE THIRD_PARTY_NOTICES.md dist/kefe-visualiser/
          printf '%s\n' "$RELEASE_VERSION" > dist/kefe-visualiser/VERSION
          cd dist
          zip -qr "kefe-visualiser-$RELEASE_VERSION.zip" kefe-visualiser
          tar -czf "kefe-visualiser-$RELEASE_VERSION.tar.gz" kefe-visualiser

      - name: Create draft GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: main
          name: "KEFE Visualiser ${{ inputs.version }}"
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            dist/kefe-visualiser-${{ inputs.version }}.zip
            dist/kefe-visualiser-${{ inputs.version }}.tar.gz
