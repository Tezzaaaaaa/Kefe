name: beUI migration build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/beui-build.yml"
  push:
    branches: [main, "feature/full-beui-conversion", "feature/beui-conversion-mainline"]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/beui-build.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: beui-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kefe/web build
      - name: Verify production editor outputs
        run: |
          test -s apps/web/dist-beui/editor.html
          test ! -e apps/web/dist-beui/editor.source.html
          test -s apps/web/dist-beui/index.html
          test ! -e apps/web/dist-beui/beui.html
          node apps/web/scripts/smoke-build.mjs
          node apps/web/scripts/smoke-settings-api.mjs
          node apps/web/scripts/smoke-section-card-coverage.mjs
      - name: Install Playwright and PNG comparison tools
        run: npm install --prefix /tmp/kefe-browser --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0 pixelmatch@5.3.0
      - name: Find previous successful browser screenshots for this PR
        id: screenshot-baseline
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request?.head?.ref;
            if (!branch) {
              core.setOutput("run_id", "");
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "beui-build.yml",
              branch,
              status: "success",
              per_page: 100,
            });
            const previous = data.workflow_runs.find((run) =>
              run.id !== context.runId &&
              run.pull_requests?.some((pullRequest) => pullRequest.number === context.issue.number)
            );
            core.setOutput("run_id", previous ? String(previous.id) : "");
            core.info(previous ? `Using screenshot baseline from run ${previous.id} (${previous.head_sha}).` : "No previous successful screenshot run for this PR; this run establishes the baseline.");
      - name: Download previous successful browser screenshots
        if: steps.screenshot-baseline.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.screenshot-baseline.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: kefe-browser-screenshots-*
          path: /tmp/kefe-baseline-screenshots
          merge-multiple: true
      - name: Install Chromium
        run: /tmp/kefe-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run built-editor browser smoke test
        env:
          NODE_PATH: /tmp/kefe-browser/node_modules
          KEFE_SCREENSHOT_DIR: /tmp/kefe-screenshots
          KEFE_SCREENSHOT_LABEL: ${{ github.sha }}
        run: |
          mkdir -p /tmp/kefe-screenshots
          set -o pipefail
          node apps/web/scripts/browser-smoke.cjs 2>&1 | tee /tmp/kefe-screenshots/browser-smoke.log
      - name: Compare volume Card screenshots against the previous successful run
        if: steps.screenshot-baseline.outputs.run_id != ''
        env:
          NODE_PATH: /tmp/kefe-browser/node_modules
        run: node apps/web/scripts/compare-visual-screenshots.cjs /tmp/kefe-baseline-screenshots /tmp/kefe-screenshots
      - name: Upload desktop/mobile day/night screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kefe-browser-screenshots-${{ github.sha }}
          path: /tmp/kefe-screenshots/
          if-no-files-found: ignore
          retention-days: 14
