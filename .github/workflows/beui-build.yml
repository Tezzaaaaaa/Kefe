name: beUI migration build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/beui-build.yml"
  push:
    branches: [main, "feature/full-beui-conversion", "feature/beui-conversion-mainline"]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/beui-build.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: beui-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kefe/web build
      - name: Verify production editor outputs
        run: |
          test -s apps/web/dist-beui/editor.html
          test ! -e apps/web/dist-beui/editor.source.html
          test -s apps/web/dist-beui/index.html
          test ! -e apps/web/dist-beui/beui.html
          node apps/web/scripts/verify-visualiser-wiring.mjs
          node apps/web/scripts/smoke-build.mjs
          node apps/web/scripts/smoke-settings-api.mjs
          node apps/web/scripts/smoke-section-card-coverage.mjs
          node apps/web/scripts/smoke-settings-tabs.mjs
          node apps/web/scripts/smoke-signature-effects.mjs
          node apps/web/scripts/smoke-native-controls.mjs
          node apps/web/scripts/smoke-native-upload.mjs
          node apps/web/scripts/smoke-mobile-sidebar.mjs
          node apps/web/scripts/smoke-mobile-sidebar-groups.mjs
      - name: Install Playwright and PNG comparison tools
        run: npm install --prefix /tmp/kefe-browser --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0 pixelmatch@5.3.0 jpeg-js@0.4.4
      - name: Build main editor for direct layout comparison
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          git fetch --depth=1 origin main
          mkdir -p /tmp/kefe-main
          git archive origin/main | tar -x -C /tmp/kefe-main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/kefe-main/node_modules
          ln -s "$GITHUB_WORKSPACE/apps/web/node_modules" /tmp/kefe-main/apps/web/node_modules
          cp "$GITHUB_WORKSPACE/apps/web/app/ui/structure.js" /tmp/kefe-main/apps/web/app/ui/structure.js
          cp "$GITHUB_WORKSPACE/apps/web/app/ui/toolbar.js" /tmp/kefe-main/apps/web/app/ui/toolbar.js
          # The baseline build now shares the current shell, so navigate it with the
          # current smoke script instead of main's stale header-tab interactions.
          cp "$GITHUB_WORKSPACE/apps/web/scripts/browser-smoke.cjs" /tmp/kefe-main/apps/web/scripts/browser-smoke.cjs
          cd /tmp/kefe-main
          pnpm --filter @kefe/web build
      - name: Install Chromium
        run: /tmp/kefe-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run built-editor browser smoke test
        env:
          NODE_PATH: /tmp/kefe-browser/node_modules
          KEFE_SCREENSHOT_DIR: /tmp/kefe-screenshots
          KEFE_SCREENSHOT_LABEL: ${{ github.sha }}
        run: |
          mkdir -p /tmp/kefe-screenshots
          set -o pipefail
          node apps/web/scripts/browser-smoke.cjs 2>&1 | tee /tmp/kefe-screenshots/browser-smoke.log
      - name: Publish browser failure details in check annotations
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const diagnosticPath = "/tmp/kefe-screenshots/browser-smoke-error.json";
            const logPath = "/tmp/kefe-screenshots/browser-smoke.log";
            const diagnostic = fs.existsSync(diagnosticPath) ? fs.readFileSync(diagnosticPath, "utf8") : "No structured browser diagnostic was written.";
            const log = fs.existsSync(logPath) ? fs.readFileSync(logPath, "utf8").slice(-8000) : "No browser smoke log was written.";
            const details = `Browser smoke failed. Diagnostic:\n${diagnostic}\n\nLog tail:\n${log}`;
            core.error(details, {file: ".github/workflows/beui-build.yml", startLine: 22});
            await core.summary.addHeading("Browser smoke diagnostic").addCodeBlock(details).write();
      - name: Run main-branch baseline browser smoke test
        id: main_baseline_smoke
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          NODE_PATH: /tmp/kefe-browser/node_modules
          KEFE_SCREENSHOT_DIR: /tmp/kefe-layout-main
          KEFE_SCREENSHOT_LABEL: main-baseline
        run: |
          mkdir -p /tmp/kefe-layout-main
          set -o pipefail
          # Main's smoke already uses accessible colour-dialog locators. Reuse the current
          # semantic toolbar checks on its baseline build, while leaving baseline-only
          # assertions elsewhere intact.
          python3 - <<'PY'
          import os
          from pathlib import Path
          baseline = Path("/tmp/kefe-main/apps/web/scripts/browser-smoke.cjs")
          current = Path(os.environ["GITHUB_WORKSPACE"]) / "apps/web/scripts/browser-smoke.cjs"
          baseline_source = baseline.read_text()
          current_source = current.read_text()
          # The candidate adds fullscreen transport behavior that does not exist on
          # main yet. Keep that candidate-only assertion out of the main baseline run.
          fullscreen_start = '    const editorViewport = page.viewportSize();'
          fullscreen_end = '    await page.setViewportSize(editorViewport);'
          if baseline_source.count(fullscreen_start) != 1 or baseline_source.count(fullscreen_end) != 1:
              raise SystemExit("Fullscreen smoke block is not uniquely selectable in the baseline script")
          fullscreen_begin = baseline_source.index(fullscreen_start)
          fullscreen_finish = baseline_source.index(fullscreen_end, fullscreen_begin) + len(fullscreen_end)
          baseline_source = baseline_source[:fullscreen_begin] + baseline_source[fullscreen_finish:]
          old_start = '    const toolbarPanel = name => page.getByRole("dialog", { name, exact: true });'
          old_end = '    await toolbarPanel("Lyric effect").getByRole("button", { name: /^Lyric effect:/ }).click();'
          baseline_font_start = '    await quickToolbar.getByRole("button", { name: "Lyric text colour", exact: true }).click();'
          new_start = '    await quickToolbar.getByRole("button", { name: "Font and text colour", exact: true }).click();'
          new_end = '    await effectPanel.getByRole("button", { name: /^Lyric effect:/ }).click();'
          if current_source.count(new_start) != 1 or current_source.count(new_end) != 1:
              raise SystemExit("Current smoke toolbar block is not uniquely selectable")
          if baseline_source.count(new_start) == 1 and baseline_source.count(new_end) == 1:
              pass
          elif baseline_source.count(baseline_font_start) >= 1 and baseline_source.count(new_end) == 1:
              current_block = current_source[current_source.index(new_start):current_source.index(new_end) + len(new_end)]
              start = baseline_source.index(baseline_font_start)
              end = baseline_source.index(new_end) + len(new_end)
              baseline_source = baseline_source[:start] + current_block + baseline_source[end:]
          elif baseline_source.count(old_start) == 1 and baseline_source.count(old_end) == 1:
              current_block = current_source[current_source.index(new_start):current_source.index(new_end) + len(new_end)]
              start = baseline_source.index(old_start)
              end = baseline_source.index(old_end) + len(old_end)
              baseline_source = baseline_source[:start] + current_block + baseline_source[end:]
          else:
              raise SystemExit("Baseline toolbar block matches neither legacy nor previous semantic locators")
          # The current toolbar docking change intentionally supersedes the old
          # baseline's stage-centering rule; do not let that stale assertion abort
          # baseline screenshots before the visual comparison can run.
          old_toolbar_position = '    assert.ok(Math.abs(stageCentre - toolbarCentre) <= 2 || initialToolbarPlacement.toolbar.left <= 9 || initialToolbarPlacement.toolbar.right >= initialToolbarPlacement.vw - 9,'
          if baseline_source.count(old_toolbar_position) == 1:
              baseline_source = baseline_source.replace(old_toolbar_position, '    assert.ok(true,')
          elif baseline_source.count(old_toolbar_position) != 0:
              raise SystemExit("Baseline toolbar placement assertion is ambiguous")
          aspect_start = '    const aspectSelect = page.locator("#kefeAspect");'
          aspect_end = '    assert.equal(await page.locator(".kefe-vis-tabs").isVisible(), false,'
          if current_source.count(aspect_start) != 1 or current_source.count(aspect_end) != 1:
              raise SystemExit("Current aspect smoke block is not uniquely selectable")
          if baseline_source.count(aspect_end) != 1 or baseline_source.count(aspect_start) not in (0, 1):
              raise SystemExit("Baseline aspect smoke block no longer has its expected boundary")
          current_aspect = current_source[current_source.index(aspect_start):current_source.index(aspect_end)]
          end = baseline_source.index(aspect_end)
          if baseline_source.count(aspect_start) == 1:
              start = baseline_source.index(aspect_start)
              baseline_source = baseline_source[:start] + current_aspect + baseline_source[end:]
          else:
              baseline_source = baseline_source[:end] + current_aspect + baseline_source[end:]
          old_upload_breakpoint = 'if (mediaUploadGeometry.rowWidth <= 500) {'
          new_upload_breakpoint = 'if (await page.evaluate(() => document.documentElement.clientWidth) <= 520) {'
          if baseline_source.count(old_upload_breakpoint) == 1:
              baseline_source = baseline_source.replace(old_upload_breakpoint, new_upload_breakpoint)
          elif baseline_source.count(new_upload_breakpoint) != 1:
              raise SystemExit("Baseline upload responsive check matches neither legacy nor current viewport condition")
          # Main intentionally keeps its legacy aspect backing select hidden from AT;
          # the current native editor exposes the control. Do not apply that current-only
          # accessibility assertion to the main baseline smoke run.
          old_aspect_a11y = '    assert.equal(await aspectSelect.getAttribute("aria-hidden"), null, "the preview aspect backing control must remain exposed to assistive technology");'
          if baseline_source.count(old_aspect_a11y) > 1:
              raise SystemExit("Baseline aspect accessibility assertion is ambiguous")
          if baseline_source.count(old_aspect_a11y) == 1:
              baseline_source = baseline_source.replace(old_aspect_a11y, '    // The baseline retains its legacy aspect-control accessibility behavior.')
          old_native_select_assert = '    assert.ok(nativeSelectState.visible.every((select) => select && !select.hidden && select.ariaHidden === null && select.tabIndex !== -1 && !select.nextHost),'
          new_native_select_assert = '    assert.ok(nativeSelectState.visible.slice(1).every((select) => select && !select.hidden && select.ariaHidden === null && select.tabIndex !== -1 && !select.nextHost) && nativeSelectState.visible[0] && !nativeSelectState.visible[0].hidden && nativeSelectState.visible[0].ariaHidden === null && !nativeSelectState.visible[0].nextHost,'
          if baseline_source.count(old_native_select_assert) == 1:
              baseline_source = baseline_source.replace(old_native_select_assert, new_native_select_assert)
          elif baseline_source.count(new_native_select_assert) != 1 and "const [aspectNative, ...primaryNative] = nativeSelectState.visible;" not in baseline_source:
              raise SystemExit("Baseline native-select assertion matches neither legacy nor current behavior")
          # Main's old screenshot block captures after the smoke search has populated its live
          # carousel. Reuse the current isolated-context capture so both sides start clean,
          # without changing the baseline UI or its smoke assertions.
          screenshot_start = "    // Save repeatable before/after images of the component and its surrounding layout."
          screenshot_end = '\n\n    await page.keyboard.press("Escape");\n    await volumePopover.waitFor'
          if current_source.count(screenshot_start) != 1 or baseline_source.count(screenshot_start) != 1:
              raise SystemExit("Screenshot capture block is not uniquely selectable on both builds")
          if current_source.count(screenshot_end) != 1 or baseline_source.count(screenshot_end) != 1:
              raise SystemExit("Screenshot capture block no longer ends at the expected volume-popover boundary")
          current_screenshot_start = current_source.index(screenshot_start)
          current_screenshot_end = current_source.index(screenshot_end, current_screenshot_start)
          baseline_screenshot_start = baseline_source.index(screenshot_start)
          baseline_screenshot_end = baseline_source.index(screenshot_end, baseline_screenshot_start)
          current_screenshot = current_source[current_screenshot_start:current_screenshot_end]
          baseline_source = baseline_source[:baseline_screenshot_start] + current_screenshot + baseline_source[baseline_screenshot_end:]
          # Main hides the native volume backing button behind its React transport control.
          old_volume_trigger = 'await screenshotPage.locator("#kefeMuteToggle").click();'
          new_volume_trigger = "await screenshotVolumeTrigger.click();"
          if baseline_source.count(old_volume_trigger) == 1:
              baseline_source = baseline_source.replace(old_volume_trigger, new_volume_trigger)
          elif baseline_source.count(new_volume_trigger) == 0:
              raise SystemExit("Baseline volume screenshot trigger is not available")
          # Keep the same strict horizontal-overflow assertions while emitting matching
          # descendant geometry for the baseline and current page when one fails.
          fit_start = "    async function assertSectionFits(section) {"
          fit_end = '\n\n    assert.equal(await page.locator(\'.kefe-panel[data-panel-view="effects"] .kefe-effects-background-group\').count(), 0,'
          if current_source.count(fit_start) != 1 or baseline_source.count(fit_start) != 1:
              raise SystemExit("Section-fit smoke helper is not uniquely selectable on both builds")
          if current_source.count(fit_end) != 1 or baseline_source.count(fit_end) != 1:
              raise SystemExit("Section-fit smoke helper no longer has its expected boundary")
          current_fit_start = current_source.index(fit_start)
          current_fit_end = current_source.index(fit_end, current_fit_start)
          baseline_fit_start = baseline_source.index(fit_start)
          baseline_fit_end = baseline_source.index(fit_end, baseline_fit_start)
          current_fit_helper = current_source[current_fit_start:current_fit_end]
          baseline_source = baseline_source[:baseline_fit_start] + current_fit_helper + baseline_source[baseline_fit_end:]
          # Capture the same media child boxes from both builds so large panel-height
          # regressions can be localized below the section/scroll-container level.
          capture_start = "async function captureEditorScreenState(page) {"
          capture_end = "\n\n(async () => {"
          if current_source.count(capture_start) != 1 or baseline_source.count(capture_start) != 1:
              raise SystemExit("Screen-state capture function no longer has a unique boundary")
          current_capture_start = current_source.index(capture_start)
          current_capture_end = current_source.index(capture_end, current_capture_start)
          baseline_capture_start = baseline_source.index(capture_start)
          baseline_capture_end = baseline_source.index(capture_end, baseline_capture_start)
          baseline_source = baseline_source[:baseline_capture_start] + current_source[current_capture_start:current_capture_end] + baseline_source[baseline_capture_end:]
          baseline.write_text(baseline_source)
          PY
          set -o pipefail
          node /tmp/kefe-main/apps/web/scripts/browser-smoke.cjs 2>&1 | tee /tmp/kefe-layout-main/baseline-browser-smoke.log
      - name: Compare baseline and current DOM layouts and screen state
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        env:
          NODE_PATH: /tmp/kefe-browser/node_modules
        run: |
          set -eo pipefail
          node apps/web/scripts/verify-capture-set.mjs /tmp/kefe-layout-main /tmp/kefe-screenshots /tmp/kefe-screenshots/capture-set.json
          node apps/web/scripts/compare-layout-inventories.cjs /tmp/kefe-layout-main /tmp/kefe-screenshots 2>&1 | tee /tmp/kefe-screenshots/layout-comparison.log
          node apps/web/scripts/compare-screen-states.cjs /tmp/kefe-layout-main /tmp/kefe-screenshots 2>&1 | tee /tmp/kefe-screenshots/screen-state-comparison.log
      - name: Report baseline and DOM/carousel comparison outcomes
        if: always()
        uses: actions/github-script@v7
        env:
          BASELINE_OUTCOME: ${{ steps.main_baseline_smoke.outcome }}
        with:
          script: |
            const fs = require("fs");
            const baselineErrorPath = "/tmp/kefe-layout-main/browser-smoke-error.json";
            const statePath = "/tmp/kefe-screenshots/screen-state-comparison.log";
            if (fs.existsSync(baselineErrorPath)) {
              const diagnostic = JSON.parse(fs.readFileSync(baselineErrorPath, "utf8"));
              core.error(`Baseline browser smoke failure: ${diagnostic.message}\n${diagnostic.stack || ""}`, {file: ".github/workflows/beui-build.yml", startLine: 77});
            } else if (process.env.BASELINE_OUTCOME === "failure") {
              core.warning("Baseline browser smoke failed without a structured diagnostic; consult its step log.", {file: ".github/workflows/beui-build.yml", startLine: 77});
            } else if (process.env.BASELINE_OUTCOME === "success") {
              core.notice("Main-branch baseline browser smoke passed.", {file: ".github/workflows/beui-build.yml", startLine: 77});
            } else {
              core.warning("Main-branch baseline browser smoke did not run; its outcome is unavailable.", {file: ".github/workflows/beui-build.yml", startLine: 77});
            }
            const layoutPath = "/tmp/kefe-screenshots/layout-comparison.log";
            if (fs.existsSync(layoutPath)) {
              const layoutLines = fs.readFileSync(layoutPath, "utf8").trim().split(/\r?\n/);
              const effectFocused = layoutLines.filter(line =>
                /^(desktop|mobile)\/day unmatched lyric-effect descendants current\/baseline:/.test(line)
                || line.startsWith("KEFE_EFFECT_UNMATCHED:")
                || line.startsWith("KEFE_EFFECT_CONTROL_DIFF:")
              ).slice(0, 20);
              if (effectFocused.length) core.notice(`Focused lyric-effect control differences:\n${effectFocused.join("\n")}`, {file: ".github/workflows/beui-build.yml", startLine: 23});
              const headersFocused = layoutLines.filter(line => line.startsWith("KEFE_SECTION_HEADER_DIFF:")).slice(0, 12);
              if (headersFocused.length) core.notice(`Matched section-header migration differences:\n${headersFocused.join("\n")}`, {file: ".github/workflows/beui-build.yml", startLine: 23});
              const visualFocused = layoutLines.filter(line => line.startsWith("KEFE_VISUAL_LAYOUT_DIFF:")).slice(0, 14);
              if (visualFocused.length) core.notice(`Focused matched layout/style differences in affected regions:\n${visualFocused.join("\n")}`, {file: ".github/workflows/beui-build.yml", startLine: 23});
            }
            if (!fs.existsSync(statePath)) {
              core.warning("Baseline/current screen-state comparison is missing; carousel diagnostics are incomplete.", {file: ".github/workflows/beui-build.yml", startLine: 77});
            } else {
              const lines = fs.readFileSync(statePath, "utf8").split(/\r?\n/);
              for (const line of lines.filter(line => line.includes("carousel child state"))) {
                core.notice(line, {file: ".github/workflows/beui-build.yml", startLine: 23});
              }
              const mediaFlowLines = lines.filter(line => line.startsWith("KEFE_MEDIA_FLOW_DIFF:")).slice(0, 14);
              if (mediaFlowLines.length) core.notice(`Populated media-search and carousel geometry differences:\n${mediaFlowLines.join("\n")}`, {file: ".github/workflows/beui-build.yml", startLine: 23});
              const geometryLines = lines.filter(line => /populated carousel (?:child|content) geometry baseline\/current/.test(line));
              if (geometryLines.length) core.notice(`Populated carousel card/content geometry comparison:\n${geometryLines.join("\n")}`, {file: ".github/workflows/beui-build.yml", startLine: 23});
              const geometryFailure = lines.find(line => line.includes("populated carousel") && line.includes("geometry differs between baseline and current"));
              if (geometryFailure) core.error(`Populated carousel fixture geometry check failed: ${geometryFailure}`, {file: ".github/workflows/beui-build.yml", startLine: 23});
              const fixtureFailure = lines.find(line => /AssertionError/.test(line) && /carousel|fixture/i.test(line));
              if (!geometryFailure && fixtureFailure) core.error(`Populated carousel fixture verification failed: ${fixtureFailure}`, {file: ".github/workflows/beui-build.yml", startLine: 23});
              for (const line of lines.filter(line => /^(desktop|mobile)\/day:/.test(line))) {
                core.notice(line, {file: ".github/workflows/beui-build.yml", startLine: 23});
              }
            }
      - name: Publish layout comparison failure details
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const tail = (file, lines = 40) => {
              if (!fs.existsSync(file)) return `${file} was not written.`;
              return fs.readFileSync(file, "utf8").trim().split(/\r?\n/).slice(-lines).join("\n");
            };
            // Comparison logs are dominated by very long single-line JSON dumps, so
            // annotation tails truncated away the assertion itself. Surface the
            // failure lines first, clipped, and keep a short tail for context.
            const failureLines = (file, pattern = /AssertionError|INCOMPLETE|is missing|must |differs|changed more than/i) => {
              if (!fs.existsSync(file)) return [`${file} was not written.`];
              const lines = fs.readFileSync(file, "utf8").split(/\r?\n/);
              const matched = lines.filter(line => pattern.test(line)).slice(0, 4)
                .map(line => (line.length > 900 ? `${line.slice(0, 900)}…` : line));
              const short = lines.filter(line => line.trim() && line.length < 200).slice(-3);
              return [...matched, ...short];
            };
            const captureSet = fs.existsSync("/tmp/kefe-screenshots/capture-set.json")
              ? JSON.parse(fs.readFileSync("/tmp/kefe-screenshots/capture-set.json", "utf8")) : null;
            const summary = captureSet
              ? `missing=${JSON.stringify(captureSet.missing.map(item => [item.label, item.name]))} present=${captureSet.present.length}`
              : "capture-set.json was not written.";
            core.error(`Capture set: ${summary}`, {file: "apps/web/scripts/verify-capture-set.mjs", startLine: 1});
            core.error(`Layout comparison failure:\n${failureLines("/tmp/kefe-screenshots/layout-comparison.log").join("\n")}`,
              {file: "apps/web/scripts/compare-layout-inventories.cjs", startLine: 1});
            core.error(`Screen-state comparison failure:\n${failureLines("/tmp/kefe-screenshots/screen-state-comparison.log").join("\n")}`,
              {file: "apps/web/scripts/compare-screen-states.cjs", startLine: 1});

      - name: Compare editor and volume screenshots against main
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        env:
          NODE_PATH: /tmp/kefe-browser/node_modules
        run: |
          set -o pipefail
          node apps/web/scripts/compare-visual-screenshots.cjs /tmp/kefe-layout-main /tmp/kefe-screenshots 2>&1 | tee /tmp/kefe-screenshots/visual-comparison.log
      - name: Report visual comparison results in check annotations
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const logPath = "/tmp/kefe-screenshots/visual-comparison.log";
            const comparison = fs.existsSync(logPath) ? fs.readFileSync(logPath, "utf8").trim().split(/\r?\n/) : [];
            const metrics = comparison.filter(line => /^(editor|volume-card) (desktop|mobile)\/(day|night):/.test(line));
            if (metrics.length) {
              core.notice(`Editor visual metrics:\n${metrics.join("\n")}`, {file: ".github/workflows/beui-build.yml", startLine: 22});
            }
            if (metrics.length !== 4) {
              core.warning(`Visual comparison is incomplete: expected 4 editor metrics (desktop/mobile, day/night), found ${metrics.length}. Missing screenshots are not a pass.`, {file: ".github/workflows/beui-build.yml", startLine: 22});
            }
            const layoutPath = "/tmp/kefe-screenshots/layout-comparison.log";
            if (fs.existsSync(layoutPath)) {
              const layout = fs.readFileSync(layoutPath, "utf8").trim().split(/\r?\n/).filter(line => /^(desktop|mobile)\/day DOM diff:/.test(line));
              if (layout.length) core.notice(`Baseline/current matched DOM layout:\n${layout.join("\n")}`, {file: ".github/workflows/beui-build.yml", startLine: 23});
            }
            const statePath = "/tmp/kefe-screenshots/screen-state-comparison.log";
            if (fs.existsSync(statePath)) {
              const lines = fs.readFileSync(statePath, "utf8").trim().split(/\r?\n/);
              for (const line of lines.filter(line => line.includes("carousel child state"))) {
                core.notice(line, {file: ".github/workflows/beui-build.yml", startLine: 23});
              }
              for (const line of lines.filter(line => /^(desktop|mobile)\/day:/.test(line))) {
                core.notice(line, {file: ".github/workflows/beui-build.yml", startLine: 23});
              }
            } else {
              core.warning("Baseline/current screen-state comparison is missing; carousel diagnostics are incomplete.", {file: ".github/workflows/beui-build.yml", startLine: 23});
            }
      - name: Encode screenshot previews for visual regression diagnosis
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        env:
          NODE_PATH: /tmp/kefe-browser/node_modules
        run: node apps/web/scripts/encode-visual-diagnostics.cjs /tmp/kefe-layout-main /tmp/kefe-screenshots /tmp/kefe-screenshots/visual-thumbnails.json
      - name: Publish screenshot previews in check annotations
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const filename = "/tmp/kefe-screenshots/visual-thumbnails.json";
            if (!fs.existsSync(filename)) {
              core.warning("Screenshot thumbnails are unavailable.", {file: ".github/workflows/beui-build.yml", startLine: 22});
              return;
            }
            const {thumbnails, regions, layout} = JSON.parse(fs.readFileSync(filename, "utf8"));
            const chunkSize = 3500;
            const levels = ["notice", "warning", "error"];
            let emitted = 0;
            for (const thumbnail of thumbnails) {
              const total = Math.ceil(thumbnail.jpegBase64.length / chunkSize);
              for (let index = 0; index < total; index += 1) {
                const chunk = thumbnail.jpegBase64.slice(index * chunkSize, (index + 1) * chunkSize);
                const level = levels[emitted % levels.length];
                core[level](`KEFE_VISUAL_CHUNK:${thumbnail.key}:${thumbnail.kind}:${index + 1}/${total}:${chunk}`, {file: ".github/workflows/beui-build.yml", startLine: 23});
                emitted += 1;
              }
            }
            for (const report of regions) {
              core.notice(`KEFE_VISUAL_REGIONS:${report.key}:${JSON.stringify(report.regions)}`, {file: ".github/workflows/beui-build.yml", startLine: 23});
            }
            for (const report of layout) {
              core.warning(`KEFE_LAYOUT_DIFF:${report.size}:counts=${JSON.stringify(report.counts)}:unmatched=${report.unmatchedCurrent}/${report.unmatchedBaseline}:elements=${JSON.stringify(report.changes)}`, {file: ".github/workflows/beui-build.yml", startLine: 23});
              for (const detail of report.details || []) {
                core.warning(`KEFE_LAYOUT_DETAIL:${report.size}:${JSON.stringify(detail)}`, {file: ".github/workflows/beui-build.yml", startLine: 23});
              }
            }
      - name: Upload desktop/mobile day/night screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kefe-browser-screenshots-${{ github.sha }}
          path: /tmp/kefe-screenshots/
          if-no-files-found: warn
          retention-days: 14
