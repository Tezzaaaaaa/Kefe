name: beUI migration build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/beui-build.yml"
  push:
    branches: [main, "feature/full-beui-conversion", "feature/beui-conversion-mainline"]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/beui-build.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: beui-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kefe/web build
      - name: Verify production editor outputs
        run: |
          test -s apps/web/dist-beui/editor.html
          test ! -e apps/web/dist-beui/editor.source.html
          test -s apps/web/dist-beui/index.html
          test ! -e apps/web/dist-beui/beui.html
          node apps/web/scripts/smoke-build.mjs
          node apps/web/scripts/smoke-settings-api.mjs
          node apps/web/scripts/smoke-section-card-coverage.mjs
      - name: Install Playwright and PNG comparison tools
        run: npm install --prefix /tmp/kefe-browser --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0 pixelmatch@5.3.0
      - name: Find latest successful main-branch browser screenshots
        id: screenshot-baseline
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "beui-build.yml",
              branch: "main",
              status: "success",
              per_page: 100,
            });
            const baseline = data.workflow_runs.find((run) => run.id !== context.runId);
            core.setOutput("run_id", baseline ? String(baseline.id) : "");
            core.info(baseline ? `Using published-main screenshot baseline from run ${baseline.id} (${baseline.head_sha}).` : "No successful main-branch screenshot baseline is available; this run establishes one.");
      - name: Download main-branch browser screenshot baseline
        if: steps.screenshot-baseline.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.screenshot-baseline.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: kefe-browser-screenshots-*
          path: /tmp/kefe-baseline-screenshots
          merge-multiple: true
      - name: Install Chromium
        run: /tmp/kefe-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run built-editor browser smoke test
        env:
          NODE_PATH: /tmp/kefe-browser/node_modules
          KEFE_SCREENSHOT_DIR: /tmp/kefe-screenshots
          KEFE_SCREENSHOT_LABEL: ${{ github.sha }}
        run: |
          mkdir -p /tmp/kefe-screenshots
          set -o pipefail
          node apps/web/scripts/browser-smoke.cjs 2>&1 | tee /tmp/kefe-screenshots/browser-smoke.log
      - name: Publish browser failure details in check annotations
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const diagnosticPath = "/tmp/kefe-screenshots/browser-smoke-error.json";
            const logPath = "/tmp/kefe-screenshots/browser-smoke.log";
            const diagnostic = fs.existsSync(diagnosticPath) ? fs.readFileSync(diagnosticPath, "utf8") : "No structured browser diagnostic was written.";
            const log = fs.existsSync(logPath) ? fs.readFileSync(logPath, "utf8").slice(-8000) : "No browser smoke log was written.";
            core.error(`Browser smoke failed. Diagnostic:\n${diagnostic}\n\nLog tail:\n${log}`, {file: ".github/workflows/beui-build.yml", startLine: 22});
      - name: Compare editor and volume screenshots against main
        if: steps.screenshot-baseline.outputs.run_id != ''
        env:
          NODE_PATH: /tmp/kefe-browser/node_modules
        run: |
          set -o pipefail
          node apps/web/scripts/compare-visual-screenshots.cjs /tmp/kefe-baseline-screenshots /tmp/kefe-screenshots 2>&1 | tee /tmp/kefe-screenshots/visual-comparison.log
      - name: Report visual comparison results in check annotations
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const logPath = "/tmp/kefe-screenshots/visual-comparison.log";
            if (!fs.existsSync(logPath)) {
              core.info("No screenshot comparison log was produced in this run.");
              return;
            }
            const comparison = fs.readFileSync(logPath, "utf8").trim();
            core.notice(`Editor and volume screenshot comparison:\n${comparison}`, {file: ".github/workflows/beui-build.yml", startLine: 22});
      - name: Upload desktop/mobile day/night screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kefe-browser-screenshots-${{ github.sha }}
          path: /tmp/kefe-screenshots/
          if-no-files-found: ignore
          retention-days: 14
