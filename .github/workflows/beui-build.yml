name: beUI migration build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/beui-build.yml"
  push:
    branches: [main, "feature/full-beui-conversion", "feature/beui-conversion-mainline"]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/beui-build.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: beui-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kefe/web build
      - name: Verify production editor outputs
        run: |
          test -s apps/web/dist-beui/editor.html
          test ! -e apps/web/dist-beui/editor.source.html
          test -s apps/web/dist-beui/index.html
          test ! -e apps/web/dist-beui/beui.html
          node apps/web/scripts/smoke-build.mjs
          node apps/web/scripts/smoke-settings-api.mjs
          node apps/web/scripts/smoke-section-card-coverage.mjs
      - name: Install Playwright and PNG comparison tools
        run: npm install --prefix /tmp/kefe-browser --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0 pixelmatch@5.3.0
      - name: Find latest successful main-branch browser screenshots
        id: screenshot-baseline
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "beui-build.yml",
              branch: "main",
              status: "success",
              per_page: 100,
            });
            const baseline = data.workflow_runs.find((run) => run.id !== context.runId);
            core.setOutput("run_id", baseline ? String(baseline.id) : "");
            core.info(baseline ? `Using published-main screenshot baseline from run ${baseline.id} (${baseline.head_sha}).` : "No successful main-branch screenshot baseline is available; this run establishes one.");
      - name: Download main-branch browser screenshot baseline
        if: steps.screenshot-baseline.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.screenshot-baseline.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: kefe-browser-screenshots-*
          path: /tmp/kefe-baseline-screenshots
          merge-multiple: true
      - name: Build main editor for direct layout comparison
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin main
          mkdir -p /tmp/kefe-main
          git archive origin/main | tar -x -C /tmp/kefe-main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/kefe-main/node_modules
          ln -s "$GITHUB_WORKSPACE/apps/web/node_modules" /tmp/kefe-main/apps/web/node_modules
          cd /tmp/kefe-main
          pnpm --filter @kefe/web build
      - name: Install Chromium
        run: /tmp/kefe-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run built-editor browser smoke test
        env:
          NODE_PATH: /tmp/kefe-browser/node_modules
          KEFE_SCREENSHOT_DIR: /tmp/kefe-screenshots
          KEFE_SCREENSHOT_LABEL: ${{ github.sha }}
        run: |
          mkdir -p /tmp/kefe-screenshots
          set -o pipefail
          node apps/web/scripts/browser-smoke.cjs 2>&1 | tee /tmp/kefe-screenshots/browser-smoke.log
      - name: Publish browser failure details in check annotations
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const diagnosticPath = "/tmp/kefe-screenshots/browser-smoke-error.json";
            const logPath = "/tmp/kefe-screenshots/browser-smoke.log";
            const diagnostic = fs.existsSync(diagnosticPath) ? fs.readFileSync(diagnosticPath, "utf8") : "No structured browser diagnostic was written.";
            const log = fs.existsSync(logPath) ? fs.readFileSync(logPath, "utf8").slice(-8000) : "No browser smoke log was written.";
            core.error(`Browser smoke failed. Diagnostic:\n${diagnostic}\n\nLog tail:\n${log}`, {file: ".github/workflows/beui-build.yml", startLine: 22});
      - name: Compare baseline and current day-theme DOM layouts and scroll state
        if: github.event_name == 'pull_request'
        env:
          NODE_PATH: /tmp/kefe-browser/node_modules
          KEFE_SCREENSHOT_DIR: /tmp/kefe-layout-main
          KEFE_SCREENSHOT_LABEL: main-baseline
        run: |
          mkdir -p /tmp/kefe-layout-main
          python3 - <<'PY'
          from os import environ
          from pathlib import Path
          current = Path(environ["GITHUB_WORKSPACE"], "apps/web/scripts/browser-smoke.cjs").read_text()
          helper_start = current.index("async function captureEditorLayout(page)")
          helper_end = current.index("\n(async () =>", helper_start)
          helpers = current[helper_start:helper_end]
          baseline_path = Path("/tmp/kefe-main/apps/web/scripts/browser-smoke.cjs")
          baseline = baseline_path.read_text()
          baseline = baseline.replace("\n(async () => {", "\n" + helpers + "\n\n(async () => {", 1)
          needle = '          await page.screenshot({ path: path.join(screenshotDir, `editor-${suffix}.png`), animations: "disabled" });'
          probe = '''          const editorLayout = await captureEditorLayout(page);
          fs.writeFileSync(path.join(screenshotDir, `editor-layout-${size}-${theme}.json`), JSON.stringify(editorLayout));
          const editorScreenState = await captureEditorScreenState(page);
          fs.writeFileSync(path.join(screenshotDir, `editor-screen-state-${size}-${theme}.json`), JSON.stringify(editorScreenState));
          await page.screenshot({ path: path.join(screenshotDir, `editor-${suffix}.png`), animations: "disabled" });'''
          if baseline.count(needle) != 1:
              raise SystemExit(f"expected one baseline screenshot hook, found {baseline.count(needle)}")
          baseline_path.write_text(baseline.replace(needle, probe, 1))
          PY
          node /tmp/kefe-main/apps/web/scripts/browser-smoke.cjs
          node apps/web/scripts/compare-layout-inventories.cjs /tmp/kefe-layout-main /tmp/kefe-screenshots | tee /tmp/kefe-screenshots/layout-comparison.log
          node apps/web/scripts/compare-screen-states.cjs /tmp/kefe-layout-main /tmp/kefe-screenshots | tee /tmp/kefe-screenshots/screen-state-comparison.log
      - name: Compare editor and volume screenshots against main
        if: steps.screenshot-baseline.outputs.run_id != ''
        env:
          NODE_PATH: /tmp/kefe-browser/node_modules
        run: |
          set -o pipefail
          node apps/web/scripts/compare-visual-screenshots.cjs /tmp/kefe-baseline-screenshots /tmp/kefe-screenshots 2>&1 | tee /tmp/kefe-screenshots/visual-comparison.log
      - name: Report visual comparison results in check annotations
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const logPath = "/tmp/kefe-screenshots/visual-comparison.log";
            if (!fs.existsSync(logPath)) {
              core.info("No screenshot comparison log was produced in this run.");
              return;
            }
            const comparison = fs.readFileSync(logPath, "utf8").trim();
            core.notice(`Editor and volume screenshot comparison:\n${comparison}`, {file: ".github/workflows/beui-build.yml", startLine: 22});
            for (const [kind, comparisonPath] of [
              ["DOM", "/tmp/kefe-screenshots/layout-comparison.log"],
              ["scroll state", "/tmp/kefe-screenshots/screen-state-comparison.log"],
            ]) {
              if (!fs.existsSync(comparisonPath)) continue;
              const lines = fs.readFileSync(comparisonPath, "utf8").trim().split(/\r?\n/).filter(Boolean);
              for (const line of lines.slice(0, 12)) {
                core.notice(`Baseline/current ${kind}: ${line}`, {file: ".github/workflows/beui-build.yml", startLine: 23});
              }
            }
      - name: Upload desktop/mobile day/night screenshots and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kefe-browser-screenshots-${{ github.sha }}
          path: /tmp/kefe-screenshots/
          if-no-files-found: ignore
          retention-days: 14
