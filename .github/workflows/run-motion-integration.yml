name: Run native motion integration

on:
  push:
    branches: [native-motion-integration]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch canonical integration
        run: |
          python3 <<'PY'
          from pathlib import Path
          root = Path('.')
          app = root/'app/app.js'; s=app.read_text()
          if 'case "rise":' not in s:
            old='''        case "pulse": drawPulseEffect(ctx, w, h, style, lines, time); break;
        case "typewriter":
        case "instagram":
        case "fadeup": {
            const fn = window.kefeEffects && window.kefeEffects[style.effect];
            if (typeof fn === "function") fn(ctx, w, h, style, lines, time);
            else drawAppleEffect(ctx, w, h, style, lines, time);
            break;
        }'''
            new='''        case "pulse": drawPulseEffect(ctx, w, h, style, lines, time); break;
        case "rise":
        case "slide":
        case "drop":
        case "drift":
        case "typewriter":
        case "instagram":
        case "fadeup": {
            const fn = window.kefeEffects && window.kefeEffects[style.effect];
            if (typeof fn === "function") fn(ctx, w, h, style, lines, time);
            break;
        }'''
            if old not in s: raise SystemExit('app renderer anchor missing')
            s=s.replace(old,new,1)
            s=s.replace('const EFFECT_LABELS = {\n','''const EFFECT_LABELS = {
    rise: "Rise — a clean upward entrance that settles into place",
    slide: "Slide — a crisp horizontal sweep into focus",
    drop: "Drop — a weighted downward entrance with a soft settle",
    drift: "Drift — a subtle diagonal float with restrained rotation",
''',1)
            s=s.replace('const TITLECARD_DESIGN_FOR_EFFECT = { apple:',"const TITLECARD_DESIGN_FOR_EFFECT = { rise: 'minimal', slide: 'minimal', drop: 'minimal', drift: 'minimal', apple:",1)
            app.write_text(s)

          index=root/'index.html'; h=index.read_text()
          if 'data-effect="rise"' not in h:
            a='<div class="effect-buttons"><button type="button" class="segmented-btn" data-effect="apple">Apple</button>'
            b='<div class="effect-buttons">'+''.join(f'<button type="button" class="segmented-btn" data-effect="{n}">{n.title()}</button>' for n in ['rise','slide','drop','drift'])+'<button type="button" class="segmented-btn" data-effect="apple">Apple</button>'
            h=h.replace(a,b,1)
          if './app/effects/motion.js' not in h:
            a='<script src="./app/effects/core.js"></script><script src="./app/effects/typewriter.js"></script>'
            b='<script src="./app/effects/core.js"></script><script src="./app/effects/motion.js"></script><script src="./app/effects/rise.js"></script><script src="./app/effects/slide.js"></script><script src="./app/effects/drop.js"></script><script src="./app/effects/drift.js"></script><script src="./app/effects/typewriter.js"></script>'
            h=h.replace(a,b,1)
          index.write_text(h)

          wizard=root/'app/ui/wizard/wizard-all-effects.js'; w=wizard.read_text().replace('    promoteFreeMotionEffects();\n','')
          old='''    const line = document.createElement('span');
    line.className = 'wizard-effect-demo-line';
    line.textContent = 'LYRICS';
    demo.appendChild(line);'''
          new='''    if (motion.has(name)) {
      const image = document.createElement('img');
      image.className = 'wizard-effect-thumbnail';
      image.src = `./assets/effects/${name}.svg`;
      image.alt = '';
      image.setAttribute('aria-hidden', 'true');
      demo.appendChild(image);
    } else {
      const line = document.createElement('span');
      line.className = 'wizard-effect-demo-line';
      line.textContent = 'LYRICS';
      demo.appendChild(line);
    }'''
          if old in w: w=w.replace(old,new,1)
          if '.wizard-effect-thumbnail {' not in w:
            marker='    .wizard-all-effect-grid .wizard-effect-choice[data-wizard-effect="rise"] .wizard-effect-demo {'
            w=w.replace(marker,'    .wizard-all-effect-grid .wizard-effect-thumbnail { width:100%; height:100%; display:block; object-fit:cover; position:relative; z-index:1; }\n'+marker,1)
          wizard.write_text(w)

          auto=root/'app/core/auto-create.js'; a=auto.read_text().replace("const EFFECTS = new Set(['apple','brat','eternal','aurora','pulse','typewriter','instagram','fadeup']);","const EFFECTS = new Set(['rise','slide','drop','drift','apple','brat','eternal','aurora','pulse','typewriter','instagram','fadeup']);"); auto.write_text(a)

          typo=root/'app/ui/typography.js'; t=typo.read_text()
          if 'rise: { family:' not in t:
            t=t.replace("  const families = { ui: 'Open Sans',","  const families = { ui: 'Open Sans', rise: 'Open Sans', slide: 'Open Sans', drop: 'Open Sans', drift: 'Open Sans',",1)
            t=t.replace("  const effects = {\n","  const effects = {\n    rise: { family: families.rise, weight: 800, min: 42, max: 150, lineHeight: 1.05, tracking: -.018, align: 'center', case: 'none', opticalScale: 1.00 },\n    slide: { family: families.slide, weight: 800, min: 42, max: 150, lineHeight: 1.05, tracking: -.018, align: 'center', case: 'none', opticalScale: 1.00 },\n    drop: { family: families.drop, weight: 800, min: 42, max: 150, lineHeight: 1.05, tracking: -.018, align: 'center', case: 'none', opticalScale: 1.00 },\n    drift: { family: families.drift, weight: 800, min: 42, max: 150, lineHeight: 1.05, tracking: -.018, align: 'center', case: 'none', opticalScale: 1.00 },\n",1)
          typo.write_text(t)

          smoke=root/'scripts/smoke-effects.js'; q=smoke.read_text()
          if "'app/effects/motion.js'" not in q:
            q=q.replace("  'app/effects/core.js',\n","  'app/effects/core.js',\n  'app/effects/motion.js',\n  'app/effects/rise.js',\n  'app/effects/slide.js',\n  'app/effects/drop.js',\n  'app/effects/drift.js',\n",1)
            q=q.replace("const expectKeys = ['brat', 'aurora', 'eternal', 'typewriter', 'instagram', 'fadeup'];","const expectKeys = ['rise', 'slide', 'drop', 'drift', 'brat', 'aurora', 'eternal', 'typewriter', 'instagram', 'fadeup'];",1)
            q=q.replace("for (const key of ['brat', 'aurora', 'eternal', 'typewriter', 'instagram', 'fadeup', 'apple'])","for (const key of ['rise', 'slide', 'drop', 'drift', 'brat', 'aurora', 'eternal', 'typewriter', 'instagram', 'fadeup', 'apple'])",1)
          smoke.write_text(q)

          d=root/'assets/effects'; d.mkdir(parents=True,exist_ok=True)
          thumbs={'rise':('#13243A','#8FD8FF','M50 78 C50 61 50 43 50 22'),'slide':('#171717','#DDE8F2','M18 50 C38 50 62 50 82 50'),'drop':('#2C1B10','#F1C17A','M50 22 C50 41 50 60 50 78'),'drift':('#1C1830','#C8B8FF','M20 77 C39 64 61 40 81 23')}
          for n,(a,b,p) in thumbs.items():
            (d/f'{n}.svg').write_text(f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="{a}"/><stop offset="1" stop-color="{b}"/></linearGradient><filter id="b"><feGaussianBlur stdDeviation="7"/></filter></defs><rect width="320" height="180" rx="18" fill="url(#g)"/><path d="{p}" stroke="#fff" stroke-width="14" opacity=".18" fill="none" filter="url(#b)"/><path d="{p}" stroke="#fff" stroke-width="5" fill="none"/><text x="160" y="150" text-anchor="middle" fill="#fff" font-family="Open Sans,Arial" font-size="20" font-weight="800">{n.upper()}</text></svg>')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/app.js app/effects app/core/auto-create.js app/ui/typography.js app/ui/wizard/wizard-all-effects.js scripts/smoke-effects.js index.html assets/effects
          git commit -m "Integrate polished standalone motion effects [native-motion-applied]"
          git push
