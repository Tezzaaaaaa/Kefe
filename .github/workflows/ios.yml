name: Static site smoke test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static app files exist
        run: |
          set -e
          test -f index.html
          test -d app
          test -d fonts
          echo "Repository structure looks valid for a static HTML app."

      - name: Serve app and verify index loads
        run: |
          set -e
          python3 -m http.server 8000 --directory . >/tmp/kefe-http.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/index.html >/tmp/kefe-index.html; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/index.html > /tmp/kefe-index.html
          grep -qi "KEFE\|<html\|<body" /tmp/kefe-index.html
          echo "Static site served successfully."
