name: KEFE formatting check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kefe-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check formatting of changed files
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only HEAD^ HEAD -- \
            '*.js' '*.mjs' '*.cjs' '*.json' '*.css' '*.html' '*.yml' '*.yaml' '*.md')
          if [ -z "$files" ]; then
            echo "No supported text files changed; formatting check passes."
            exit 0
          fi
          printf '%s\n' "$files"
          printf '%s\n' "$files" | xargs npx prettier --check
