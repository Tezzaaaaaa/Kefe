name: OpenCodeReview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ocr-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review-pull-request:
    name: Review pull request
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@main
        with:
          ocr_version: '1.11.3'
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          language: 'English'
          effort: 'medium'
          review_task_timeout: '30'
          llm_timeout: '900'
          sticky_summary: 'true'
          incremental: 'true'
          checkpoint_range: 'true'

  review-on-command:
    name: Review from iPhone command
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && github.event.comment.user.type != 'Bot'
      && (
        github.event.comment.author_association == 'OWNER'
        || github.event.comment.author_association == 'MEMBER'
        || github.event.comment.author_association == 'COLLABORATOR'
      )
      && (
        startsWith(github.event.comment.body, '/open-code-review')
        || startsWith(github.event.comment.body, '@open-code-review')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@main
        with:
          ocr_version: '1.11.3'
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
          language: 'English'
          effort: 'medium'
          review_task_timeout: '30'
          llm_timeout: '900'
          sticky_summary: 'true'
          incremental: 'true'
          checkpoint_range: 'true'
