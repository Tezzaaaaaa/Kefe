name: Apply KEFE startup menu animation
on:
  push:
    branches: [main]
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add startup animation styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ui/wizard.css')
          s = p.read_text()
          marker = '/* Startup menu: restrained mid-century/Nordic geometry */'
          if marker not in s:
              block = r'''
/* Startup menu: restrained mid-century/Nordic geometry */
.wizard-choices:not(.wizard-source-choices) .wizard-choice{
  border-radius:12px;
  transition:transform .42s cubic-bezier(.2,.8,.2,1),border-color .22s ease,background .22s ease,box-shadow .42s ease;
  animation:wizardCardRise .56s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:calc(var(--wizard-card-index,0) * 70ms);
}
.wizard-choices:not(.wizard-source-choices) .wizard-choice:nth-child(1){--wizard-card-index:0}
.wizard-choices:not(.wizard-source-choices) .wizard-choice:nth-child(2){--wizard-card-index:1}
.wizard-choices:not(.wizard-source-choices) .wizard-choice:nth-child(3){--wizard-card-index:2}
.wizard-choices:not(.wizard-source-choices) .wizard-choice:nth-child(4){--wizard-card-index:3}
@keyframes wizardCardRise{
  from{opacity:0;transform:translate3d(0,18px,0) scale(.985)}
  to{opacity:1;transform:translate3d(0,0,0) scale(1)}
}
.wizard-choices:not(.wizard-source-choices) .wizard-choice:before{
  content:"";position:absolute;left:0;top:18px;bottom:18px;width:2px;background:var(--red);
  transform:scaleY(0);transform-origin:center;transition:transform .35s cubic-bezier(.2,.8,.2,1);opacity:.9;pointer-events:none;
}
.wizard-choices:not(.wizard-source-choices) .wizard-choice:hover{
  transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.10);
}
.wizard-choices:not(.wizard-source-choices) .wizard-choice:hover:before{transform:scaleY(.65)}
.wizard-choices:not(.wizard-source-choices) .wizard-choice-icon{
  border:1px solid var(--line);
  transition:transform .42s cubic-bezier(.2,.8,.2,1),background .3s ease,color .3s ease,border-color .3s ease;
}
.wizard-choices:not(.wizard-source-choices) .wizard-choice:hover .wizard-choice-icon{transform:translateY(-1px) scale(1.035)}
.wizard-choices:not(.wizard-source-choices) .wizard-choice.selected:before{transform:scaleY(1)}
.wizard-choices:not(.wizard-source-choices) .wizard-choice.selected .wizard-choice-icon{transform:scale(1.04)}
@media(prefers-reduced-motion:reduce){
  .wizard-choices:not(.wizard-source-choices) .wizard-choice,.wizard-choices:not(.wizard-source-choices) .wizard-choice-icon{animation:none!important;transition:none!important}
}
'''
              s = s.replace('/* KEFE guided workflow — 2-up choices, premium compact layout. */', '/* KEFE guided workflow — 2-up choices, premium compact layout. */\n' + block, 1)
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui/wizard.css
          git diff --cached --quiet || git commit -m "Refine KEFE startup menu animation"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/kefe-startup-animation.yml
          git commit -m "Remove temporary startup animation workflow"
          git push
