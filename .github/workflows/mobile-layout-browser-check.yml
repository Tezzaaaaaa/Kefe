name: Mobile layout browser verification

concurrency:
  group: kefe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/mobile-layout-browser-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify mobile controls in Chromium
        run: |
          cat > /tmp/kefe-mobile-layout-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          function makeTestWav() {
            const sampleRate = 8000, samples = sampleRate;
            const buffer = Buffer.alloc(44 + samples * 2);
            buffer.write('RIFF', 0); buffer.writeUInt32LE(36 + samples * 2, 4); buffer.write('WAVE', 8);
            buffer.write('fmt ', 12); buffer.writeUInt32LE(16, 16); buffer.writeUInt16LE(1, 20);
            buffer.writeUInt16LE(1, 22); buffer.writeUInt32LE(sampleRate, 24);
            buffer.writeUInt32LE(sampleRate * 2, 28); buffer.writeUInt16LE(2, 32);
            buffer.writeUInt16LE(16, 34); buffer.write('data', 36); buffer.writeUInt32LE(samples * 2, 40);
            return buffer;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const reports = [];
            const baseUrl = process.env.KEFE_BASE_URL || 'http://127.0.0.1:4173';
            const screenshotPrefix = process.env.KEFE_BASE_URL ? 'live' : 'local';
            try {
              for (const width of [390, 320]) {
                const page = await browser.newPage({
                  viewport: { width, height: 844 },
                  deviceScaleFactor: 1,
                  isMobile: true,
                  hasTouch: true
                });
                page.setDefaultTimeout(15000);
                page.setDefaultNavigationTimeout(20000);
                console.log(`[mobile-check] viewport ${width}px started`);
                const pageErrors = [];
                const pageConsoleErrors = [];
                page.on('pageerror', error => pageErrors.push(error.message));
                page.on('console', message => { if (message.type() === 'error') pageConsoleErrors.push(message.text()); });
                await page.goto(`${baseUrl}/index.html`, { waitUntil: 'domcontentloaded' });
                await page.locator('.kefe-section[data-panel="effects"]').waitFor();
                await page.locator('.kefe-section[data-panel="effects"]').click();
                await page.locator('.kefe-panel[data-panel-view="effects"].active').waitFor();
                await page.waitForTimeout(500);

                async function assertTwoColumns(formSelector, panelName) {
                  const result = await page.locator(formSelector).evaluate(form => {
                    const style = getComputedStyle(form);
                    const columns = style.gridTemplateColumns.trim().split(/\s+/).filter(Boolean);
                    return { columns: columns.length, template: style.gridTemplateColumns, width: form.getBoundingClientRect().width };
                  });
                  assert.equal(result.columns, 2, `${panelName} at ${width}px must render exactly two form columns; got ${result.template}`);
                  return result;
                }

                async function assertSelectsStayInOneColumn(panelSelector, panelName, requireDropdowns = true) {
                  const details = page.locator(panelSelector + ' details.kefe-style-disclosure');
                  for (let n = 0; n < await details.count(); n++) {
                    const item = details.nth(n);
                    if (!(await item.evaluate(el => el.open))) {
                      await item.locator('summary').click();
                    }
                  }
                  const result = await page.locator(panelSelector).evaluate(panel => {
                    const form = panel.querySelector('.kefe-form');
                    const formWidth = form.getBoundingClientRect().width;
                    return [...panel.querySelectorAll('select')]
                      .filter(el => el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden')
                      .map(el => ({
                        id: el.id || el.getAttribute('aria-label') || el.className,
                        width: el.getBoundingClientRect().width,
                        formWidth,
                        parent: el.parentElement?.className || el.parentElement?.tagName
                      }));
                  });
                  if (requireDropdowns) assert.ok(result.length > 0, `${panelName} at ${width}px should expose dropdown controls`);
                  for (const item of result) {
                    assert.ok(item.width <= item.formWidth * 0.62,
                      `${panelName} dropdown ${item.id} spans too much of the form at ${width}px: ${item.width}px of ${item.formWidth}px (parent ${item.parent})`);
                  }
                  return result;
                }

                async function assertOnlyVisualiserViewVisible(activeId, label) {
                  const views = await page.locator('.kefe-panel[data-panel-view="visualiser"] .kefe-vis-view').evaluateAll(nodes => nodes.map(node => ({ id: node.id, hidden: node.hidden })));
                  const visible = views.filter(view => !view.hidden).map(view => view.id);
                  assert.deepEqual(visible, [activeId], `${label} must show only its own settings; visible views: ${JSON.stringify(visible)}`);
                }

                await page.locator('.kefe-section[data-panel="media"]').click();
                await page.locator('.kefe-panel[data-panel-view="media"].active').waitFor();
                const mediaGrid = await assertTwoColumns('.kefe-panel[data-panel-view="media"] .kefe-form', 'Media');
                const mediaSelects = await assertSelectsStayInOneColumn('.kefe-panel[data-panel-view="media"]', 'Media', false);
                const songDetailFields = await page.locator('#songTitle, #songArtist, #songAlbum, #songYear').evaluateAll(nodes => {
                  const formWidth = document.querySelector('.kefe-panel[data-panel-view="media"] .kefe-form').getBoundingClientRect().width;
                  return nodes.map(el => ({ id: el.id, width: el.parentElement.getBoundingClientRect().width, formWidth }));
                });
                assert.equal(songDetailFields.length, 4, 'Media should expose all four editable song detail fields');
                for (const field of songDetailFields) {
                  assert.ok(field.width <= field.formWidth * 0.62,
                    `Media song detail ${field.id} spans too much width at ${width}px: ${field.width}px of ${field.formWidth}px`);
                }
                if (width === 390) await page.screenshot({ path: `${screenshotPrefix}-mobile-layout-${width}-media.png`, fullPage: false, timeout: 15000 });

                await page.locator('.kefe-section[data-panel="lyrics"]').click();
                await page.locator('.kefe-panel[data-panel-view="lyrics"].active').waitFor();
                const lyricsGrid = await assertTwoColumns('.kefe-panel[data-panel-view="lyrics"] .kefe-form', 'Lyrics');
                const lyricsSelects = await assertSelectsStayInOneColumn('.kefe-panel[data-panel-view="lyrics"]', 'Lyrics', false);
                const lyricsComponentWidths = await page.locator('#lyricsInput').evaluate(el => {
                  const formWidth = el.closest('.kefe-form').getBoundingClientRect().width;
                  return {
                    textWidth: el.parentElement.getBoundingClientRect().width,
                    timingWidth: document.querySelector('.kefe-panel[data-panel-view="lyrics"] .kefe-lyrics-timing').getBoundingClientRect().width,
                    formWidth
                  };
                });
                assert.ok(lyricsComponentWidths.textWidth >= lyricsComponentWidths.formWidth * 0.9, 'Lyrics textarea should remain full width');
                assert.ok(lyricsComponentWidths.timingWidth >= lyricsComponentWidths.formWidth * 0.9, 'Lyrics timing control should remain full width');
                if (width === 390) await page.screenshot({ path: `${screenshotPrefix}-mobile-layout-${width}-lyrics.png`, fullPage: false, timeout: 15000 });

                await page.locator('.kefe-section[data-panel="export"]').click();
                await page.locator('.kefe-panel[data-panel-view="export"].active').waitFor();
                const exportGrid = await assertTwoColumns('.kefe-panel[data-panel-view="export"] .kefe-form', 'Export');
                const exportSelects = await assertSelectsStayInOneColumn('.kefe-panel[data-panel-view="export"]', 'Export');
                if (width === 390) await page.screenshot({ path: `${screenshotPrefix}-mobile-layout-${width}-export.png`, fullPage: false, timeout: 15000 });

                await page.locator('.kefe-section[data-panel="effects"]').click();
                await page.locator('.kefe-panel[data-panel-view="effects"].active').waitFor();
                await page.waitForTimeout(300);

                const effectsGrid = await assertTwoColumns('.kefe-panel[data-panel-view="effects"] .kefe-form', 'Effects');
                const effectsSelects = await assertSelectsStayInOneColumn('.kefe-panel[data-panel-view="effects"]', 'Effects');

                // Run the expensive per-effect audit once against the published editor at 390px.
                // The local and 320px runs still cover the responsive layout at both widths.
                if (width === 390 && process.env.KEFE_BASE_URL) {
                  const effectAudit = await page.evaluate(async () => {
                  const canvas = document.getElementById('kefeCanvas');
                  const ctx = canvas.getContext('2d', { willReadFrequently: true });
                  const effects = window.KEFE_EFFECTS || [];
                  const renderers = window.kefeEffects || {};
                  const original = {};
                  const calls = {};
                  for (const [key, renderer] of Object.entries(renderers)) {
                    if (typeof renderer !== 'function') continue;
                    original[key] = renderer;
                    renderers[key] = function (...args) {
                      calls[key] = (calls[key] || 0) + 1;
                      return renderer.apply(this, args);
                    };
                  }
                  const failures = [];
                  const consoleErrors = [];
                  const originalConsoleError = console.error;
                  console.error = (...args) => {
                    consoleErrors.push(args.map(value => value instanceof Error ? value.message : String(value)).join(' '));
                    originalConsoleError.apply(console, args);
                  };
                  try {
                    if (!window.kefeLyrics || !ctx || !document.querySelector('.kefe-lyric-effect-option[data-effect="apple"]')) throw new Error('Lyric renderer test prerequisites are missing');
                    window.kefeLyrics.set([
                      { text: 'KEFE VERIFICATION', time: 0, endTime: 2.5 },
                      { text: 'SECOND TEST LINE', time: 2.5, endTime: 5 }
                    ], 'browser-verification');
                    window.kefeLyrics.seek(1);
                    for (const effect of effects) {
                      const key = effect.key;
                      if (typeof original[key] !== 'function') {
                        failures.push({ effect: key, issue: 'No renderer registered' });
                        continue;
                      }
                      for (const key of Object.keys(calls)) calls[key] = 0;
                      const option = document.querySelector('.kefe-lyric-effect-option[data-effect="' + key + '"]');
                      if (!option) {
                        failures.push({ effect: key, issue: 'No selectable lyric effect option registered' });
                        continue;
                      }
                      option.click();
                      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                      const called = Object.entries(calls).filter(([, count]) => count > 0).map(([name]) => name);
                      if (!called.includes(key)) failures.push({ effect: key, issue: 'Selected renderer was not called', called });
                      const otherCalls = called.filter(name => name !== key);
                      if (otherCalls.length) failures.push({ effect: key, issue: 'Other lyric renderers also ran', otherCalls });
                      if (option.getAttribute('aria-pressed') !== 'true') failures.push({ effect: key, issue: 'Selection did not persist' });
                      const fontMeta = document.getElementById('fontMeta')?.textContent || '';
                      if (!fontMeta.startsWith('Locked effect font')) failures.push({ effect: key, issue: 'Effect font metadata did not update' });
                      const visiblePanels = [...document.querySelectorAll('.kefe-inspiration-panel')]
                        .filter(panel => !panel.hidden && getComputedStyle(panel).display !== 'none')
                        .map(panel => panel.dataset.effect).sort();
                      const expectedPanels = document.querySelector(`.kefe-inspiration-panel[data-effect="${key}"]`) ? [key] : [];
                      if (JSON.stringify(visiblePanels) !== JSON.stringify(expectedPanels)) {
                        failures.push({ effect: key, issue: 'Effect-specific settings are not isolated', visiblePanels, expectedPanels });
                      }
                      const randomizeControls = document.getElementById('kefeRandomizeControls');
                      const randomizeVisible = !!randomizeControls && !randomizeControls.hidden && getComputedStyle(randomizeControls).display !== 'none';
                      if (randomizeVisible !== (key === 'randomize')) failures.push({ effect: key, issue: 'Randomize settings visibility is incorrect', randomizeVisible });
                      // Downsample the full canvas before checking alpha. This catches edge-positioned
                      // effects while avoiding repeated full-resolution pixel reads during the audit.
                      const sample = document.createElement('canvas');
                      sample.width = 120; sample.height = 68;
                      const sampleContext = sample.getContext('2d', { willReadFrequently: true });
                      sampleContext.drawImage(canvas, 0, 0, sample.width, sample.height);
                      const pixels = sampleContext.getImageData(0, 0, sample.width, sample.height).data;
                      let visiblePixels = 0;
                      for (let i = 3; i < pixels.length; i += 4) if (pixels[i] > 0) visiblePixels++;
                      if (!visiblePixels) failures.push({ effect: key, issue: 'Renderer produced no visible lyric pixels anywhere on the canvas' });
                    }
                  } finally {
                    console.error = originalConsoleError;
                    for (const [key, renderer] of Object.entries(original)) renderers[key] = renderer;
                    document.querySelector('.kefe-lyric-effect-option[data-effect="apple"]')?.click();
                  }
                  return { tested: effects.length, effectKeys: effects.map(effect => effect.key), failures, consoleErrors };
                });
                assert.ok(effectAudit.tested > 0, 'Effect registry should not be empty');
                assert.deepEqual(effectAudit.failures, [], `Lyric effect isolation/render audit failed at ${width}px: ${JSON.stringify(effectAudit.consoleErrors)}`);
                console.log(`[effect-audit] ${width}px verified ${effectAudit.tested} lyric effects`);
                }
                await page.screenshot({ path: `${screenshotPrefix}-mobile-layout-${width}-effects.png`, fullPage: false, timeout: 15000 });

                await page.locator('.kefe-section[data-panel="visualiser"]').click();
                await page.locator('.kefe-panel[data-panel-view="visualiser"].active').waitFor();
                await page.waitForTimeout(500);
                const visualiserGrid = await assertTwoColumns('.kefe-panel[data-panel-view="visualiser"] .kefe-form', 'Visualiser');
                const visualiserSelects = await assertSelectsStayInOneColumn('.kefe-panel[data-panel-view="visualiser"]', 'Visualiser', false);
                const tabsElement = page.locator('.kefe-editing > .kefe-vis-tabs');
                await tabsElement.waitFor({ state: 'attached', timeout: 5000 }).catch(() => {
                  throw new Error(`Visualiser engine tabs were not created at ${width}px. Browser errors: ${JSON.stringify(pageErrors)}; console errors: ${JSON.stringify(pageConsoleErrors)}`);
                });
                const tabsLayout = await tabsElement.evaluate(el => ({
                  tabCount: el.querySelectorAll('[role="tab"]').length,
                  direction: getComputedStyle(el).flexDirection,
                  position: getComputedStyle(el).position,
                  width: el.getBoundingClientRect().width,
                  containerWidth: el.closest('.kefe-editing').getBoundingClientRect().width
                }));
                assert.equal(tabsLayout.tabCount, 4, `Visualiser engine tabs must expose all four choices at ${width}px; got ${tabsLayout.tabCount}`);
                assert.equal(tabsLayout.direction, 'row', `Visualiser engine tabs must stay horizontal at ${width}px`);
                const iconTabs = await tabsElement.locator('[role="tab"]').evaluateAll(nodes => nodes.map(node => ({
                  visualiser: node.dataset.visualiser,
                  icon: node.dataset.icon,
                  label: node.getAttribute('aria-label'),
                  text: node.textContent.trim()
                })));
                for (const tab of iconTabs) {
                  assert.ok(tab.icon, `Visualiser ${tab.visualiser} must have an icon`);
                  assert.ok(tab.label, `Visualiser ${tab.visualiser} must retain an accessible label`);
                  assert.equal(tab.text, '', `Visualiser ${tab.visualiser} must not show its name as visible text`);
                }
                assert.notEqual(tabsLayout.position, 'static', `Visualiser tabs must retain an explicit layout position at ${width}px`);
                assert.ok(tabsLayout.width >= tabsLayout.containerWidth * 0.9, `Visualiser engine tabs must span the editing container at ${width}px`);
                const gradientTab = page.locator('.kefe-vis-tabs button[data-visualiser="gradient"]').first();
                await gradientTab.waitFor({ state: 'visible' });
                await gradientTab.click();
                await assertOnlyVisualiserViewVisible('kefeVisGradientView', 'Liquid Flow selection');
                assert.equal(await page.locator('.kefe-vis-tabs [aria-selected="true"]').getAttribute('data-visualiser'), 'gradient',
                  'Selecting Liquid Flow must activate its tab at ' + width + 'px');

                const documentScroll = await page.evaluate(() => ({
                  clientHeight: document.documentElement.clientHeight,
                  scrollHeight: document.documentElement.scrollHeight,
                  bodyOverflowY: getComputedStyle(document.body).overflowY,
                  editorHeight: document.querySelector('.kefe-editor').getBoundingClientRect().height,
                  panelsOverflowY: getComputedStyle(document.querySelector('.kefe-panels')).overflowY
                }));
                assert.ok(documentScroll.scrollHeight > documentScroll.clientHeight,
                  `The whole editor page must extend beyond the viewport and scroll at ${width}px: ${JSON.stringify(documentScroll)}`);
                assert.equal(documentScroll.bodyOverflowY, 'auto',
                  `Document scrolling must be enabled at ${width}px`);
                assert.notEqual(documentScroll.panelsOverflowY, 'auto',
                  `Editor settings must expand with the page instead of using a nested scroll container at ${width}px`);
                await page.evaluate(() => window.scrollTo(0, document.documentElement.scrollHeight));
                await page.waitForTimeout(80);
                const pageScroll = await page.evaluate(() => ({
                  scrollY: window.scrollY,
                  maxScroll: document.documentElement.scrollHeight - document.documentElement.clientHeight
                }));
                assert.ok(pageScroll.scrollY > 0 && pageScroll.maxScroll > 0,
                  `The document must actually scroll to the bottom of the editor at ${width}px: ${JSON.stringify(pageScroll)}`);

                await page.locator('.kefe-vis-tabs button[data-visualiser="particles"]').click();
                await page.locator('#kefeVisParticlesView:not([hidden])').waitFor();
                const particlesDisplay = await page.locator('#kefeVisParticlesView').evaluate(el => getComputedStyle(el).display);
                assert.equal(particlesDisplay, 'contents', `Particles view must flatten into the two-column form at ${width}px; got ${particlesDisplay}`);
                await assertOnlyVisualiserViewVisible('kefeVisParticlesView', 'Particles');
                const presetLayout = await page.locator('#visualiserPresetGrid').evaluate(el => ({
                  direction: getComputedStyle(el).flexDirection,
                  wrap: getComputedStyle(el).flexWrap,
                  overflowX: getComputedStyle(el).overflowX,
                  visible: !!el.getClientRects().length && getComputedStyle(el).display !== 'none'
                }));
                assert.equal(presetLayout.direction, 'row', 'Preset options must be arranged horizontally');
                assert.equal(presetLayout.wrap, 'nowrap', 'Preset options must remain on one horizontal row');
                assert.equal(presetLayout.overflowX, 'auto', 'Preset row must scroll horizontally when needed');
                const particleToggleDisplay = await page.locator('#kefeVisParticlesView .kefe-visualiser-spin-row').first().evaluate(el => getComputedStyle(el).display);
                assert.equal(particleToggleDisplay, 'contents', `Particles toggle labels and switches must flatten into the two-column form at ${width}px`);

                if (await gradientTab.count()) {
                  await gradientTab.click();
                  await page.locator('#kefeVisGradientView:not([hidden])').waitFor();
                  const liquidFlowDisplay = await page.locator('#kefeVisGradientView').evaluate(el => getComputedStyle(el).display);
                  assert.equal(liquidFlowDisplay, 'contents', `Liquid Flow view must flatten into the two-column form at ${width}px; got ${liquidFlowDisplay}`);
                  await assertOnlyVisualiserViewVisible('kefeVisGradientView', 'Liquid Flow');
                  await assertTwoColumns('.kefe-panel[data-panel-view="visualiser"] .kefe-form', 'Liquid Flow');
                  const liquidFlowLayout = await page.locator('#kefeVisGradientView .kefe-liquid-flow-controls').evaluate(el => {
                    const columns = node => new Set([...node.children].filter(child => getComputedStyle(child).display !== 'none').map(child => Math.round(child.getBoundingClientRect().left))).size;
                    return {
                      presetColumns: columns(el.querySelector('.kefe-liquid-presets')),
                      mainColumns: columns(el.querySelector('.kefe-liquid-main-controls')),
                      presetCount: el.querySelectorAll('[data-liquid-preset]').length,
                      sliderCount: el.querySelectorAll('input[type="range"]').length
                    };
                  });
                  assert.equal(liquidFlowLayout.presetColumns, 2, `Liquid Flow presets must occupy two columns: ${JSON.stringify(liquidFlowLayout)}`);
                  assert.equal(liquidFlowLayout.mainColumns, 2, `Liquid Flow settings must occupy two columns: ${JSON.stringify(liquidFlowLayout)}`);
                  assert.equal(liquidFlowLayout.presetCount, 4, 'Liquid Flow must retain all four presets');
                  assert.ok(liquidFlowLayout.sliderCount > 0, 'Liquid Flow must retain its settings sliders');
                  await page.screenshot({ path: `${screenshotPrefix}-mobile-layout-${width}-liquid-flow.png`, fullPage: false, timeout: 15000 });
                }

                const glitchTab = page.locator('.kefe-vis-tabs button[data-visualiser="glitch"]').first();
                if (await glitchTab.count()) {
                  // Switching to the Glitch preset rebuilds the renderer; allow this one
                  // expensive transition more time than ordinary control clicks.
                  await glitchTab.click({ timeout: 30000 });
                  await page.locator('#kefeVisGlitchView:not([hidden])').waitFor();
                  const glitchDisplay = await page.locator('#kefeVisGlitchView').evaluate(el => getComputedStyle(el).display);
                  assert.equal(glitchDisplay, 'contents', `Glitch view must flatten into the two-column form at ${width}px; got ${glitchDisplay}`);
                  await assertOnlyVisualiserViewVisible('kefeVisGlitchView', 'Glitch');
                  await assertTwoColumns('.kefe-panel[data-panel-view="visualiser"] .kefe-form', 'Glitch');
                  await assertSelectsStayInOneColumn('.kefe-panel[data-panel-view="visualiser"]', 'Glitch', false);
                  await page.screenshot({ path: `${screenshotPrefix}-mobile-layout-${width}-glitch.png`, fullPage: false, timeout: 15000 });
                }

                const flutedTab = page.locator('.kefe-vis-tabs button[data-visualiser="fluted"]').first();
                if (await flutedTab.count()) {
                  await flutedTab.click();
                  await page.locator('#kefeVisFlutedView:not([hidden])').waitFor();
                  const flutedDisplay = await page.locator('#kefeVisFlutedView').evaluate(el => getComputedStyle(el).display);
                  assert.equal(flutedDisplay, 'contents', `Fluted Glass wrapper must flatten into the same two-column form at ${width}px; got ${flutedDisplay}`);
                  await assertOnlyVisualiserViewVisible('kefeVisFlutedView', 'Fluted Glass');
                  const flutedToggle = page.locator('.kefe-panel[data-panel-view="visualiser"] .kefe-visualiser-panel-head #flutedPower');
                  await flutedToggle.waitFor({ state: 'visible' });
                  assert.equal(await flutedToggle.getAttribute('role'), 'switch', 'Fluted Glass power control must remain an accessible switch');
                  assert.equal(await flutedToggle.getAttribute('aria-label'), 'Fluted Glass effect', 'Fluted Glass power control must retain its accessible label');
                  const flutedGrid = await assertTwoColumns('.kefe-panel[data-panel-view="visualiser"] .kefe-form', 'Fluted Glass');
                  const sliderWidths = await page.locator('#flutedSliders > *').evaluateAll(nodes => nodes.filter(el => el.getClientRects().length).map(el => ({label: el.querySelector('b')?.textContent || el.textContent.trim().slice(0, 30), width: el.getBoundingClientRect().width})));
                  for (const item of sliderWidths) {
                    assert.ok(item.width <= flutedGrid.width * 0.62,
                      `Fluted Glass slider ${item.label} spans too much width at ${width}px: ${item.width}px of ${flutedGrid.width}px`);
                  }
                  await page.screenshot({ path: `${screenshotPrefix}-mobile-layout-${width}-fluted.png`, fullPage: false, timeout: 15000 });
                }

                if (width === 390) {
                  const githubLink = page.locator('a.kefe-github-link[href="https://github.com/Tezzaaaaaa/Kefe"]');
                  assert.equal(await githubLink.count(), 1, 'Header should contain one GitHub repository icon link');
                  assert.ok(await githubLink.isVisible(), 'Header GitHub icon link should be visible');

                  await page.locator('.kefe-section[data-panel="media"]').click();
                  await page.locator('.kefe-panel[data-panel-view="media"].active').waitFor();
                  await page.evaluate(() => { window.KEFE_AUDIO_RECOGNITION_TOKEN = 'test-token'; });
                  await page.route('https://api.audd.io/**', route => route.fulfill({
                    status: 200, contentType: 'application/json',
                    headers: { 'access-control-allow-origin': '*' },
                    body: JSON.stringify({ status: 'success', result: {
                      title: 'KEFE Recognition Verification', artist: 'KEFE Test Artist',
                      album: 'KEFE Test Album', release_date: '2026-01-01',
                      apple_music: { trackId: 928431, trackTimeMillis: 120000 }
                    } })
                  }));
                  await page.route('https://itunes.apple.com/**', route => route.fulfill({
                    status: 200, contentType: 'application/json',
                    headers: { 'access-control-allow-origin': '*' },
                    body: JSON.stringify({ resultCount: 0, results: [] })
                  }));
                  await page.locator('#mediaInput').setInputFiles({
                    name: 'KEFE Local Upload Verification.wav', mimeType: 'audio/wav', buffer: makeTestWav()
                  });
                  await page.waitForFunction(() =>
                    document.getElementById('songTitle')?.value === 'KEFE Recognition Verification' &&
                    document.getElementById('songArtist')?.value === 'KEFE Test Artist',
                    { timeout: 15000 }
                  );
                  const localResult = page.locator('#kefeCarStack .kefe-car-card').filter({ hasText: 'KEFE Recognition Verification' }).first();
                  await localResult.waitFor({ state: 'visible', timeout: 15000 });
                  console.log('[audio-recognition-audit] recognized title and artist populated from fingerprint provider response');
                  await page.locator('#kefeFindInput').fill('KEFE query with no catalogue matches 928431');
                  await page.getByText('No catalogue matches. Your uploaded file is available below.', { exact: true }).waitFor({ timeout: 15000 });
                  await localResult.waitFor({ state: 'visible', timeout: 5000 });
                  await localResult.click();
                  await page.locator('#kefeCarUse').filter({ hasText: 'Use uploaded file' }).waitFor({ state: 'visible' });
                  await page.locator('#kefeCarUse').click();
                  await page.waitForFunction(() => document.getElementById('kefeFindStatus')?.textContent === 'Using the uploaded file. Catalogue matches remain available.', { timeout: 5000 });
                  console.log('[audio-recognition-audit] recognized upload remains visible, selectable, and preserved with zero catalogue matches');
                }

                reports.push({
                  viewport: width,
                  mediaColumns: mediaGrid.template,
                  mediaDropdownCount: mediaSelects.length,
                  songDetailFieldCount: songDetailFields.length,
                  lyricsColumns: lyricsGrid.template,
                  lyricsDropdownCount: lyricsSelects.length,
                  lyricsTextAndTimingFullWidth: true,
                  exportColumns: exportGrid.template,
                  exportDropdownCount: exportSelects.length,
                  effectsColumns: effectsGrid.template,
                  effectsDropdownCount: effectsSelects.length,
                  visualiserColumns: visualiserGrid.template,
                  visualiserDropdownCount: visualiserSelects.length,
                  pageErrors
                });
                await page.screenshot({ path: `${screenshotPrefix}-mobile-layout-${width}-visualiser.png`, fullPage: false, timeout: 15000 });
                assert.deepEqual(pageErrors, [], `Browser runtime errors at ${width}px`);
                await page.close();
              }
              console.log(JSON.stringify({ result: 'PASS', reports }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          python3 -m http.server 4173 --directory apps/web > /tmp/kefe-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:4173/index.html -o /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/index.html -o /dev/null || { cat /tmp/kefe-http.log; exit 1; }
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/kefe-mobile-layout-check.cjs

      - name: Wait for the latest GitHub Pages build
        run: |
          live_url='https://tezzaaaaaa.github.io/Kefe/apps/web/index.html'
          expected_marker=$(grep -o 'compact-controls\.css?v=[^"]*' apps/web/index.html | head -n 1)
          if [ -z "$expected_marker" ]; then
            echo 'Could not determine the expected mobile stylesheet version from the checked-out source.' >&2
            exit 1
          fi
          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error "$live_url" -o /tmp/kefe-live-index.html 2>/dev/null && grep -Fq "$expected_marker" /tmp/kefe-live-index.html; then
              echo "Latest mobile stylesheet version is published: $expected_marker"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not publish the expected mobile stylesheet version ($expected_marker) in time." >&2
          exit 1

      - name: Verify the published GitHub Pages editor in Chromium
        env:
          KEFE_BASE_URL: https://tezzaaaaaa.github.io/Kefe/apps/web
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/kefe-mobile-layout-check.cjs

      - name: Save mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kefe-mobile-layout-screenshots
