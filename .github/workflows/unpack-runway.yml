name: Apply Runway redesign ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for redesign archive
        id: archive
        run: |
          if [ -f Kefe-runway-redesign.zip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract redesign
        if: steps.archive.outputs.present == 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/runway
          mkdir -p /tmp/runway
          unzip -q Kefe-runway-redesign.zip -d /tmp/runway
          if [ -d /tmp/runway/Kefe ]; then
            src=/tmp/runway/Kefe
          else
            src=/tmp/runway
          fi
          find "$src" -name '.DS_Store' -delete
          find "$src" -name '__MACOSX' -type d -prune -exec rm -rf {} +
          cp -a "$src"/. .
          rm -f Kefe-runway-redesign.zip
          rm -f RUNWAY-EXTRACT-TRIGGER.txt

      - name: Commit extracted redesign
        if: steps.archive.outputs.present == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Apply Runway redesign and clean source archive'
          git push
