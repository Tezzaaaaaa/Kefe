name: KEFE formatting fixer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kefe-format-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Auto-format repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Format repository
        run: npm run format

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Repository already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "style: auto-format repository"
          git pull --rebase origin main
          git push
