name: AI Slop & Change Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-slop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Protect KEFE from AI slop and oversized changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax and repository checks
        run: npm run check

      - name: Smoke tests
        run: npm run test:smoke

      - name: Functional sweep
        run: npm run test:functional

      - name: Change blast-radius guard
        if: ${{ github.event_name == 'pull_request' }}
        env:
          KEFE_GUARD_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run check:ai-change

      - name: Change blast-radius guard (push/manual)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEFE_GUARD_BASE: ${{ github.event.before }}
        run: npm run check:ai-change

      - name: Deterministic AI-slop delta scan (pull request)
        if: ${{ github.event_name == 'pull_request' }}
        run: npx --no-install slop-scan delta --base "${{ github.event.pull_request.base.sha }}" --head HEAD --fail-on added,worsened

      - name: Deterministic AI-slop delta scan (push)
        if: ${{ github.event_name == 'push' }}
        run: npx --no-install slop-scan delta --base "${{ github.event.before }}" --head HEAD --fail-on added,worsened

      - name: Semantic AI-code gate
        if: ${{ github.event_name != 'workflow_dispatch' && secrets.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx --yes @schava09/slopgate --base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" --fail-on high

      - name: Semantic gate status
        if: ${{ secrets.ANTHROPIC_API_KEY == '' }}
        run: echo 'ANTHROPIC_API_KEY is not configured; deterministic gates remain enforced, semantic slopgate is skipped.'
