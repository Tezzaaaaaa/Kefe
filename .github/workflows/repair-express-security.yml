name: KEFE one-time dependency repair

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: kefe-one-time-dependency-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.event.head_commit.message != 'Repair Express security dependency' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Upgrade Express
        run: npm install express@5.2.1 --save-exact
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate repository
        run: |
          npm run check
          npm run test:smoke
          npm audit --omit=dev --audit-level=moderate
      - name: Commit dependency repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/repair-express-security.yml
          git add package.json package-lock.json .github/workflows/repair-express-security.yml
          git commit -m "Repair Express security dependency"
          git push
