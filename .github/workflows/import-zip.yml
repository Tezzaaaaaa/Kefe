name: Import kefe-git.zip

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP and replace repository contents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kefe-extract
          mkdir -p /tmp/kefe-extract
          unzip -q kefe-git.zip -d /tmp/kefe-extract

          shopt -s dotglob nullglob
          entries=(/tmp/kefe-extract/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            src="${entries[0]}"
          else
            src="/tmp/kefe-extract"
          fi

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'kefe-git.zip' -exec rm -rf {} +
          cp -a "$src"/. .
          rm -f kefe-git.zip
          rm -f .github/workflows/import-zip.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace repository with kefe-git project' || exit 0
          git push origin HEAD:main
