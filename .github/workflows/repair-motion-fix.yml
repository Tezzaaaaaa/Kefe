name: Repair one-time KEFE motion integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[motion-fix-prep]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Repair patch script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/fix-motion-effects.yml')
          s = p.read_text()
          s = s.replace("s.replace('\\\\nfunction renderLyricsEffect", "s.replace(chr(10) + 'function renderLyricsEffect")
          s = s.replace("s.replace('const EFFECT_LABELS = {\\\\n'", "s.replace('const EFFECT_LABELS = {' + chr(10)")
          p.write_text(s)
          Path('.github/workflows/repair-motion-fix.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-motion-effects.yml .github/workflows/repair-motion-fix.yml
          git commit -m "Repair motion integration workflow [motion-fix-prep]"
          git push
