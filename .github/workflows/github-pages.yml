name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Cache-bust and inject wizard mobile layout
        run: |
          sed -i "s#\(src=\"\./ui/wizard.js\)\"#\1?v=${GITHUB_SHA}\"#" index.html
          sed -i "s#\(href=\"\./ui/wizard.css\)\"#\1?v=${GITHUB_SHA}\"#" index.html
          sed -i "s#\(src=\"\./app.js\)\"#\1?v=${GITHUB_SHA}\"#" index.html
          sed -i "s#</head>#<link rel=\"stylesheet\" href=\"./ui/wizard-mobile.css?v=${GITHUB_SHA}\"></head>#" index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
