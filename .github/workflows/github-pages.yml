name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Cache-bust current KEFE assets
        run: |
          sed -i "s#\(src=\"\./app/app.js\)\"#\1?v=${GITHUB_SHA}\"#" index.html
          sed -i "s#\(href=\"\./app/ui/kefe-product-polish.css\)\"#\1?v=${GITHUB_SHA}\"#" index.html
          sed -i "s#\(src=\"\./app/ui/kefe-product-polish.js\)\"#\1?v=${GITHUB_SHA}\"#" index.html
          sed -i "s#</head>#<link rel=\"stylesheet\" href=\"./app/ui/theme-cycle.css?v=${GITHUB_SHA}\">\n</head>#" index.html
          sed -i "s#</body>#<script src=\"./app/ui/theme-cycle.js?v=${GITHUB_SHA}\"></script>\n</body>#" index.html
          sed -i "s#<label class=\"theme-control\" for=\"themeSelect\">\(.*\)<\/label>#<button id=\"themeSelect\" type=\"button\" class=\"theme-cycle-button\" aria-label=\"Theme\" title=\"Theme\">\1<\/button>#" index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
