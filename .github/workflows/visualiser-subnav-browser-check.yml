name: Visualiser submenu browser verification

concurrency:
  group: kefe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/visualiser-subnav-browser-check.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/visualiser-subnav-browser-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visualiser-subnav:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Test visualiser submenu locally
        run: |
          cat > /tmp/kefe-visualiser-subnav-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--use-gl=angle', '--use-angle=swiftshader'] });
            const baseUrl = process.env.KEFE_BASE_URL || 'http://127.0.0.1:4173';
            const label = process.env.KEFE_BASE_URL ? 'published GitHub Pages' : 'local source';
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            try {
              await page.goto(baseUrl + '/editor.html', { waitUntil: 'domcontentloaded' });
              await page.waitForFunction(() => document.querySelectorAll('.kefe-editing > .kefe-vis-tabs [role="tab"]').length === 3, { timeout: 30000 });
              const submenu = page.locator('.kefe-editing > .kefe-vis-tabs');
              const panels = page.locator('.kefe-panels');

              assert.equal(await submenu.isVisible(), false, label + ': submenu must be hidden outside Visualiser section');
              await page.locator('.kefe-sidebar [data-shell-panel="visualiser"]').click();
              await page.waitForFunction(() => {
                const row = document.querySelector('.kefe-editing > .kefe-vis-tabs');
                return row && getComputedStyle(row).display !== 'none' &&
                  document.querySelectorAll('.kefe-editing > .kefe-vis-tabs [role="tab"]').length === 3;
              });

              const order = ['gradient', 'fluted', 'slow-light'];
              const viewIds = {
                gradient: 'kefeVisGradientView',
                fluted: 'kefeVisFlutedView',
                'slow-light': 'kefeVisSlowLightView'
              };
              const presetSetIds = {
                gradient: 'kefeGradientPresetSet',
                fluted: 'kefeFlutedPresetSet',
                'slow-light': 'kefeSlowLightPresetSet'
              };
              const layout = await page.evaluate(() => {
                const legacyNav = document.querySelector('.kefe-tabs');
                const timeline = document.querySelector('.kefe-timeline').getBoundingClientRect();
                const row = document.querySelector('.kefe-editing > .kefe-vis-tabs');
                const rr = row.getBoundingClientRect();
                const preset = document.querySelector('.kefe-editing > .kefe-visualiser-preset-row').getBoundingClientRect();
                const panel = document.querySelector('.kefe-panels').getBoundingClientRect();
                const buttons = [...row.querySelectorAll('[role="tab"]')].map(b => {
                  const r = b.getBoundingClientRect();
                  return { id: b.dataset.visualiser, left: r.left, right: r.right, top: r.top, width: r.width };
                });
                return { legacyNavVisible: getComputedStyle(legacyNav).display !== 'none', timelineBottom: timeline.bottom, rowLeft: rr.left, rowRight: rr.right, rowTop: rr.top, rowBottom: rr.bottom, presetLeft: preset.left, presetRight: preset.right, panelsTop: panel.top, buttons };
              });
              assert.equal(layout.legacyNavVisible, false, label + ': duplicate legacy section navigation must remain hidden');
              assert.ok(layout.rowTop >= layout.timelineBottom - 1, label + ': visualiser submenu must sit below the preview timeline');
              assert.ok(layout.rowBottom <= layout.panelsTop + 1, label + ': settings panel must start below the submenu');
              assert.ok(await page.locator('.kefe-editing > .kefe-visualiser-preset-row').isVisible(), label + ': presets submenu must be visible beneath the visualiser options');
              assert.ok(Math.abs(layout.rowLeft - layout.presetLeft) < 2 && Math.abs(layout.rowRight - layout.presetRight) < 2,
                label + ': visualiser options and presets must share the same full-width grid alignment');
              assert.ok(layout.rowRight - layout.rowLeft > 500, label + ': visualiser options must not be confined to the narrow sidebar column');
              assert.deepEqual(layout.buttons.map(b => b.id), order, label + ': four tabs must appear in the expected order');
              assert.equal(await submenu.locator('[aria-selected="true"]').getAttribute('data-visualiser'), 'gradient',
                label + ': Liquid Flow must be the default visualiser');
              assert.equal((await page.locator('#kefeVisualiserHeading').textContent()).trim(), 'Liquid Flow Visualiser',
                label + ': default heading must identify Liquid Flow');
              assert.ok(layout.buttons.every(b => b.width > 0 && Math.abs(b.top - layout.buttons[0].top) < 2), label + ': all four tabs must occupy one horizontal row');
              assert.ok(layout.buttons.every((b, i) => i === 0 || b.left > layout.buttons[i - 1].left), label + ': tabs must be arranged horizontally');

              for (const id of order) {
                await submenu.locator('[data-visualiser="' + id + '"]').click();
                await page.waitForFunction(({ id, viewId }) => {
                  const row = document.querySelector('.kefe-editing > .kefe-vis-tabs');
                  const selected = row.querySelectorAll('[role="tab"][aria-selected="true"]');
                  const view = document.getElementById(viewId);
                  return selected.length === 1 && selected[0].dataset.visualiser === id && view && !view.hidden;
                }, { id, viewId: viewIds[id] });
                const selection = await page.evaluate(() => ({
                  selected: document.querySelector('.kefe-editing > .kefe-vis-tabs [aria-selected="true"]')?.dataset.visualiser,
                  visibleViews: [...document.querySelectorAll('.kefe-panel[data-panel-view="visualiser"] .kefe-vis-view')].filter(v => !v.hidden).map(v => v.id)
                }));
                assert.equal(selection.selected, id, label + ': selected tab must be highlighted: ' + id);
                assert.deepEqual(selection.visibleViews, [viewIds[id]], label + ': only selected visualiser settings should be visible: ' + id);
                const expectedTitles = {
                  gradient: 'Liquid Flow Visualiser',
                  fluted: 'Fluted Glass Visualiser',
                  'slow-light': 'Slow Light Visualiser'
                };
                const expectedDescriptions = {
                  gradient: 'Audio-reactive liquid glass with flowing gradients, refractive highlights and customizable presets.',
                  fluted: 'Six refractive glass treatments driven by audio.',
                  'slow-light': 'Original WebGL colour fields, continuous scene morphing, film grain and audio-reactive movement.'
                };
                const heading = page.locator('#kefeVisualiserHeading');
                const description = page.locator('#kefeVisualiserDescription');
                assert.equal((await heading.textContent()).trim(), expectedTitles[id],
                  label + ': selected visualiser heading must match its title: ' + id);
                assert.equal((await description.textContent()).trim(), expectedDescriptions[id],
                  label + ': selected visualiser description must match its selected visualiser: ' + id);
                if (id === 'slow-light') {
                  await page.waitForFunction(() => {
                    const canvas = document.getElementById('kefeSlowLightCanvas');
                    const gl = canvas && canvas.getContext('webgl');
                    const program = gl && gl.getParameter(gl.CURRENT_PROGRAM);
                    return !!window.kefeSlowLight && !!gl && canvas.width > 0 && canvas.height > 0 && !!program && gl.getProgramParameter(program, gl.LINK_STATUS);
                  });
                  assert.equal((await page.evaluate(() => window.kefeSlowLight.getState())).enabled, false,
                    label + ': Slow Light must remain disabled until explicitly enabled');
                  await page.locator('.kefe-slow-light-power').click();
                  await page.waitForFunction(() => window.kefeSlowLight?.getState().enabled === true &&
                    getComputedStyle(document.getElementById('kefeSlowLightCanvas')).display === 'block');
                  await page.locator('[data-scene="cobalt"]').click();
                  await page.waitForFunction(() => window.kefeSlowLight?.getState().scene === 'Cobalt');
                  const slider = page.locator('#kefeVisSlowLightView input[type="range"]').first();
                  await slider.evaluate(el => { el.value = '1.5'; el.dispatchEvent(new Event('input', { bubbles: true })); });
                  assert.equal((await page.evaluate(() => window.kefeSlowLight.getState())).settings.react, 1.5,
                    label + ': Slow Light controls must update the renderer state');
                }
                if (id === 'fluted') {
                  await page.waitForFunction(() => {
                    const canvas = document.getElementById('kefeFlutedGlassCanvas');
                    const gl = canvas && canvas.getContext('webgl');
                    const program = gl && gl.getParameter(gl.CURRENT_PROGRAM);
                    return !!gl && canvas.width > 0 && canvas.height > 0 && !!program &&
                      gl.getProgramParameter(program, gl.LINK_STATUS);
                  });
                  const modeNames = ['Fluted', 'Grid chamfer', 'Grid flat', 'Water drops', 'Zigzag', 'Waves'];
                  const modeDescriptions = [
                    'Half-cylinders with clear centres and refracting edges.',
                    'A flat grid with refracting chamfered edges.',
                    'Sharp grid cells with edge-focused distortion.',
                    'Rounded water droplets acting as small lenses.',
                    'Reeds whose distortion follows a repeating zigzag.',
                    'Smooth, rolling refractive waves.'
                  ];
                  assert.equal(await page.locator('#flutedModes button').count(), 6,
                    label + ': Fluted Glass must expose all six refraction modes');
                  for (let i = 0; i < modeNames.length; i++) {
                    await page.locator('#flutedModes button').nth(i).click();
                    const selectedModes = await page.locator('#flutedModes button[aria-pressed="true"]').allTextContents();
                    assert.deepEqual(selectedModes, [modeNames[i]], label + ': Fluted Glass mode selection must be exclusive: ' + modeNames[i]);
                    assert.equal((await page.locator('#flutedModeDesc').textContent()).trim(), modeDescriptions[i],
                      label + ': Fluted Glass mode must update its description: ' + modeNames[i]);
                    assert.ok(await page.locator('#flutedSliders input[type="range"]').count() >= 5,
                      label + ': Fluted Glass mode must expose its parameter sliders: ' + modeNames[i]);
                  }
                  await page.locator('#flutedModes button').first().click();
                }
                if (id === 'gradient') {
                  await page.waitForFunction(() => !!document.getElementById('kefeLiquidFlowCanvas') ||
                    !!document.querySelector('.kefe-liquid-error'));
                  const liquidError = await page.locator('.kefe-liquid-error').textContent().catch(() => '');
                  assert.equal(await page.locator('.kefe-liquid-error').count(), 0,
                    label + ': Liquid Flow must initialise without WebGL errors: ' + liquidError);
                  assert.equal(await page.locator('[data-liquid-preset]').count(), 4,
                    label + ': Liquid Flow must expose all four presets');
                  const renderer = await page.locator('#kefeLiquidFlowCanvas').evaluate(canvas => {
                    const gl = canvas.getContext('webgl');
                    const program = gl && gl.getParameter(gl.CURRENT_PROGRAM);
                    return !!gl && canvas.width > 0 && canvas.height > 0 &&
                      !!program && gl.getProgramParameter(program, gl.LINK_STATUS);
                  });
                  assert.equal(renderer, true, label + ': Liquid Flow WebGL renderer must be linked and sized');
                  await page.locator('[data-liquid-preset="chrome"]').click();
                  assert.equal((await page.evaluate(() => window.kefeGradientLayer.state())).preset, 'chrome',
                    label + ': Liquid Flow presets must change the active renderer settings');
                  await page.locator('#kefeGradientPresetSet .kefe-gradient-palettes button[aria-label="Ocean palette"]').click();
                  assert.equal((await page.evaluate(() => window.kefeGradientLayer.state())).palette, 'Ocean',
                    label + ': Liquid Flow palette buttons must update the renderer');
                  await page.locator('[data-liquid-preset="silk"]').click();
                  const liquidPowerForSource = page.locator('.kefe-visualiser-panel-head .kefe-switch');
                  const liquidWasEnabled = await liquidPowerForSource.getAttribute('aria-checked') === 'true';
                  if (!liquidWasEnabled) await liquidPowerForSource.click();
                  await page.waitForTimeout(120);
                  const paletteSpread = await page.evaluate(() => {
                    const canvas = document.getElementById('kefeLiquidFlowCanvas');
                    const gl = canvas && canvas.getContext('webgl');
                    if (!gl || canvas.width < 2 || canvas.height < 2) return { ranges: [], sceneActive: null };
                    const samples = [];
                    for (let row = 1; row <= 5; row++) {
                      for (let column = 1; column <= 5; column++) {
                        const pixel = new Uint8Array(4);
                        gl.readPixels(
                          Math.floor((column / 6) * (canvas.width - 1)),
                          Math.floor((row / 6) * (canvas.height - 1)),
                          1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel
                        );
                        samples.push([...pixel.slice(0, 3)]);
                      }
                    }
                    const ranges = [0, 1, 2].map(channel => {
                      const values = samples.map(pixel => pixel[channel]);
                      return Math.max(...values) - Math.min(...values);
                    });
                    return { ranges, sceneActive: window.kefeGradientLayer.state().sceneActive };
                  });
                  assert.equal(paletteSpread.sceneActive, false, label + ': Liquid Flow fallback test must have no scene texture');
                  assert.ok(paletteSpread.ranges.some(range => range > 40),
                    label + ': Liquid Flow palette ramp must retain colour variation instead of collapsing to the final colour stop');
                  await page.evaluate(async () => {
                    window.__kefeOriginalAlbumArtGetter = window.kefeGetAlbumArt;
                    const source = document.createElement('canvas');
                    source.width = 64; source.height = 64;
                    const context = source.getContext('2d');
                    context.fillStyle = '#13243a'; context.fillRect(0, 0, 64, 64);
                    context.fillStyle = '#f4f7ff'; context.fillRect(0, 0, 32, 64);
                    const image = new Image();
                    image.src = source.toDataURL('image/png');
                    await image.decode();
                    window.kefeGetAlbumArt = () => image;
                    const background = document.getElementById('visualiserBackground');
                    background.value = 'apple';
                    background.dispatchEvent(new Event('change', { bubbles: true }));
                  });
                  await page.waitForFunction(() => window.kefeGradientLayer?.state().sceneActive === true, null, { timeout: 10000 });
                  assert.equal((await page.evaluate(() => window.kefeGradientLayer.state())).sceneActive, true,
                    label + ': Liquid Flow must sample the active background as a refractive scene');
                  await page.evaluate(() => {
                    const background = document.getElementById('visualiserBackground');
                    background.value = 'off';
                    background.dispatchEvent(new Event('change', { bubbles: true }));
                    window.kefeGetAlbumArt = window.__kefeOriginalAlbumArtGetter;
                    delete window.__kefeOriginalAlbumArtGetter;
                  });
                  await page.waitForFunction(() => window.kefeGradientLayer?.state().sceneActive === false, null, { timeout: 10000 });
                  if (!liquidWasEnabled) await liquidPowerForSource.click();
                }
                const power = page.locator('.kefe-visualiser-panel-head .kefe-switch');
                assert.equal(await power.count(), 1, label + ': selected visualiser toggle must sit beside its description: ' + id);
                assert.equal(await submenu.locator('[data-visualiser="' + id + '"]').locator('xpath=..').locator('.kefe-switch').count(), 0,
                  label + ': power toggle must not remain beside the tab icon: ' + id);
                const initialPower = await power.getAttribute('aria-checked');
                await power.click();
                await page.waitForFunction(({ initialPower }) => {
                  const button = document.querySelector('.kefe-visualiser-panel-head .kefe-switch');
                  return button && button.getAttribute('aria-checked') === String(initialPower !== 'true');
                }, { initialPower });
                await power.click();
                await page.waitForFunction(({ initialPower }) => {
                  const button = document.querySelector('.kefe-visualiser-panel-head .kefe-switch');
                  return button && button.getAttribute('aria-checked') === initialPower;
                }, { initialPower });
                const presetState = await page.evaluate(({ id, presetSetId }) => ({
                  rowVisible: (() => { const row = document.querySelector('.kefe-editing > .kefe-visualiser-preset-row'); return !!row && !row.hidden && getComputedStyle(row).display !== 'none' && row.getBoundingClientRect().height > 0; })(),
                  visibleSets: [...document.querySelectorAll('.kefe-editing > .kefe-visualiser-preset-row > .kefe-visualiser-preset-set')].filter(set => !set.hidden && getComputedStyle(set).display !== 'none').map(set => set.id),
                  expectedSet: presetSetId
                }), { id, presetSetId: presetSetIds[id] });
                assert.equal(presetState.rowVisible, true, label + ': presets submenu must be visible for ' + id);
                assert.deepEqual(presetState.visibleSets, [presetState.expectedSet], label + ': only the selected visualiser preset set should be visible: ' + id);
                const strip = await page.evaluate(({ id, presetSetId }) => {
                    const set = document.getElementById(presetSetId);
                    const selector = id === 'gradient' ? '.kefe-gradient-palettes' : id === 'slow-light' ? '.kefe-slow-light-scenes' : '#flutedModes';
                    const el = set && set.querySelector(selector);
                    if (!el) return { missing: true, setHtml: set?.outerHTML || null };
                    const style = getComputedStyle(el);
                    const children = [...el.children].filter(child => child.getBoundingClientRect().width > 0);
                    const rects = children.map(child => child.getBoundingClientRect());
                    return {
                      display: style.display,
                      flexWrap: style.flexWrap,
                      count: children.length,
                      oneRow: rects.length > 0 && rects.every(r => Math.abs(r.top - rects[0].top) < 3),
                      scrollWidth: el.scrollWidth,
                      clientWidth: el.clientWidth
                    };
                  }, { id, presetSetId: presetSetIds[id] });
                  assert.ok(strip && !strip.missing, label + ': selected visualiser must have a preset strip: ' + id + ' ' + JSON.stringify(strip));
                  assert.equal(strip.display, 'flex', label + ': preset strip must use horizontal flex layout: ' + id);
                  assert.equal(strip.flexWrap, 'nowrap', label + ': preset choices must stay in one horizontal row: ' + id);
                  assert.ok(strip.count >= 2, label + ': preset strip must contain its real preset choices: ' + id);
                assert.equal(strip.oneRow, true, label + ': preset choices must not stack into columns: ' + id);
              }

              const pageScroll = await page.evaluate(() => {
                const panels = document.querySelector('.kefe-panels');
                const editor = document.querySelector('.kefe-editor');
                const before = window.scrollY;
                const pageHeight = document.scrollingElement.scrollHeight;
                const panelStyle = getComputedStyle(panels);
                const bodyStyle = getComputedStyle(document.body);
                window.scrollTo(0, pageHeight);
                return {
                  pageHeight,
                  viewportHeight: window.innerHeight,
                  before,
                  after: window.scrollY,
                  maxScroll: Math.max(0, pageHeight - window.innerHeight),
                  bodyOverflowY: bodyStyle.overflowY,
                  panelOverflowY: panelStyle.overflowY,
                  panelClientHeight: panels.clientHeight,
                  panelScrollHeight: panels.scrollHeight,
                  editorBottom: editor.getBoundingClientRect().bottom,
                  pageBottom: document.scrollingElement.scrollHeight
                };
              });
              await page.waitForTimeout(80);
              assert.ok(pageScroll.pageHeight > pageScroll.viewportHeight,
                label + ': full editor must expand the document beyond the viewport');
              assert.ok(['auto', 'scroll'].includes(pageScroll.bodyOverflowY),
                label + ': document must allow page-level vertical scrolling');
              assert.equal(pageScroll.panelOverflowY, 'visible',
                label + ': editor settings must not trap scrolling in the panels');
              assert.ok(pageScroll.after >= pageScroll.maxScroll - 2,
                label + ': user must be able to scroll to the bottom of the expanded editor');
              assert.ok(pageScroll.panelScrollHeight <= pageScroll.panelClientHeight + 2,
                label + ': editor panel must expand to its content instead of maintaining an inner scroll area');

              await page.locator('.kefe-sidebar-link[href="./editor.html"]').click();
              await page.locator('.kefe-panel[data-panel-view="media"].active').waitFor();
              assert.equal(await submenu.isVisible(), false, label + ': submenu must close when leaving Visualiser section');
              assert.deepEqual(errors, [], label + ': browser runtime errors: ' + errors.join('; '));
              console.log(JSON.stringify({ result: 'PASS', label, layout, selectedViewsTested: order, runtimeErrors: errors }, null, 2));

              await page.evaluate(() => window.scrollTo(0, 0));
              await page.setViewportSize({ width: 390, height: 844 });
              await page.locator('.kefe-sidebar [data-shell-panel="visualiser"]').click();
              await page.waitForFunction(() => {
                const row = document.querySelector('.kefe-editing > .kefe-vis-tabs');
                return row && getComputedStyle(row).display !== 'none';
              });
              const mobile = await submenu.evaluate(row => {
                const r = row.getBoundingClientRect();
                const preset = document.querySelector('.kefe-editing > .kefe-visualiser-preset-row').getBoundingClientRect();
                return { row: { left: r.left, right: r.right, top: r.top, bottom: r.bottom }, preset: { left: preset.left, right: preset.right }, buttons: [...row.querySelectorAll('[role="tab"]')].map(b => {
                  const x = b.getBoundingClientRect();
                  return { id: b.dataset.visualiser, left: x.left, right: x.right, top: x.top, width: x.width };
                }) };
              });
              assert.equal(mobile.buttons.length, 3, label + ': mobile must retain all three remaining visualiser choices');
              assert.ok(Math.abs(mobile.row.left - mobile.preset.left) < 2 && Math.abs(mobile.row.right - mobile.preset.right) < 2,
                label + ': mobile options and presets must share the same horizontal alignment');
              assert.ok(mobile.buttons.every(b => b.width > 0 && Math.abs(b.top - mobile.buttons[0].top) < 2), label + ': mobile visualiser choices must remain on one row');
              assert.ok(mobile.buttons.every((b, i) => i === 0 || b.left > mobile.buttons[i - 1].left), label + ': mobile choices must remain horizontally ordered');
              console.log(JSON.stringify({ result: 'PASS', label, mobile }, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          python3 -m http.server 4173 --directory apps/web > /tmp/kefe-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:4173/index.html -o /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/index.html -o /dev/null || { cat /tmp/kefe-http.log; exit 1; }
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/kefe-visualiser-subnav-check.cjs

      - name: Wait for GitHub Pages to publish this change
        if: github.event_name == 'push'
        run: |
          live_url='https://tezzaaaaaa.github.io/Kefe/apps/web/editor.html'
          expected_marker=$(grep -o 'app/ui/workspace-shell.css?v=[^\"]*' apps/web/editor.html | head -n 1)
          expected_editor=$(grep -o 'app/editor.js?v=[^\"]*' apps/web/editor.html | head -n 1)
          if [ -z "$expected_marker" ] || [ -z "$expected_editor" ]; then echo 'Could not determine the expected editor assets.' >&2; exit 1; fi
          for attempt in $(seq 1 48); do
            if curl --fail --silent "$live_url" -o /tmp/kefe-live-index.html && grep -Fq "$expected_marker" /tmp/kefe-live-index.html && grep -Fq "$expected_editor" /tmp/kefe-live-index.html; then
              echo "Expected editor assets are published: $expected_marker and $expected_editor"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not publish the expected editor assets ($expected_marker; $expected_editor) in time." >&2
          exit 1

      - name: Test live GitHub Pages submenu
        if: github.event_name == 'push'
        env:
          KEFE_BASE_URL: https://tezzaaaaaa.github.io/Kefe/apps/web
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/kefe-visualiser-subnav-check.cjs
