name: KEFE repository quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kefe-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting of changed files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- \
              '*.js' '*.mjs' '*.cjs' '*.json' '*.css' '*.html' '*.yml' '*.yaml' '*.md')
          else
            files=$(git diff --name-only HEAD^ HEAD -- \
              '*.js' '*.mjs' '*.cjs' '*.json' '*.css' '*.html' '*.yml' '*.yaml' '*.md')
          fi
          if [ -z "$files" ]; then
            echo "No supported text files changed; formatting check passes."
            exit 0
          fi
          printf '%s\n' "$files"
          printf '%s\n' "$files" | xargs npx prettier --check

      - name: Check JavaScript syntax and project checks
        run: npm run check
