name: KEFE repository quality gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: kefe-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, syntax, static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Check formatting of changed files
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only HEAD^ HEAD -- \
            '*.js' '*.mjs' '*.cjs' '*.json' '*.css' '*.html' '*.yml' '*.yaml' '*.md')
          if [ -z "$files" ]; then
            echo "No supported text files changed; formatting check passes."
            exit 0
          fi
          printf '%s\n' "$files" | xargs npx prettier --check
      - name: Check JavaScript syntax and project checks
        run: npm run check

  megalinter:
    name: Full repository sweep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/javascript@v8.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_WORKSPACE: ${{ github.workspace }}
          VALIDATE_ALL_CODEBASE: true
          REPORT_OUTPUT_FOLDER: megalinter-reports
          DISABLE_LINTERS: COPYPASTE_JSCPD,REPOSITORY_GITLEAKS
          FIX: none

  browser:
    name: Browser functional verification
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Playwright test runner
        run: npm install --no-save playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run KEFE smoke test
        run: npm run test:smoke
      - name: Run KEFE functional sweep
        run: npm run test:functional
