name: Apply native motion effects

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: "!contains(github.event.pull_request.head.ref, 'native-motion-final') && !contains(github.event.head_commit.message, '[native-motion-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Apply integration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          root = Path('.')

          app = root / 'app/app.js'
          s = app.read_text()
          old = '''        case "pulse": drawPulseEffect(ctx, w, h, style, lines, time); break;
        case "typewriter":
        case "instagram":
        case "fadeup": {
            const fn = window.kefeEffects && window.kefeEffects[style.effect];
            if (typeof fn === "function") fn(ctx, w, h, style, lines, time);
            else drawAppleEffect(ctx, w, h, style, lines, time);
            break;
        }'''
          new = '''        case "pulse": drawPulseEffect(ctx, w, h, style, lines, time); break;
        case "rise":
        case "slide":
        case "drop":
        case "drift":
        case "typewriter":
        case "instagram":
        case "fadeup": {
            const fn = window.kefeEffects && window.kefeEffects[style.effect];
            if (typeof fn === "function") fn(ctx, w, h, style, lines, time);
            break;
        }'''
          if old not in s: raise SystemExit('renderer switch anchor not found')
          s = s.replace(old, new, 1)
          if '    rise: "Rise — a clean upward entrance' not in s:
              s = s.replace('const EFFECT_LABELS = {\n', '''const EFFECT_LABELS = {
    rise: "Rise — a clean upward entrance that settles into place",
    slide: "Slide — a crisp horizontal sweep into focus",
    drop: "Drop — a weighted downward entrance with a soft settle",
    drift: "Drift — a subtle diagonal float with restrained rotation",
''', 1)
          s = s.replace('const TITLECARD_DESIGN_FOR_EFFECT = { apple:', "const TITLECARD_DESIGN_FOR_EFFECT = { rise: 'minimal', slide: 'minimal', drop: 'minimal', drift: 'minimal', apple:", 1)
          app.write_text(s)

          index = root / 'index.html'
          h = index.read_text()
          anchor = '<div class="effect-buttons"><button type="button" class="segmented-btn" data-effect="apple">Apple</button>'
          if 'data-effect="rise"' not in h:
              buttons = ''.join(f'<button type="button" class="segmented-btn" data-effect="{n}">{n.title()}</button>' for n in ['rise','slide','drop','drift'])
              h = h.replace(anchor, '<div class="effect-buttons">' + buttons + '<button type="button" class="segmented-btn" data-effect="apple">Apple</button>', 1)
          script_anchor = '<script src="./app/effects/core.js"></script><script src="./app/effects/typewriter.js"></script>'
          if './app/effects/motion.js' not in h:
              scripts = '<script src="./app/effects/core.js"></script><script src="./app/effects/motion.js"></script><script src="./app/effects/rise.js"></script><script src="./app/effects/slide.js"></script><script src="./app/effects/drop.js"></script><script src="./app/effects/drift.js"></script><script src="./app/effects/typewriter.js"></script>'
              h = h.replace(script_anchor, scripts, 1)
          index.write_text(h)

          wizard = root / 'app/ui/wizard/wizard-all-effects.js'
          w = wizard.read_text().replace('    promoteFreeMotionEffects();\n', '')
          old_demo = '''    const line = document.createElement('span');
    line.className = 'wizard-effect-demo-line';
    line.textContent = 'LYRICS';
    demo.appendChild(line);'''
          new_demo = '''    if (motion.has(name)) {
      const image = document.createElement('img');
      image.className = 'wizard-effect-thumbnail';
      image.src = `./assets/effects/${name}.svg`;
      image.alt = '';
      image.setAttribute('aria-hidden', 'true');
      demo.appendChild(image);
    } else {
      const line = document.createElement('span');
      line.className = 'wizard-effect-demo-line';
      line.textContent = 'LYRICS';
      demo.appendChild(line);
    }'''
          if old_demo in w: w = w.replace(old_demo, new_demo, 1)
          if '.wizard-effect-thumbnail {' not in w:
              marker = '    .wizard-all-effect-grid .wizard-effect-choice[data-wizard-effect="rise"] .wizard-effect-demo {'
              rule = '    .wizard-all-effect-grid .wizard-effect-thumbnail { width:100%; height:100%; display:block; object-fit:cover; position:relative; z-index:1; }\n'
              w = w.replace(marker, rule + marker, 1)
          wizard.write_text(w)

          auto = root / 'app/core/auto-create.js'
          a = auto.read_text().replace("const EFFECTS = new Set(['apple','brat','eternal','aurora','pulse','typewriter','instagram','fadeup']);", "const EFFECTS = new Set(['rise','slide','drop','drift','apple','brat','eternal','aurora','pulse','typewriter','instagram','fadeup']);")
          auto.write_text(a)

          typo = root / 'app/ui/typography.js'
          t = typo.read_text()
          if 'rise: { family:' not in t:
              t = t.replace("  const families = { ui: 'Open Sans',", "  const families = { ui: 'Open Sans', rise: 'Open Sans', slide: 'Open Sans', drop: 'Open Sans', drift: 'Open Sans',", 1)
              t = t.replace("  const effects = {\n", "  const effects = {\n    rise: { family: families.rise, weight: 800, min: 42, max: 150, lineHeight: 1.05, tracking: -.018, align: 'center', case: 'none', opticalScale: 1.00 },\n    slide: { family: families.slide, weight: 800, min: 42, max: 150, lineHeight: 1.05, tracking: -.018, align: 'center', case: 'none', opticalScale: 1.00 },\n    drop: { family: families.drop, weight: 800, min: 42, max: 150, lineHeight: 1.05, tracking: -.018, align: 'center', case: 'none', opticalScale: 1.00 },\n    drift: { family: families.drift, weight: 800, min: 42, max: 150, lineHeight: 1.05, tracking: -.018, align: 'center', case: 'none', opticalScale: 1.00 },\n", 1)
          typo.write_text(t)

          smoke = root / 'scripts/smoke-effects.js'
          q = smoke.read_text()
          if "'app/effects/motion.js'" not in q:
              q = q.replace("  'app/effects/core.js',\n", "  'app/effects/core.js',\n  'app/effects/motion.js',\n  'app/effects/rise.js',\n  'app/effects/slide.js',\n  'app/effects/drop.js',\n  'app/effects/drift.js',\n", 1)
          q = q.replace("const expectKeys = ['brat', 'aurora', 'eternal', 'typewriter', 'instagram', 'fadeup'];", "const expectKeys = ['rise', 'slide', 'drop', 'drift', 'brat', 'aurora', 'eternal', 'typewriter', 'instagram', 'fadeup'];", 1)
          q = q.replace("for (const key of ['brat', 'aurora', 'eternal', 'typewriter', 'instagram', 'fadeup', 'apple'])", "for (const key of ['rise', 'slide', 'drop', 'drift', 'brat', 'aurora', 'eternal', 'typewriter', 'instagram', 'fadeup', 'apple'])", 1)
          smoke.write_text(q)

          asset_dir = root / 'assets/effects'; asset_dir.mkdir(parents=True, exist_ok=True)
          thumbs = {
            'rise': ('#13243A', '#8FD8FF', 'M50 78 C50 61 50 43 50 22'),
            'slide': ('#171717', '#DDE8F2', 'M18 50 C38 50 62 50 82 50'),
            'drop': ('#2C1B10', '#F1C17A', 'M50 22 C50 41 50 60 50 78'),
            'drift': ('#1C1830', '#C8B8FF', 'M20 77 C39 64 61 40 81 23'),
          }
          for name, (start, end, path) in thumbs.items():
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><defs><linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="{start}"/><stop offset="1" stop-color="{end}"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="7"/></filter></defs><rect width="320" height="180" rx="18" fill="url(#bg)"/><path d="{path}" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" opacity=".18" filter="url(#blur)"/><path d="{path}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="#fff" opacity=".7"/><text x="160" y="150" text-anchor="middle" fill="#fff" font-family="Open Sans,Arial,sans-serif" font-size="20" font-weight="800">{name.upper()}</text></svg>'''
              (asset_dir / f'{name}.svg').write_text(svg)

          for wf in [root/'.github/workflows/fix-motion-effects.yml', root/'.github/workflows/fix-motion-effects-v2.yml', root/'.github/workflows/integrate-native-motion-effects.yml']:
              if wf.exists(): wf.unlink()
          (root / '.github/workflows/apply-native-motion.yml').unlink()

          assert h.index('data-effect="rise"') < h.index('data-effect="apple"')
          assert all(f'case "{n}"' in s for n in ['rise','slide','drop','drift'])
          assert all((asset_dir / f'{n}.svg').exists() for n in ['rise','slide','drop','drift'])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/app.js app/effects app/core/auto-create.js app/ui/typography.js app/ui/wizard/wizard-all-effects.js scripts/smoke-effects.js index.html assets/effects .github/workflows
          git commit -m "Integrate polished standalone motion effects [native-motion-applied]"
          git push origin HEAD:${{ github.head_ref }}
