name: Bundle self-hosted KEFE fonts
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonttools
        run: python -m pip install --disable-pip-version-check fonttools
      - name: Download and convert fonts
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          from fontTools.ttLib import TTFont

          fonts = {
              "fonts/figtree/Figtree-Regular.ttf": "https://raw.githubusercontent.com/erikdkennedy/figtree/master/fonts/ttf/Figtree-Regular.ttf",
              "fonts/figtree/Figtree-Medium.ttf": "https://raw.githubusercontent.com/erikdkennedy/figtree/master/fonts/ttf/Figtree-Medium.ttf",
              "fonts/figtree/Figtree-SemiBold.ttf": "https://raw.githubusercontent.com/erikdkennedy/figtree/master/fonts/ttf/Figtree-SemiBold.ttf",
              "fonts/figtree/Figtree-Bold.ttf": "https://raw.githubusercontent.com/erikdkennedy/figtree/master/fonts/ttf/Figtree-Bold.ttf",
              "fonts/faustina/Faustina-Regular.ttf": "https://raw.githubusercontent.com/Omnibus-Type/Faustina/master/fonts/ttf/Faustina-Regular.ttf",
              "fonts/faustina/Faustina-Italic.ttf": "https://raw.githubusercontent.com/Omnibus-Type/Faustina/master/fonts/ttf/Faustina-Italic.ttf",
              "fonts/faustina/Faustina-Medium.ttf": "https://raw.githubusercontent.com/Omnibus-Type/Faustina/master/fonts/ttf/Faustina-Medium.ttf",
              "fonts/faustina/Faustina-SemiBold.ttf": "https://raw.githubusercontent.com/Omnibus-Type/Faustina/master/fonts/ttf/Faustina-SemiBold.ttf",
              "fonts/bagelfat/BagelFat-Regular.ttf": "https://raw.githubusercontent.com/JAMO-TYPEFACE/BagelFat/main/Fonts/ttf/BagelFatOne-Regular.ttf",
          }
          for path, url in fonts.items():
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              if not p.exists():
                  p.write_bytes(urlopen(url).read())
              out = p.with_suffix(".woff2")
              font = TTFont(str(p))
              font.flavor = "woff2"
              font.save(str(out))
          PY
      - name: Commit bundled fonts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fonts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Bundle self-hosted fonts"
          git push
