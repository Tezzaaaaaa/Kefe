name: Unified workspace shell browser verification

concurrency:
  group: kefe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/workspace-shell-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Wait for GitHub Pages to publish the workspace shell
        run: |
          live_url='https://tezzaaaaaa.github.io/Kefe/apps/web/editor.html'
          expected_shell=$(grep -o 'app/ui/workspace-shell.css?v=[^"]*' apps/web/editor.html | head -n 1)
          expected_editor=$(grep -o 'app/editor.js?v=[^"]*' apps/web/editor.html | head -n 1)
          expected_styles=$(grep -o 'app/ui/styles.css?v=[^"]*' apps/web/editor.html | head -n 1)
          if [ -z "$expected_shell" ] || [ -z "$expected_editor" ] || [ -z "$expected_styles" ]; then
            echo 'Could not determine the expected workspace shell assets.' >&2
            exit 1
          fi
          for attempt in $(seq 1 48); do
            if curl --fail --silent "$live_url" -o /tmp/kefe-live-editor.html 2>/dev/null && grep -Fq "$expected_shell" /tmp/kefe-live-editor.html && grep -Fq "$expected_editor" /tmp/kefe-live-editor.html && grep -Fq "$expected_styles" /tmp/kefe-live-editor.html; then
              echo "Published editor contains the expected assets: $expected_shell, $expected_editor and $expected_styles"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not publish the expected editor assets ($expected_shell; $expected_editor; $expected_styles) in time." >&2
          exit 1

      - name: Verify workspace, editor navigation, themes and routes locally and live
        run: |
          python3 -m http.server 4173 --directory apps/web > /tmp/kefe-workspace-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:4173/index.html -o /dev/null; then break; fi
            sleep 1
          done
          cat > /tmp/kefe-workspace-shell-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          async function checkLocalReferences(page, label) {
            const refs = await page.locator('a[href],link[href],script[src],img[src]').evaluateAll(nodes =>
              nodes.map(node => node.getAttribute('href') || node.getAttribute('src'))
                .filter(value => value && value.startsWith('./'))
                .map(value => value.split(/[?#]/)[0])
            );
            const missing = [...new Set(refs)].filter(ref =>
              !fs.existsSync(path.join(process.cwd(), 'apps/web', ref.slice(2)))
            );
            assert.deepEqual(missing, [], label + ': missing local files: ' + missing.join(', '));
          }

          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--use-gl=angle', '--use-angle=swiftshader'] });
            const baseUrl = process.env.KEFE_BASE_URL || 'http://127.0.0.1:4173';
            const errors = [];
            try {
              const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
              page.on('pageerror', error => errors.push(error.message));

              await page.goto(baseUrl + '/index.html', { waitUntil: 'domcontentloaded' });
              await page.waitForURL(/workspace\.html$/);
              await page.locator('.workspace-switch').waitFor();
              await page.locator('#themeToggle').click();
              assert.equal(await page.locator('html').getAttribute('data-theme'), 'day', 'workspace Day mode must change the active theme');
              assert.equal(await page.evaluate(() => localStorage.getItem('kefe.theme')), 'day', 'workspace theme choice must persist');
              await checkLocalReferences(page, 'workspace');
              for (const section of ['lyrics', 'effects', 'visualiser', 'export']) {
                await page.locator('.feature-card[href="./editor.html?section=' + section + '"]').click();
                await page.locator('.kefe-panel[data-panel-view="' + section + '"].active').waitFor();
                await page.goto(baseUrl + '/workspace.html', { waitUntil: 'domcontentloaded' });
              }

              await page.getByRole('link', { name: 'Editor', exact: true }).click();
              await page.locator('.kefe-sidebar').waitFor();
              await page.locator('.kefe-stage').waitFor();
              await page.locator('.kefe-panel[data-panel-view="media"].active').waitFor();
              await checkLocalReferences(page, 'editor');
              const editorLayout = await page.evaluate(() => {
                const rail = document.querySelector('.kefe-tabs');
                const editor = document.querySelector('.kefe-editing');
                const panel = document.querySelector('.kefe-panel.active').getBoundingClientRect();
                const stage = document.querySelector('.kefe-stage').getBoundingClientRect();
                return {
                  duplicateSectionRail: getComputedStyle(rail).display !== 'none',
                  editorDisplay: getComputedStyle(editor).display,
                  panelWidth: panel.width,
                  panelRight: panel.right,
                  stageWidth: stage.width,
                  stageHeight: stage.height,
                  mediaFormColumns: getComputedStyle(document.querySelector('.kefe-panel[data-panel-view="media"] .kefe-form')).gridTemplateColumns.trim().split(/\s+/).filter(Boolean).length,
                  mediaFormUsesSteps: document.querySelector('.kefe-panel[data-panel-view="media"] .kefe-form').classList.contains('kefe-media-steps'),
                  detailsGridColumns: (() => { const grid = document.querySelector('.kefe-details-grid'); return grid ? getComputedStyle(grid).gridTemplateColumns.trim().split(/\s+/).filter(Boolean).length : 0; })(),
                  viewportWidth: innerWidth,
                  viewportHeight: innerHeight
                };
              });
              assert.equal(editorLayout.duplicateSectionRail, false, 'editor must not show a second section navigation rail');
              assert.equal(editorLayout.editorDisplay, 'block', 'editor controls must share one content column');
              assert.ok(editorLayout.panelWidth <= 1200, 'editor panel should have a consistent maximum width: ' + JSON.stringify(editorLayout));
              assert.ok(editorLayout.panelRight <= editorLayout.viewportWidth + 1, 'editor panel must fit the viewport: ' + JSON.stringify(editorLayout));
              assert.ok(editorLayout.stageWidth <= 900, 'preview should be bounded rather than dominate the editor: ' + JSON.stringify(editorLayout));
              assert.ok(editorLayout.stageHeight <= editorLayout.viewportHeight * 0.56, 'preview should be vertically bounded: ' + JSON.stringify(editorLayout));
              assert.equal(editorLayout.mediaFormColumns, 1,
                'media panel must use a single-column layout: ' + JSON.stringify(editorLayout));
              if (editorLayout.mediaFormUsesSteps && editorLayout.detailsGridColumns) {
                assert.equal(editorLayout.detailsGridColumns, 1, 'song metadata inside the media steps must use a single column');
              }
              for (const section of ['media', 'lyrics', 'effects', 'background-effects', 'visualiser', 'export']) {
                const layout = await page.locator('.kefe-panel[data-panel-view="' + section + '"] .kefe-form').evaluate(node => {
                  const matchedRules = [];
                  const collect = rules => {
                    for (const rule of rules) {
                      if (rule.cssRules) collect(rule.cssRules);
                      if (!rule.selectorText || !rule.style?.getPropertyValue('grid-template-columns')) continue;
                      try {
                        if (node.matches(rule.selectorText)) matchedRules.push({
                          selector: rule.selectorText,
                          value: rule.style.getPropertyValue('grid-template-columns'),
                          important: rule.style.getPropertyPriority('grid-template-columns')
                        });
                      } catch (_) {}
                    }
                  };
                  for (const sheet of document.styleSheets) { try { collect(sheet.cssRules); } catch (_) {} }
                  const template = getComputedStyle(node).gridTemplateColumns;
                  return {
                    template,
                    columns: template.trim().split(/\\s+/).filter(Boolean).length,
                    insidePanelStack: !!node.closest('.kefe-panels'),
                    stylesheet: [...document.styleSheets].map(sheet => sheet.href).filter(Boolean),
                    matchedRules: matchedRules.slice(-12)
                  };
                });
                assert.equal(layout.columns, 1, section + ' panel must use a single-column layout: ' + JSON.stringify(layout));
              }

              const shellGeometry = await page.evaluate(() => {
                const sidebar = document.querySelector('.kefe-sidebar').getBoundingClientRect();
                const work = document.querySelector('.kefe-work').getBoundingClientRect();
                return { sidebarWidth: sidebar.width, workLeft: work.left, hasDuplicateHeader: !!document.querySelector('.kefe-top'), hasSearchHeader: !!document.querySelector('.kefe-command-trigger'), viewportWidth: innerWidth, documentWidth: document.documentElement.scrollWidth };
              });
              assert.ok(shellGeometry.sidebarWidth >= 180 && shellGeometry.sidebarWidth <= 250, 'desktop sidebar should fit the workspace: ' + JSON.stringify(shellGeometry));
              assert.equal(shellGeometry.hasDuplicateHeader, false, 'duplicate top header must be removed');
              assert.equal(shellGeometry.hasSearchHeader, false, 'search-bar header must be removed');
              assert.ok(shellGeometry.workLeft >= shellGeometry.sidebarWidth - 1, 'editor workspace should sit beside the sidebar: ' + JSON.stringify(shellGeometry));
              assert.ok(shellGeometry.documentWidth <= shellGeometry.viewportWidth, 'desktop layout must not overflow horizontally: ' + JSON.stringify(shellGeometry));

              for (const section of ['lyrics', 'effects', 'background-effects', 'visualiser', 'export']) {
                await page.locator('.kefe-sidebar [data-shell-panel="' + section + '"]').click();
                await page.locator('.kefe-panel[data-panel-view="' + section + '"].active').waitFor();
                assert.equal(await page.locator('.kefe-sidebar [data-shell-panel="' + section + '"]').getAttribute('aria-current'), 'page', section + ' navigation should show the active section');
              }

              await page.locator('[data-dock-panel="background-effects"]').click();
              await page.locator('.kefe-panel[data-panel-view="background-effects"].active').waitFor();
              assert.equal(await page.locator('[data-dock-panel="background-effects"]').getAttribute('aria-pressed'), 'true',
                'Background Effects dock shortcut should open and mark its panel active');
              await page.locator('.kefe-sidebar [data-shell-panel="media"]').click();
              await page.locator('.kefe-panel[data-panel-view="media"].active').waitFor();

              await page.locator('.kefe-sidebar button[data-top-panel="settings"]').click();
              await page.locator('.kefe-settings-backdrop:not([hidden])').waitFor();
              await page.keyboard.press('Escape');
              await page.locator('.kefe-settings-backdrop:not([hidden])').waitFor({ state: 'hidden' });

              await page.goto(baseUrl + '/editor.html?section=visualiser', { waitUntil: 'domcontentloaded' });
              await page.locator('.kefe-panel[data-panel-view="visualiser"].active').waitFor();
              if (process.env.KEFE_BASE_URL) {
                const siteRoot = baseUrl.replace(/\/apps\/web\/?$/, '');
                await page.goto(siteRoot + '/', { waitUntil: 'domcontentloaded' });
                await page.waitForURL(/\/Kefe\/apps\/web\/workspace\.html$/);
                await page.locator('.workspace-switch').waitFor();
              }
              assert.deepEqual(errors, [], 'desktop runtime errors: ' + errors.join('; '));

              const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, isMobile: true, hasTouch: true });
              mobile.on('pageerror', error => errors.push(error.message));
              await mobile.goto(baseUrl + '/editor.html', { waitUntil: 'domcontentloaded' });
              await mobile.locator('.kefe-sidebar').waitFor();
              const mobileGeometry = await mobile.evaluate(() => ({ viewportWidth: innerWidth, documentWidth: document.documentElement.scrollWidth, sidebarHeight: document.querySelector('.kefe-sidebar').getBoundingClientRect().height }));
              assert.ok(mobileGeometry.documentWidth <= mobileGeometry.viewportWidth, 'mobile layout must not overflow horizontally: ' + JSON.stringify(mobileGeometry));
              assert.ok(mobileGeometry.sidebarHeight <= 56, 'mobile navigation should use a compact horizontal row: ' + JSON.stringify(mobileGeometry));
              assert.equal(await mobile.locator('.kefe-tabs').evaluate(node => getComputedStyle(node).display), 'none', 'mobile editor must not duplicate section navigation');
              for (const section of ['media', 'lyrics', 'effects', 'background-effects', 'visualiser', 'export']) {
                const columns = await mobile.locator('.kefe-panel[data-panel-view="' + section + '"] .kefe-form').evaluate(node => getComputedStyle(node).gridTemplateColumns.trim().split(/\s+/).filter(Boolean).length);
                assert.equal(columns, 1, 'mobile ' + section + ' panel must use a single-column layout');
              }
              const mobileStage = await mobile.locator('.kefe-stage').boundingBox();
              assert.ok(mobileStage.width <= mobileGeometry.viewportWidth, 'mobile preview must fit the viewport: ' + JSON.stringify({mobileGeometry,mobileStage}));
              await mobile.locator('.kefe-sidebar [data-shell-panel="lyrics"]').click();
              await mobile.locator('.kefe-panel[data-panel-view="lyrics"].active').waitFor();
              await mobile.goto(baseUrl + '/workspace.html', { waitUntil: 'domcontentloaded' });
              await mobile.locator('section[aria-labelledby="mediaTitle"]').waitFor({ state: 'visible' });
              await mobile.getByRole('link', { name: 'Open Media', exact: true }).waitFor({ state: 'visible' });
              assert.equal(await mobile.getByText('Project library', { exact: true }).count(), 0, 'workspace must not expose the removed Library');
              assert.deepEqual(errors, [], 'browser runtime errors: ' + errors.join('; '));
              console.log(JSON.stringify({ result: 'PASS', workspaceRedirect: 'PASS', dayNightPersistence: 'PASS', localReferences: 'PASS', desktopSidebar: shellGeometry, integratedEditorLayout: editorLayout, sidebarSections: 'PASS', mediaNavigation: 'PASS', settingsModal: 'PASS', deepLink: 'PASS', mobileLayout: mobileGeometry, runtimeErrors: errors }));
              await mobile.close();
              await page.close();
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/kefe-workspace-shell-check.cjs
          KEFE_BASE_URL='https://tezzaaaaaa.github.io/Kefe/apps/web' NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/kefe-workspace-shell-check.cjs
