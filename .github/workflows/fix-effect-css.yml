name: Fix effect browser CSS
on:
  push:
    paths:
      - '.github/workflows/fix-effect-css.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair motion keyframes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ui/wizard-showcase.css')
          s = p.read_text()
          old = '@keyframes wizardEffectRise{0%,100%{opacity:0;transform:translateY(12px)}35%,75%{opacity:1;transform:translateY(0)}@keyframes wizardEffectSlide{0%,100%{opacity:0;transform:translateX(-18px)}30%,78%{opacity:1;transform:translateX(0)}@keyframes wizardEffectDrop{0%,100%{opacity:0;transform:translateY(-14px)}30%,78%{opacity:1;transform:translateY(0)}@keyframes wizardEffectDrift{0%,100%{opacity:.2;transform:translate(-10px,3px)}50%{opacity:1;transform:translate(10px,-2px)}}'
          new = '@keyframes wizardEffectRise{0%,100%{opacity:0;transform:translateY(12px)}35%,75%{opacity:1;transform:translateY(0)}}@keyframes wizardEffectSlide{0%,100%{opacity:0;transform:translateX(-18px)}30%,78%{opacity:1;transform:translateX(0)}}@keyframes wizardEffectDrop{0%,100%{opacity:0;transform:translateY(-14px)}30%,78%{opacity:1;transform:translateY(0)}}@keyframes wizardEffectDrift{0%,100%{opacity:.2;transform:translate(-10px,3px)}50%{opacity:1;transform:translate(10px,-2px)}}'
          if old not in s:
              raise SystemExit('expected malformed keyframe block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/wizard-showcase.css
          git commit -m 'Fix motion effect preview keyframes' || true
          git push
          git rm .github/workflows/fix-effect-css.yml || true
          git commit -m 'Remove temporary effect CSS workflow' || true
          git push
