name: Apply KEFE export upgrade
on:
  workflow_dispatch:
  push:
    paths:
      - 'export/config.js'
      - 'export/subtitles.js'
      - 'export/export-enhancements.js'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire export controls and quality settings
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('export/index.js')
          s = p.read_text()
          if "from './config.js'" not in s:
              s = "import { getQualityPreset } from './config.js';\n" + s
          s = s.replace("const totalFrames = Math.max(1, Math.ceil(duration * config.fps));", "const quality = getQualityPreset(window.kefeExportQuality || 'medium');\n    const totalFrames = Math.max(1, Math.ceil(duration * config.fps));")
          s = s.replace("'-c:v', 'libx264', '-preset', 'veryfast', '-crf', '20',", "'-c:v', 'libx264', '-preset', 'veryfast', '-crf', String(quality.crf),")
          s = s.replace("'-map', '1:a:0', '-c:a', 'aac', '-b:a', '192k',", "'-map', '1:a:0', '-c:a', 'aac', '-b:a', quality.audioBitrate,")
          p.write_text(s)
          p = Path('index.html')
          s = p.read_text()
          tag = '<script type="module" src="./export/export-enhancements.js"></script>'
          if tag not in s:
              s = s.replace('</body>', f'    {tag}\n</body>')
          p.write_text(s)
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export/index.js index.html
          git rm .github/workflows/apply-export-upgrade.yml
          git diff --cached --quiet || git commit -m "Upgrade KEFE export quality and subtitles"
          git push
