name: Publish beUI editor to GitHub Pages source

on:
  push:
    branches: [main]
    paths:
      - "apps/web/app/**"
      - "apps/web/beui-src/**"
      - "apps/web/components/**"
      - "apps/web/legal-src/**"
      - "apps/web/editor.source.html"
      - "apps/web/apple-lyrics-standalone.source.html"
      - "apps/web/beui.vite.config.ts"
      - "apps/web/package.json"
      - "apps/web/scripts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/beui-publish.yml"

permissions:
  contents: write

concurrency:
  group: beui-publish-main-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    # Match the build workflow's tested runner for Playwright's Chromium setup.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build beUI editor
        run: pnpm --filter @kefe/web build
      - name: Verify built output
        run: |
          test -s apps/web/dist-beui/editor.html
          node apps/web/scripts/verify-visualiser-wiring.mjs
          node apps/web/scripts/smoke-build.mjs
          node apps/web/scripts/smoke-settings-api.mjs
          node apps/web/scripts/smoke-section-card-coverage.mjs
          node apps/web/scripts/smoke-settings-tabs.mjs
          node apps/web/scripts/smoke-shadcn-js.mjs
          node apps/web/scripts/smoke-signature-effects.mjs
          node apps/web/scripts/smoke-native-controls.mjs
          node apps/web/scripts/smoke-native-upload.mjs
          node apps/web/scripts/smoke-mobile-sidebar.mjs
          node apps/web/scripts/smoke-mobile-sidebar-groups.mjs
      - name: Publish generated editor assets to Pages source
        run: |
          cp apps/web/dist-beui/editor.html apps/web/editor.html
          cp apps/web/dist-beui/apple-lyrics-standalone.html apps/web/apple-lyrics-standalone.html
          rm -rf apps/web/assets
          cp -R apps/web/dist-beui/assets apps/web/assets
          cp apps/web/dist-beui/legal/privacy.html apps/web/legal/privacy.html
          cp apps/web/dist-beui/legal/terms.html apps/web/legal/terms.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/editor.html apps/web/apple-lyrics-standalone.html apps/web/assets apps/web/legal/privacy.html apps/web/legal/terms.html
          if git diff --cached --quiet; then
            echo "Built editor assets are already current."
          else
            git commit -m "Publish verified beUI editor build"
            git push origin HEAD:main
          fi
