name: KEFE iFixAi fixture validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate iFixAi audit fixture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install iFixAi
        run: python -m pip install "ifixai[openai]==3.4.0"

      - name: Validate fixture
        run: ifixai validate ifixai/kefe-agent.yaml
