name: Browser export regression

on:
  pull_request:
    paths:
      - 'artifacts/kefe-visualiser/public/legacy/**'
      - 'scripts/browser-export-regression.mjs'
      - '.github/workflows/browser-export-regression.yml'
  push:
    branches:
      - main
      - 'safety/browser-export-regression'
    paths:
      - 'artifacts/kefe-visualiser/public/legacy/**'
      - 'scripts/browser-export-regression.mjs'
      - '.github/workflows/browser-export-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install Playwright in the runner temp directory
        run: npm install --prefix "$RUNNER_TEMP/kefe-playwright" playwright@1.56.1
      - name: Install Chromium
        run: '"$RUNNER_TEMP/kefe-playwright/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Test background video and editor layers in exported video
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/kefe-playwright/node_modules/playwright/index.mjs
        run: node scripts/browser-export-regression.mjs
