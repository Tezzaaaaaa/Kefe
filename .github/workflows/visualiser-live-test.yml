name: Visualiser live verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-visualiser:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Wait for GitHub Pages deployment
        run: |
          MAX_ATTEMPTS=20
          ATTEMPT=0

          until [ $ATTEMPT -ge $MAX_ATTEMPTS ]; do
            if curl -fsSL https://tezzaaaaaa.github.io/Kefe/ > /dev/null; then
              echo "GitHub Pages is reachable"
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: GitHub Pages not ready yet"
            sleep 10
          done

          echo "GitHub Pages failed to become reachable in time"
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify live visualiser
        env:
          KEFE_URL: https://tezzaaaaaa.github.io/Kefe/
        run: |
          cat > verify-visualiser.mjs <<'EOF'
          import { chromium } from 'playwright';

          const url = process.env.KEFE_URL;
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });

          const errors = [];
          page.on('pageerror', error => errors.push('pageerror: ' + error.message));
          page.on('console', message => {
            if (message.type() === 'error') errors.push('console: ' + message.text());
          });

          let loaded = false;
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 30000 });
              if (response?.ok()) {
                loaded = true;
                break;
              }
            } catch {}
            await page.waitForTimeout(15000);
          }

          if (!loaded) throw new Error('GitHub Pages did not become reachable.');
          await page.waitForTimeout(3000);

          const visualiserTab = page.locator('.kefe-section[data-panel="visualiser"]');
          await visualiserTab.click();
          await page.locator('#visualiserPreset option').nth(1).waitFor({ state: 'attached', timeout: 15000 });
          await page.locator('#visualiserParameters').locator('input[type="range"]').first().waitFor({ state: 'attached', timeout: 15000 });
          await page.waitForTimeout(1000);

          const result = await page.evaluate(() => {
            const canvas = document.getElementById('kefeVisualiserCanvas');
            const panel = document.querySelector('[data-panel-view="visualiser"]');
            const preset = document.getElementById('visualiserPreset');
            const parameters = document.getElementById('visualiserParameters');

            if (!canvas) return { ok: false, reason: 'visualiser canvas missing' };
            if (!panel?.classList.contains('active')) return { ok: false, reason: 'visualiser panel did not activate' };

            const rect = canvas.getBoundingClientRect();
            const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
            if (!gl) return { ok: false, reason: 'WebGL context unavailable' };

            return {
              ok: true,
              width: rect.width,
              height: rect.height,
              presetCount: preset?.options.length ?? 0,
              parameterCount: parameters?.children.length ?? 0,
              rendererError: canvas.dataset.rendererError || null,
              rendererReady: canvas.dataset.rendererReady || null,
              rendererContext: canvas.dataset.rendererContext || 'active',
              diagnostic: typeof window.kefeVisualiserDiagnostics === 'function' ? window.kefeVisualiserDiagnostics() : null
            };
          });

          if (!result.ok) throw new Error(result.reason);
          if (result.width < 100 || result.height < 100) {
            throw new Error(`Visualiser canvas has invalid size: ${result.width}x${result.height}`);
          }
          if (result.presetCount < 2) {
            throw new Error(`Visualiser presets are not populated: ${result.presetCount}`);
          }
          if (result.parameterCount < 1) {
            throw new Error('Visualiser effect parameters were not populated.');
          }
          if (result.rendererError) {
            throw new Error('Visualiser renderer reported an initialization error.');
          }
          if (result.rendererReady !== 'true') {
            throw new Error('Visualiser renderer did not report ready.');
          }
          if (!result.diagnostic || result.diagnostic.drawCalls < 1 || result.diagnostic.bufferWidth < 100 || result.diagnostic.bufferHeight < 100) {
            throw new Error('Visualiser diagnostics show no active render output.');
          }

          const initialFrame = result.diagnostic.frame;
          await page.waitForTimeout(1000);
          const frameCheck = await page.evaluate(() => window.kefeVisualiserDiagnostics?.() || null);
          if (!frameCheck || frameCheck.frame <= initialFrame) {
            throw new Error('Visualiser animation frame is not advancing.');
          }

          const pixels = await page.evaluate(() => {
            const canvas = document.getElementById('kefeVisualiserCanvas');
            const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
            const sample = new Uint8Array(4);
            let nonBlack = 0;
            const points = [];
            for (let y = 0.1; y <= 0.9; y += 0.1) {
              for (let x = 0.1; x <= 0.9; x += 0.1) points.push([x, y]);
            }
            for (const [x, y] of points) {
              gl.readPixels(
                Math.floor(canvas.width * x),
                Math.floor(canvas.height * (1 - y)),
                1, 1,
                gl.RGBA, gl.UNSIGNED_BYTE, sample
              );
              if (sample[0] > 2 || sample[1] > 2 || sample[2] > 2) nonBlack++;
            }
            return { nonBlack, width: canvas.width, height: canvas.height };
          });

          if (pixels.nonBlack < 3) {
            throw new Error(`Visualiser canvas rendered no meaningful non-black output: ${pixels.nonBlack} samples.`);
          }

          const interaction = await page.evaluate(() => {
            const select = document.getElementById('visualiserPreset');
            const before = select.value;
            const next = Array.from(select.options).find(option => option.value !== before);
            if (!next) return { ok: false, reason: 'No alternate preset available.' };
            select.value = next.value;
            select.dispatchEvent(new Event('change', { bubbles: true }));
            const slider = document.querySelector('#visualiserParameters input[type="range"]');
            if (!slider) return { ok: false, reason: 'No parameter slider available.' };
            const oldValue = slider.value;
            slider.value = String(Number(slider.value) + Number(slider.step || 0.01));
            slider.dispatchEvent(new Event('input', { bubbles: true }));
            return {
              ok: select.value === next.value && slider.value !== oldValue,
              preset: select.value,
              parameterValue: slider.value
            };
          });
          if (!interaction.ok) throw new Error(interaction.reason || 'Visualiser controls did not respond.');

          if (errors.length) {
            throw new Error('Browser errors detected:\n' + errors.join('\n'));
          }

          console.log(JSON.stringify({ result, pixels }, null, 2));
          await browser.close();
          EOF

          node verify-visualiser.mjs
