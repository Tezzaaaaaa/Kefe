name: Fix wizard preview and export
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch wizard and export presentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ui/wizard.js')
          s=p.read_text()
          s=s.replace("lyric: ['intro', 'source', 'content', 'style', 'background', 'preview'],", "lyric: ['intro', 'source', 'content', 'style', 'background', 'preview', 'export'],")
          s=s.replace("visualiser: ['intro', 'source', 'style', 'background', 'preview'],", "visualiser: ['intro', 'source', 'style', 'background', 'preview', 'export'],")
          s=s.replace("captioned: ['intro', 'source', 'captions', 'style', 'background', 'preview'],", "captioned: ['intro', 'source', 'captions', 'style', 'background', 'preview', 'export'],")
          s=s.replace("custom: ['intro', 'source', 'content', 'style', 'background', 'preview']", "custom: ['intro', 'source', 'content', 'style', 'background', 'preview', 'export']")
          s=s.replace("const STEP_TITLES = { content: 'Add your content', captions: 'Create your captions', style: 'Choose your look', background: 'Choose your background' };", "const STEP_TITLES = { content: 'Add your content', captions: 'Create your captions', style: 'Choose your look', background: 'Choose your background', export: 'Export your video' };")
          s=s.replace("const STEP_LABELS = { intro: 'Format', source: 'Media', content: 'Content', captions: 'Captions', style: 'Style', background: 'Background', preview: 'Preview' };", "const STEP_LABELS = { intro: 'Format', source: 'Media', content: 'Content', captions: 'Captions', style: 'Style', background: 'Background', preview: 'Preview', export: 'Export' };")
          s=s.replace("if (step === 'background') return ['backgroundSection'];", "if (step === 'background') return ['backgroundSection'];\n        if (step === 'export') return ['exportSection'];")
          s=s.replace("const next = $('wizardNextBtn'); next.textContent = step === 'preview' ? 'Go to export' : 'Next';", "const next = $('wizardNextBtn'); next.textContent = step === 'export' ? 'Export' : 'Next';")
          old="""        $('wizardNextBtn').addEventListener('click', () => { const step = stepsFor()[wizard.index]; if (!nextEnabled(step)) return; if (step === 'preview') return finishWizard(); goTo(wizard.index + 1); });"""
          new="""        $('wizardNextBtn').addEventListener('click', () => { const step = stepsFor()[wizard.index]; if (!nextEnabled(step)) return; if (step === 'export') { finishWizard(); return; } goTo(wizard.index + 1); });"""
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('styles.css')
          s=p.read_text()
          old="body.wizard-mode .preview{position:fixed;bottom:0;left:0;right:0;top:auto;z-index:10;max-height:50vh;border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .25s var(--ease);overflow-y:auto;border-top:1px solid var(--line-strong)}body.wizard-mode .preview.preview-expanded{transform:translateY(0)}"
          new="body.wizard-mode .preview{position:fixed;bottom:0;left:0;right:0;top:auto;z-index:10;max-height:52vh;border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .25s var(--ease);overflow-y:auto;border-top:1px solid var(--line-strong)}body.wizard-mode .preview.preview-expanded,body.wizard-mode[data-wizard-step=content] .preview,body.wizard-mode[data-wizard-step=captions] .preview,body.wizard-mode[data-wizard-step=style] .preview,body.wizard-mode[data-wizard-step=background] .preview,body.wizard-mode[data-wizard-step=preview] .preview{transform:translateY(0)}"
          if old in s: s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/wizard.js styles.css
          git diff --cached --quiet && exit 0
          git commit -m 'Fix wizard preview and export flow'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-wizard-export.yml
          git add .github/workflows/fix-wizard-export.yml
          git commit -m 'Remove temporary wizard fix workflow'
          git push
