name: One-time KEFE motion effect integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[motion-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Integrate Rise Slide Drop Drift
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')
          app = root / 'app/app.js'
          index = root / 'index.html'
          wizard = root / 'app/ui/wizard/wizard-all-effects.js'

          s = app.read_text()
          if 'MOTION_LYRIC_EFFECTS_INTEGRATED' not in s:
              s = s.replace(
                  "        pulseGlowSize: 1.0,\n        titleCardEnabled: true,",
                  "        pulseGlowSize: 1.0,\n        // MOTION_LYRIC_EFFECTS_INTEGRATED — standalone lyric effects.\n        motionDistance: 0.12,\n        motionSoftness: 0.22,\n        motionStrength: 1,\n        titleCardEnabled: true,"
              )

              motion_funcs = r'''

/* ---------- Standalone motion lyric effects ---------- */
function motionEffectLine(lines, time) {
    const index = linaFindActiveLine(lines, time);
    return index >= 0 ? linaNormaliseLine(lines, index) : null;
}
function motionEffectProgress(line, time) {
    if (!line) return 0;
    const duration = Math.max(0.24, Number(line.endTime) - Number(line.time));
    return linaSmoother(linaClamp((time - Number(line.time)) / Math.min(0.42, duration * 0.42)));
}
function drawMotionText(ctx, text, x, y, size, alpha, style, transform) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.transform(transform.a, transform.b, transform.c, transform.d, transform.e, transform.f);
    ctx.font = `800 ${size}px "Open Sans",Arial,sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = style.textColor || '#FFFFFF';
    ctx.shadowColor = 'rgba(0,0,0,0.48)';
    ctx.shadowBlur = Math.max(2, size * 0.08);
    ctx.fillText(text, 0, 0);
    ctx.restore();
}
function drawRiseEffect(ctx, w, h, style, lines, time) {
    const line = motionEffectLine(lines, time); if (!line) return;
    const text = String(line.text || '').trim(); if (!text) return;
    const size = fitCentredEffectText(ctx, text, style.fontSize, w * 0.84, 800);
    const p = motionEffectProgress(line, time);
    const y = h * 0.47;
    const distance = Math.max(12, size * (Number(style.motionDistance) || 0.12));
    drawMotionText(ctx, text, w / 2, y + distance * (1 - p), size, 0.25 + 0.75 * p, style, {a:1,b:0,c:0,d:1,e:0,f:0});
    ctx.save();
    ctx.globalAlpha = 0.16 * (1 - p);
    ctx.filter = `blur(${Math.max(2, size * 0.07)}px)`;
    ctx.font = `800 ${size}px "Open Sans",Arial,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = style.textColor || '#FFFFFF';
    ctx.fillText(text, w / 2, y + distance * (1 - p) + distance * 0.55);
    ctx.restore();
}
function drawSlideEffect(ctx, w, h, style, lines, time) {
    const line = motionEffectLine(lines, time); if (!line) return;
    const text = String(line.text || '').trim(); if (!text) return;
    const size = fitCentredEffectText(ctx, text, style.fontSize, w * 0.84, 800);
    const p = motionEffectProgress(line, time);
    const distance = Math.max(18, size * (Number(style.motionDistance) || 0.12) * 1.35);
    drawMotionText(ctx, text, w / 2 - distance * (1 - p), h * 0.47, size, 0.25 + 0.75 * p, style, {a:1,b:0,c:0,d:1,e:0,f:0});
    ctx.save();
    ctx.globalAlpha = 0.13 * (1 - p);
    ctx.filter = `blur(${Math.max(2, size * 0.055)}px)`;
    ctx.font = `800 ${size}px "Open Sans",Arial,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = style.textColor || '#FFFFFF';
    ctx.fillText(text, w / 2 - distance * (1 - p) - distance * 0.55, h * 0.47);
    ctx.restore();
}
function drawDropEffect(ctx, w, h, style, lines, time) {
    const line = motionEffectLine(lines, time); if (!line) return;
    const text = String(line.text || '').trim(); if (!text) return;
    const size = fitCentredEffectText(ctx, text, style.fontSize, w * 0.84, 800);
    const p = motionEffectProgress(line, time);
    const distance = Math.max(14, size * (Number(style.motionDistance) || 0.12) * 1.15);
    drawMotionText(ctx, text, w / 2, h * 0.47 - distance * (1 - p), size, 0.25 + 0.75 * p, style, {a:1,b:0,c:0,d:1,e:0,f:0});
    ctx.save();
    ctx.globalAlpha = 0.14 * (1 - p);
    ctx.filter = `blur(${Math.max(2, size * 0.065)}px)`;
    ctx.font = `800 ${size}px "Open Sans",Arial,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = style.textColor || '#FFFFFF';
    ctx.fillText(text, w / 2, h * 0.47 - distance * (1 - p) - distance * 0.5);
    ctx.restore();
}
function drawDriftEffect(ctx, w, h, style, lines, time) {
    const line = motionEffectLine(lines, time); if (!line) return;
    const text = String(line.text || '').trim(); if (!text) return;
    const size = fitCentredEffectText(ctx, text, style.fontSize, w * 0.84, 800);
    const p = motionEffectProgress(line, time);
    const drift = Math.max(14, size * (Number(style.motionDistance) || 0.12));
    const angle = (1 - p) * -0.035;
    drawMotionText(ctx, text, w / 2 + drift * (1 - p), h * 0.47 - drift * 0.35 * (1 - p), size, 0.25 + 0.75 * p, style, {a:Math.cos(angle),b:Math.sin(angle),c:-Math.sin(angle),d:Math.cos(angle),e:0,f:0});
    ctx.save();
    ctx.globalAlpha = 0.12 * (1 - p);
    ctx.filter = `blur(${Math.max(2, size * 0.06)}px)`;
    ctx.font = `800 ${size}px "Open Sans",Arial,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = style.textColor || '#FFFFFF';
    ctx.fillText(text, w / 2 + drift * (1 - p) + drift * 0.55, h * 0.47 - drift * 0.35 * (1 - p));
    ctx.restore();
}
'''
              s = s.replace('\nfunction renderLyricsEffect(ctx, w, h, style, lines, time) {', motion_funcs + '\nfunction renderLyricsEffect(ctx, w, h, style, lines, time) {')
              s = s.replace(
                  '        case "pulse": drawPulseEffect(ctx, w, h, style, lines, time); break;\n',
                  '        case "pulse": drawPulseEffect(ctx, w, h, style, lines, time); break;\n        case "rise": drawRiseEffect(ctx, w, h, style, lines, time); break;\n        case "slide": drawSlideEffect(ctx, w, h, style, lines, time); break;\n        case "drop": drawDropEffect(ctx, w, h, style, lines, time); break;\n        case "drift": drawDriftEffect(ctx, w, h, style, lines, time); break;\n'
              )
              s = s.replace(
                  'const EFFECT_LABELS = {\n',
                  'const EFFECT_LABELS = {\n    rise: "Rise — lyrics rise smoothly into focus",\n    slide: "Slide — lyrics glide in horizontally",\n    drop: "Drop — lyrics descend smoothly into focus",\n    drift: "Drift — lyrics float in with a subtle diagonal drift",\n'
              )
              s = s.replace(
                  'const TITLECARD_DESIGN_FOR_EFFECT = { apple:',
                  "const TITLECARD_DESIGN_FOR_EFFECT = { rise: 'minimal', slide: 'minimal', drop: 'minimal', drift: 'minimal', apple:"
              )
              app.write_text(s)

          auto = root / 'app/core/auto-create.js'
          a = auto.read_text()
          a = a.replace(
              "const EFFECTS = new Set(['apple','brat','eternal','aurora','pulse','typewriter','instagram','fadeup']);",
              "const EFFECTS = new Set(['rise','slide','drop','drift','apple','brat','eternal','aurora','pulse','typewriter','instagram','fadeup']);"
          )
          auto.write_text(a)

          h = index.read_text()
          motion_buttons = (
              '<button type="button" class="segmented-btn" data-effect="rise">Rise</button>'
              '<button type="button" class="segmented-btn" data-effect="slide">Slide</button>'
              '<button type="button" class="segmented-btn" data-effect="drop">Drop</button>'
              '<button type="button" class="segmented-btn" data-effect="drift">Drift</button>'
          )
          if 'data-effect="rise"' not in h:
              h = h.replace('<div class="effect-buttons"><button type="button" class="segmented-btn" data-effect="apple">Apple</button>', '<div class="effect-buttons">' + motion_buttons + '<button type="button" class="segmented-btn" data-effect="apple">Apple</button>')
          index.write_text(h)

          w = wizard.read_text()
          w = w.replace(
              "    const line = document.createElement('span');\n    line.className = 'wizard-effect-demo-line';\n    line.textContent = 'LYRICS';\n    demo.appendChild(line);",
              "    if (motion.has(name)) {\n      const image = document.createElement('img');\n      image.className = 'wizard-effect-thumbnail';\n      image.src = `./assets/effects/${name}.svg`;\n      image.alt = '';\n      image.setAttribute('aria-hidden', 'true');\n      demo.appendChild(image);\n    } else {\n      const line = document.createElement('span');\n      line.className = 'wizard-effect-demo-line';\n      line.textContent = 'LYRICS';\n      demo.appendChild(line);\n    }"
          )
          thumb_rules = "    .wizard-all-effect-grid .wizard-effect-thumbnail { width:100%; height:100%; display:block; object-fit:cover; position:relative; z-index:1; }\n"
          marker = '    .wizard-all-effect-grid .wizard-effect-choice[data-wizard-effect="rise"] .wizard-effect-demo {'
          if thumb_rules.strip() not in w:
              w = w.replace(marker, thumb_rules + marker)
          wizard.write_text(w)

          thumbs = {
            'rise': 'M50 76 C50 58 50 44 50 24',
            'slide': 'M20 50 C40 50 60 50 82 50',
            'drop': 'M50 24 C50 42 50 58 50 76',
            'drift': 'M22 74 C38 62 58 42 78 26',
          }
          for name, path in thumbs.items():
              svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#151515"/><stop offset="0.5" stop-color="#666"/><stop offset="1" stop-color="#eee"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><path d="{path}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".95"/><path d="{path}" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".16"/></svg>'''
              (root / f'assets/effects/{name}.svg').write_text(svg)

          assert all(f'data-effect="{n}"' in h for n in ['rise','slide','drop','drift'])
          assert h.index('data-effect="rise"') < h.index('data-effect="apple"')
          assert all(f'case "{n}": draw{n.title()}Effect' in s for n in ['rise','slide','drop','drift'])
          assert 'MOTION_LYRIC_EFFECTS_INTEGRATED' in s
          assert all(f'./assets/effects/{n}.svg' in w for n in ['rise','slide','drop','drift'])

          (root / '.github/workflows/fix-motion-effects.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/app.js app/core/auto-create.js app/ui/wizard/wizard-all-effects.js index.html assets/effects .github/workflows/fix-motion-effects.yml
          git commit -m "Fix lyric motion effects integration [motion-fix]"
          git push
