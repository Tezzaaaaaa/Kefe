name: Apply KEFE live preview
on:
  push:
    paths:
      - 'ui/live-preview.js'
      - 'ui/live-preview.css'
      - '.github/workflows/apply-live-preview.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire live preview and wizard visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ui/wizard.js')
          s = p.read_text()
          old = "        if (step === 'preview' && previewEl) { previewEl.classList.remove('preview-collapsed'); previewEl.classList.add('preview-expanded'); }"
          new = "        if (previewEl) { const showLivePreview = ['content','captions','style','background','preview'].includes(step); previewEl.classList.toggle('preview-expanded', showLivePreview); previewEl.classList.toggle('preview-collapsed', !showLivePreview); }"
          if old not in s:
              raise SystemExit('wizard preview visibility anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('.github/workflows/github-pages.yml')
          s = p.read_text()
          s = s.replace('<link rel=\"stylesheet\" href=\"./ui/wizard-mobile.css?v=${GITHUB_SHA}\"><link rel=\"stylesheet\" href=\"./ui/kefe-product-polish.css?v=${GITHUB_SHA}\">', '<link rel=\"stylesheet\" href=\"./ui/wizard-mobile.css?v=${GITHUB_SHA}\"><link rel=\"stylesheet\" href=\"./ui/kefe-product-polish.css?v=${GITHUB_SHA}\"><link rel=\"stylesheet\" href=\"./ui/live-preview.css?v=${GITHUB_SHA}\">')
          s = s.replace('<script src=\"./ui/kefe-product-polish.js?v=${GITHUB_SHA}\" defer></script>', '<script src=\"./ui/kefe-product-polish.js?v=${GITHUB_SHA}\" defer></script><script src=\"./ui/live-preview.js?v=${GITHUB_SHA}\" defer></script>')
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/wizard.js .github/workflows/github-pages.yml
          git commit -m 'Make live preview central to editing flow' || true
          rm -f .github/workflows/apply-live-preview.yml
          git add .github/workflows/apply-live-preview.yml
          git commit -m 'Remove temporary live preview workflow' || true
          git push
