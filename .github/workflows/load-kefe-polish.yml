name: Load KEFE polish layers
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire live preview and product polish
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if './ui/live-preview.css' not in s:
              s = s.replace('    <link rel="stylesheet" href="./ui/dynamic-motion.css">', '    <link rel="stylesheet" href="./ui/dynamic-motion.css">\n    <link rel="stylesheet" href="./ui/live-preview.css">')
          if './ui/live-preview.js' not in s:
              s = s.replace('</body>', '    <script src="./ui/live-preview.js"></script>\n    <script src="./ui/kefe-product-polish.js"></script>\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Wire KEFE live preview polish layers'
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/load-kefe-polish.yml
          git add .github/workflows/load-kefe-polish.yml
          git diff --cached --quiet || git commit -m 'Remove temporary polish wiring workflow'
          git push
