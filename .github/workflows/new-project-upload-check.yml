name: New project upload verification

on:
  push:
    branches: [main]
    paths:
      - "apps/web/index.html"
      - "apps/web/editor.html"
      - "apps/web/workspace.html"
      - "apps/web/app/ui/structure.js"
      - "apps/web/app/ui/workspace-shell.css"
      - ".github/workflows/new-project-upload-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-new-project-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Wait for the changed editor to publish
        run: |
          live_url='https://tezzaaaaaa.github.io/Kefe/apps/web/editor.html'
          expected_marker='media-carousel.js?v=local-upload-search-20261012-2'
          for attempt in $(seq 1 48); do
            if curl --fail --silent "$live_url" -o /tmp/kefe-live-index.html 2>/dev/null && grep -Fq "$expected_marker" /tmp/kefe-live-index.html && grep -Fq 'app/editor.js?v=async-track-focus-20261014-2' /tmp/kefe-live-index.html && grep -Fq 'app/visualiser/gradient.js?v=site-audit-20261014-1' /tmp/kefe-live-index.html && grep -Fq 'app/ui/styles.css?v=layout-alignment-20261015-2' /tmp/kefe-live-index.html && grep -Fq 'workspace-shell.css?v=layout-alignment-20261015-2' /tmp/kefe-live-index.html; then
              echo "Published editor contains current Media upload code: $expected_marker"
              exit 0
            fi
            sleep 5
          done
          echo "Published GitHub Pages editor did not expose $expected_marker in time." >&2
          exit 1

      - name: Test new-project upload locally and on GitHub Pages
        run: |
          cat > /tmp/kefe-new-project-upload.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');

          function makeTestWav() {
            const sampleRate = 8000, samples = sampleRate;
            const buffer = Buffer.alloc(44 + samples * 2);
            buffer.write('RIFF', 0); buffer.writeUInt32LE(36 + samples * 2, 4); buffer.write('WAVE', 8);
            buffer.write('fmt ', 12); buffer.writeUInt32LE(16, 16); buffer.writeUInt16LE(1, 20);
            buffer.writeUInt16LE(1, 22); buffer.writeUInt32LE(sampleRate, 24);
            buffer.writeUInt32LE(sampleRate * 2, 28); buffer.writeUInt16LE(2, 32);
            buffer.writeUInt16LE(16, 34); buffer.write('data', 36); buffer.writeUInt32LE(samples * 2, 40);
            return buffer;
          }

          async function verify(browser, baseUrl, label) {
            const page = await browser.newPage({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true
            });
            page.setDefaultTimeout(15000);
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            try {
              await page.goto(baseUrl + '/editor.html', { waitUntil: 'domcontentloaded' });
              await page.locator('.kefe-panel[data-panel-view="media"].active').waitFor();
              const accept = await page.locator('#mediaInput').getAttribute('accept');
              assert.ok(accept && accept.includes('audio/*') && accept.includes('video/*'), label + ': media input must accept audio and video files');
              const chooserPromise = page.waitForEvent('filechooser');
              await page.locator('#kefeUploadZone').click();
              const chooser = await chooserPromise;

              const uploadPosition = await page.locator('#kefeUploadZone').evaluate(el => {
                const rect = el.getBoundingClientRect();
                const panels = el.closest('.kefe-panels');
                const panelRect = panels.getBoundingClientRect();
                const details = el.closest('.kefe-step-body')?.querySelector('.kefe-song-details');
                return { top: rect.top, bottom: rect.bottom, panelTop: panelRect.top, panelBottom: panelRect.bottom, scrollTop: panels.scrollTop, uploadBeforeDetails: !!details && !!(el.compareDocumentPosition(details) & Node.DOCUMENT_POSITION_FOLLOWING) };
              });
              assert.equal(uploadPosition.scrollTop, 0, label + ': media panel scroll must reset to the beginning');
              assert.equal(uploadPosition.uploadBeforeDetails, true, label + ': audio/video upload must appear before song details');
              assert.ok(uploadPosition.top >= uploadPosition.panelTop - 5 && uploadPosition.top < uploadPosition.panelTop + 140,
                label + ': upload zone should be at the beginning of the media panel; got top=' + uploadPosition.top + ', panel top=' + uploadPosition.panelTop);
              assert.ok(uploadPosition.bottom > uploadPosition.panelTop && uploadPosition.top < uploadPosition.panelBottom,
                label + ': upload zone should be visible inside the media panel');

              await chooser.setFiles({
                name: 'KEFE New Project Upload Verification.wav',
                mimeType: 'audio/wav',
                buffer: makeTestWav()
              });
              await page.waitForFunction(() =>
                document.getElementById('songTitle')?.value === 'KEFE New Project Upload Verification' &&
                !document.querySelector('.kefe-stage')?.classList.contains('is-empty'),
                null,
                { timeout: 10000 }
              );
              await page.waitForFunction(() => {
                const audio = document.getElementById('kefeAudio');
                return audio && Number.isFinite(audio.duration) && audio.duration > 0;
              }, null, { timeout: 10000 });

              await page.evaluate(() => {
                document.getElementById('songTitle').value = 'KEFE Export Verification';
                document.getElementById('songArtist').value = 'KEFE Test Artist';
                window.kefeLyrics.set([{ text: 'KEFE EXPORT VERIFICATION', time: 0, endTime: 1 }], 'browser-export-verification');
                window.kefeLyrics.seek(0.1);
              });
              await page.locator('.kefe-sidebar [data-shell-panel="visualiser"]').click();
              await page.locator('.kefe-panel[data-panel-view="visualiser"].active').waitFor();
              const visualiserPower = page.locator('.kefe-visualiser-panel-head .kefe-switch');
              try {
                await visualiserPower.waitFor({ state: 'visible', timeout: 5000 });
                if (await visualiserPower.getAttribute('aria-checked') !== 'true') await visualiserPower.click();
              } catch (error) {
                const diagnostics = await page.evaluate(() => {
                  const panel = document.querySelector('.kefe-panel[data-panel-view="visualiser"]');
                  const head = panel?.querySelector('.kefe-visualiser-panel-head');
                  const button = head?.querySelector('.kefe-switch');
                  const describe = el => {
                    if (!el) return null;
                    const style = getComputedStyle(el), rect = el.getBoundingClientRect();
                    return { tag: el.tagName, className: el.className, hidden: el.hidden, display: style.display, visibility: style.visibility, opacity: style.opacity, width: rect.width, height: rect.height, ariaLabel: el.getAttribute('aria-label'), ariaChecked: el.getAttribute('aria-checked'), parentClass: el.parentElement?.className };
                  };
                  return { panel: describe(panel), head: describe(head), button: describe(button), tabs: Array.from(document.querySelectorAll('.kefe-vis-tabs,.kefe-vis-option')).map(describe), panelHtml: panel?.outerHTML.slice(0, 3000) };
                });
                console.error('Visualiser power-toggle interaction diagnostics:', JSON.stringify(diagnostics));
                throw error;
              }
              await page.waitForFunction(() => getComputedStyle(document.getElementById('kefeVisualiserCanvas')).visibility === 'visible', null, { timeout: 10000 });

              await page.locator('.kefe-sidebar [data-shell-panel="export"]').click();
              await page.locator('.kefe-panel[data-panel-view="export"].active').waitFor();
              await page.locator('#exportFormat').selectOption('webm');
              await page.locator('#exportResolution').selectOption('720');
              await page.evaluate(() => {
                const NativeRecorder = window.MediaRecorder;
                window.__kefeExportTrackAudit = null;
                window.MediaRecorder = class extends NativeRecorder {
                  constructor(stream, options) {
                    window.__kefeExportTrackAudit = {
                      audioTracks: stream.getAudioTracks().length,
                      videoTracks: stream.getVideoTracks().length,
                      mimeType: options?.mimeType || ''
                    };
                    super(stream, options);
                  }
                };
              });
              const downloadPromise = page.waitForEvent('download', { timeout: 30000 });
              await page.locator('#exportButton').click();
              const download = await downloadPromise;
              await page.waitForFunction(() => document.getElementById('exportStatus')?.textContent.startsWith('Export complete'), null, { timeout: 30000 });
              const exportAudit = await page.evaluate(() => ({
                status: document.getElementById('exportStatus')?.textContent || '',
                recorder: window.__kefeExportTrackAudit
              }));
              const downloadPath = await download.path();
              assert.ok(downloadPath, label + ': exported video download should have a readable file');
              const exported = fs.readFileSync(downloadPath);
              assert.ok(download.suggestedFilename().endsWith('.webm'), label + ': export should produce a WebM file; got ' + download.suggestedFilename());
              assert.ok(exported.length > 1000, label + ': exported video must not be empty');
              assert.deepEqual([...exported.subarray(0, 4)], [0x1a, 0x45, 0xdf, 0xa3], label + ': exported WebM must have a valid EBML header');
              assert.ok(exportAudit.recorder?.videoTracks >= 1, label + ': export recorder must receive a video track');
              assert.ok(exportAudit.recorder?.audioTracks >= 1, label + ': export recorder must receive an audio track');
              assert.ok(exportAudit.status.startsWith('Export complete'), label + ': export status must report completion');
              await page.locator('#kefeExportClose').waitFor({ state: 'visible' });
              await page.locator('#kefeExportClose').click();
              assert.deepEqual(errors, [], label + ': browser runtime errors: ' + errors.join('; '));
              console.log(JSON.stringify({
                target: label,
                result: 'PASS',
                fileChooserOpened: true,
                mediaTabActive: true,
                uploadZonePosition: uploadPosition,
                selectedFile: 'KEFE New Project Upload Verification.wav',
                export: {
                  result: 'PASS',
                  filename: download.suggestedFilename(),
                  bytes: exported.length,
                  mimeType: exportAudit.recorder.mimeType,
                  audioTracks: exportAudit.recorder.audioTracks,
                  videoTracks: exportAudit.recorder.videoTracks,
                  status: exportAudit.status
                },
                runtimeErrors: errors
              }));
            } finally {
              await page.close();
            }
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              await verify(browser, 'http://127.0.0.1:4173', 'local source');
              await verify(browser, 'https://tezzaaaaaa.github.io/Kefe/apps/web', 'published GitHub Pages');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          python3 -m http.server 4173 --directory apps/web > /tmp/kefe-new-project-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:4173/index.html -o /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/index.html -o /dev/null
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/kefe-new-project-upload.cjs
