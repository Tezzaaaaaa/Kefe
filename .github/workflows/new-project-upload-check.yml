name: New project upload verification

on:
  push:
    branches: [main]
    paths:
      - "artifacts/kefe-visualiser/public/legacy/app/media-library.js"
      - "artifacts/kefe-visualiser/public/legacy/index.html"
      - ".github/workflows/new-project-upload-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-new-project-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Wait for the changed editor to publish
        run: |
          live_url='https://tezzaaaaaa.github.io/Kefe/artifacts/kefe-visualiser/public/legacy/index.html'
          expected_marker='media-carousel.js?v=local-upload-search-20261012-2'
          for attempt in $(seq 1 48); do
            if curl --fail --silent "$live_url" -o /tmp/kefe-live-index.html 2>/dev/null && grep -Fq "$expected_marker" /tmp/kefe-live-index.html && grep -Fq 'media-library.js?v=20261012-4' /tmp/kefe-live-index.html; then
              echo "Published editor contains cache-busted library script: $expected_marker"
              exit 0
            fi
            sleep 5
          done
          echo "Published GitHub Pages editor did not expose $expected_marker in time." >&2
          exit 1

      - name: Test new-project upload locally and on GitHub Pages
        run: |
          cat > /tmp/kefe-new-project-upload.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          function makeTestWav() {
            const sampleRate = 8000, samples = sampleRate;
            const buffer = Buffer.alloc(44 + samples * 2);
            buffer.write('RIFF', 0); buffer.writeUInt32LE(36 + samples * 2, 4); buffer.write('WAVE', 8);
            buffer.write('fmt ', 12); buffer.writeUInt32LE(16, 16); buffer.writeUInt16LE(1, 20);
            buffer.writeUInt16LE(1, 22); buffer.writeUInt32LE(sampleRate, 24);
            buffer.writeUInt32LE(sampleRate * 2, 28); buffer.writeUInt16LE(2, 32);
            buffer.writeUInt16LE(16, 34); buffer.write('data', 36); buffer.writeUInt32LE(samples * 2, 40);
            return buffer;
          }

          async function verify(browser, baseUrl, label) {
            const page = await browser.newPage({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true
            });
            page.setDefaultTimeout(15000);
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            try {
              await page.goto(baseUrl + '/index.html', { waitUntil: 'domcontentloaded' });
              await page.locator('.kefe-section[data-panel="media"]').waitFor();
              const accept = await page.locator('#mediaInput').getAttribute('accept');
              assert.ok(accept && accept.includes('audio/*') && accept.includes('video/*'), label + ': media input must accept audio and video files');
              await page.locator('button[data-top-panel="media"]').click();
              await page.locator('.kefe-library-shell:not([hidden])').waitFor();

              const chooserPromise = page.waitForEvent('filechooser');
              await page.locator('.kefe-library-new').click();
              const chooser = await chooserPromise;

              await page.locator('.kefe-library-shell').waitFor({ state: 'hidden' });
              await page.locator('.kefe-section[data-panel="media"].active').waitFor();
              await page.locator('.kefe-panel[data-panel-view="media"].active').waitFor();

              const uploadPosition = await page.locator('#kefeUploadZone').evaluate(el => {
                const rect = el.getBoundingClientRect();
                const panels = el.closest('.kefe-panels');
                const panelRect = panels.getBoundingClientRect();
                const details = el.closest('.kefe-step-body')?.querySelector('.kefe-song-details');
                return { top: rect.top, bottom: rect.bottom, panelTop: panelRect.top, panelBottom: panelRect.bottom, scrollTop: panels.scrollTop, uploadBeforeDetails: !!details && !!(el.compareDocumentPosition(details) & Node.DOCUMENT_POSITION_FOLLOWING) };
              });
              assert.equal(uploadPosition.scrollTop, 0, label + ': media panel scroll must reset to the beginning');
              assert.equal(uploadPosition.uploadBeforeDetails, true, label + ': audio/video upload must appear before song details');
              assert.ok(uploadPosition.top >= uploadPosition.panelTop - 5 && uploadPosition.top < uploadPosition.panelTop + 140,
                label + ': upload zone should be at the beginning of the media panel; got top=' + uploadPosition.top + ', panel top=' + uploadPosition.panelTop);
              assert.ok(uploadPosition.bottom > uploadPosition.panelTop && uploadPosition.top < uploadPosition.panelBottom,
                label + ': upload zone should be visible inside the media panel');

              await chooser.setFiles({
                name: 'KEFE New Project Upload Verification.wav',
                mimeType: 'audio/wav',
                buffer: makeTestWav()
              });
              await page.waitForFunction(() => {
                const input = document.getElementById('mediaInput');
                return input && input.files && input.files.length === 1 &&
                  input.files[0].name === 'KEFE New Project Upload Verification.wav';
              });
              assert.deepEqual(errors, [], label + ': browser runtime errors: ' + errors.join('; '));
              console.log(JSON.stringify({
                target: label,
                result: 'PASS',
                fileChooserOpened: true,
                mediaTabActive: true,
                uploadZonePosition: uploadPosition,
                selectedFile: 'KEFE New Project Upload Verification.wav',
                runtimeErrors: errors
              }));
            } finally {
              await page.close();
            }
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              await verify(browser, 'http://127.0.0.1:4173', 'local source');
              await verify(browser, 'https://tezzaaaaaa.github.io/Kefe/artifacts/kefe-visualiser/public/legacy', 'published GitHub Pages');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          python3 -m http.server 4173 --directory artifacts/kefe-visualiser/public/legacy > /tmp/kefe-new-project-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:4173/index.html -o /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/index.html -o /dev/null
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/kefe-new-project-upload.cjs
