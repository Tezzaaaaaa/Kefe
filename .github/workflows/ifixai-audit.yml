name: KEFE iFixAi agent audit

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "HTTP agent endpoint exposing /v1/chat/completions"
        required: true
        type: string
      model:
        description: "Agent model identifier"
        required: true
        type: string
      suite:
        description: "iFixAi suite"
        required: true
        default: strategic
        type: choice
        options:
          - smoke
          - strategic
          - core
          - all

permissions:
  contents: read

concurrency:
  group: kefe-ifixai-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit KEFE engineering agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IFIXAI_SUT_API_KEY: ${{ secrets.IFIXAI_SUT_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.IFIXAI_JUDGE_API_KEY }}
      IFIXAI_TELEMETRY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install iFixAi
        run: python -m pip install "ifixai[openai]==3.4.0"

      - name: Validate KEFE fixture
        run: ifixai validate ifixai/kefe-agent.yaml

      - name: Run independent audit
        run: >-
          ifixai run
          --provider http
          --endpoint "${{ inputs.endpoint }}"
          --api-key "$IFIXAI_SUT_API_KEY"
          --model "${{ inputs.model }}"
          --fixture ifixai/kefe-agent.yaml
          --suite "${{ inputs.suite }}"
          --judge-provider openai
          --judge-api-key "$OPENAI_API_KEY"
          --judge-model gpt-5.4-mini
          --no-telemetry

      - name: Upload iFixAi results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kefe-ifixai-audit
          path: ifixai-results/
          if-no-files-found: warn
          retention-days: 14
