name: Fix caption audio input

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'run caption audio fix') && !contains(github.event.head_commit.message, 'normalize video audio for caption transcription') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch caption generator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ui/caption-generator.js')
          s = p.read_text()
          old = """    registry.register({\n        id: 'server',\n        label: 'KEFE server API',\n        async transcribe(ctx) {\n            const { file, onStatus, onProgress } = ctx;\n            onStatus('Sending audio to the transcription server…');\n            onProgress(25);\n            const res = await fetch('/api/transcribe', { method: 'POST', headers: { 'Content-Type': file.type || 'application/octet-stream' }, body: file });\n"""
          new = """    function audioToWavBlob(audio) {\n        const samples = audio?.float32;\n        if (!samples || !samples.length) throw new Error('Could not prepare the audio track for transcription.');\n        const rate = 16000;\n        const buffer = new ArrayBuffer(44 + samples.length * 2);\n        const view = new DataView(buffer);\n        const write = (offset, text) => { for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i)); };\n        write(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true); write(8, 'WAVE');\n        write(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);\n        view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);\n        write(36, 'data'); view.setUint32(40, samples.length * 2, true);\n        for (let i = 0; i < samples.length; i++) { const v = Math.max(-1, Math.min(1, samples[i])); view.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true); }\n        return new Blob([buffer], { type: 'audio/wav' });\n    }\n\n    registry.register({\n        id: 'server',\n        label: 'KEFE server API',\n        async transcribe(ctx) {\n            const { onStatus, onProgress, audio } = ctx;\n            const file = audioToWavBlob(audio);\n            onStatus('Sending the extracted audio track to the transcription server…');\n            onProgress(25);\n            const res = await fetch('/api/transcribe', { method: 'POST', headers: { 'Content-Type': 'audio/wav' }, body: file });\n"""
          if old not in s:
              raise SystemExit('Expected caption server provider block was not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Check JavaScript
        run: node --check ui/caption-generator.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui/caption-generator.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: normalize video audio for caption transcription'
          git push
