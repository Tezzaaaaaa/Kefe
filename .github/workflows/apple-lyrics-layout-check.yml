name: Apple lyric layout browser verification

concurrency:
  group: kefe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "apps/web/app/editor.js"
      - "apps/web/app/effects/lyric-apple.js"
      - "apps/web/editor.html"
      - "apps/web/app/ui/structure.js"
      - "apps/web/app/ui/workspace-shell.css"
      - ".github/workflows/apple-lyrics-layout-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-lyrics-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Wait for the updated lyric scripts to publish
        run: |
          live_url='https://tezzaaaaaa.github.io/Kefe/apps/web/editor.html'
          expected_marker=$(grep -o 'app/effects/lyric-apple.js?v=[^\"]*' apps/web/editor.html | head -n 1)
          if [ -z "$expected_marker" ]; then echo 'Could not determine the expected Apple lyrics asset marker.' >&2; exit 1; fi
          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error "$live_url" -o /tmp/kefe-live-index.html 2>/dev/null && grep -Fq "$expected_marker" /tmp/kefe-live-index.html; then
              echo "Updated Apple lyric scripts are published: $expected_marker"
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages did not publish the updated Apple lyric scripts in time." >&2
          exit 1

      - name: Test lyric layout across aspect ratios and fullscreen locally and live
        run: |
          cat > /tmp/kefe-apple-layout-check.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          async function verify(browser, baseUrl, label) {
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
            page.setDefaultTimeout(15000);
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.addInitScript(() => {
              const originalAddStop = CanvasGradient.prototype.addColorStop;
              CanvasGradient.prototype.addColorStop = function (offset, color) {
                (this.__kefeStops = this.__kefeStops || []).push(String(color));
                return originalAddStop.call(this, offset, color);
              };
              const original = CanvasRenderingContext2D.prototype.fillText;
              CanvasRenderingContext2D.prototype.fillText = function (text, ...args) {
                if (window.__kefeLayoutAudit) {
                  const canvas = this.canvas;
                  window.__kefeLayoutAudit.calls.push({
                    text: String(text),
                    fillStyle: String(this.fillStyle),
                    stops: (this.fillStyle && typeof this.fillStyle === 'object' && this.fillStyle.__kefeStops) ? this.fillStyle.__kefeStops.slice() : null,
                    id: canvas.id,
                    width: canvas.width,
                    height: canvas.height,
                    x: Number(args[0]),
                    y: Number(args[1])
                  });
                }
                return original.call(this, text, ...args);
              };
            });
            try {
              await page.goto(baseUrl + '/editor.html', { waitUntil: 'domcontentloaded' });
              await page.locator('#kefeAspect').waitFor();
              const prepared = await page.evaluate(async () => {
                await document.fonts.ready;
                const ctx = document.createElement('canvas').getContext('2d');
                // Match drawAppleEffect's actual landscape typography and right-column width.
                const fontSize = 1080 * (12.6 / 216.4);
                ctx.font = '700 ' + fontSize + 'px "SF Pro Display","SF Pro Text","Inter Tight",system-ui,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif';
                const oldWidth = 1920 * 0.4048;
                const newWidth = 1920 * (186 / 384);
                const words = ['WE', 'KEEP', 'MOVING', 'ON', 'A', 'LONG', 'ROAD', 'TO', 'THE', 'OPEN', 'SKY', 'WHERE', 'EVERY', 'MOMENT', 'FEELS', 'ALIVE'];
                let fitPhrase = '';
                let measuredWidth = 0;
                for (let start = 0; start < words.length; start++) {
                  for (let end = start + 1; end <= words.length; end++) {
                    const candidate = words.slice(start, end).join(' ');
                    const width = ctx.measureText(candidate).width;
                    if (width > oldWidth && width <= newWidth && width > measuredWidth) {
                      fitPhrase = candidate;
                      measuredWidth = width;
                    }
                  }
                }
                return { fitPhrase, oldWidth, newWidth, measuredWidth };
              });
              assert.ok(prepared.fitPhrase, label + ': could not find a lyric line that fits the widened landscape area but not the old one');
              assert.ok(prepared.measuredWidth > prepared.oldWidth && prepared.measuredWidth <= prepared.newWidth,
                label + ': landscape regression phrase must exercise the added width');

              const results = [];
              for (const aspect of ['16:9', '1:1', '9:16']) {
                await page.locator('#kefeAspect').selectOption(aspect);
                await page.evaluate(async ({ phrase }) => {
                  document.getElementById('songTitle').value = 'KEFE LAYOUT AUDIT';
                  document.getElementById('songArtist').value = 'Test Artist';
                  document.getElementById('songAlbum').value = 'Test Album';
                  window.__kefeLayoutAudit = { calls: [] };
                  window.kefeLyrics.set([{ text: phrase, time: 0, endTime: 5 }], 'layout-audit');
                  window.kefeLyrics.seek(0);
                  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                }, { phrase: aspect === '16:9' ? prepared.fitPhrase : 'A lyric line for aspect ratio verification' });
                const rendered = await page.evaluate(() => {
                  const canvas = document.getElementById('kefeCanvas');
                  const stage = document.querySelector('.kefe-stage');
                  const calls = window.__kefeLayoutAudit.calls;
                  return {
                    canvas: { width: canvas.width, height: canvas.height },
                    stage: { width: stage.getBoundingClientRect().width, height: stage.getBoundingClientRect().height },
                    titleDrawn: calls.some(call => call.id === 'kefeCanvas' && call.text === 'KEFE LAYOUT AUDIT'),
                    lyricCalls: calls.filter(call => call.id !== 'kefeCanvas' && call.width === canvas.width && call.height === canvas.height).map(call => ({ text: call.text, x: call.x, y: call.y, fillStyle: call.fillStyle, stops: call.stops })),
                    fullLineDrawn: calls.some(call => call.id !== 'kefeCanvas' && call.width === canvas.width && call.height === canvas.height && call.text.trim().toLowerCase() === (window.__kefeLayoutAudit.expectedPhrase || '').trim().toLowerCase())
                  };
                });
                const expected = aspect === '16:9' ? [1920, 1080] : aspect === '1:1' ? [1080, 1080] : [1080, 1920];
                assert.deepEqual([rendered.canvas.width, rendered.canvas.height], expected, label + ': wrong canvas dimensions for ' + aspect);
                assert.ok(rendered.titleDrawn, label + ': title card text did not render for ' + aspect);
                assert.ok(rendered.lyricCalls.length > 0, label + ': lyrics did not render for ' + aspect);
                if (aspect === '16:9') {
                  // Reference look: every lyric glyph is WHITE and only its alpha changes (unsung ~0.32, sung 1.0).
                  // Grey RGB values and high-alpha unsung text were what made the old renderer look dark / all-white.
                  const parseColour = value => {
                    const match = String(value).match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([0-9.]+)\s*)?\)/);
                    return match ? { r: Number(match[1]), g: Number(match[2]), b: Number(match[3]), a: match[4] === undefined ? 1 : Number(match[4]) } : null;
                  };
                  const flat = rendered.lyricCalls.map(call => parseColour(call.fillStyle)).filter(Boolean);
                  const gradientStops = rendered.lyricCalls.flatMap(call => (call.stops || []).map(parseColour)).filter(Boolean);
                  assert.ok(flat.length + gradientStops.length > 0, label + ': could not inspect Apple lyric glyph colours');
                  assert.ok(gradientStops.length > 0, label + ': timed lyric letters should be filled with a soft-edged gradient');
                  assert.ok([...flat, ...gradientStops].every(c => c.r === 255 && c.g === 255 && c.b === 255),
                    label + ': lyric glyphs must be white with alpha, not grey RGB');
                  // The unsung end of every letter gradient must sit at the dim level: readable (>= 0.2) but clearly
                  // lower than the sung white (<= 0.35). A frame of playback may already have lit the first letters.
                  const unsungAlpha = Math.min(...gradientStops.map(c => c.a));
                  assert.ok(unsungAlpha >= 0.2, label + ': unsung lyric glyphs are too dark to read (alpha ' + unsungAlpha + ')');
                  assert.ok(unsungAlpha <= 0.35, label + ': unreached lyric glyphs are too bright (alpha ' + unsungAlpha + ')');
                  assert.ok(flat.every(c => c.a <= 0.5), label + ': lyric glow/inactive text is too bright');
                  console.log(JSON.stringify({ target: label, gradientStopAlphas: [...new Set(gradientStops.map(c => c.a))], flatAlphas: [...new Set(flat.map(c => c.a))] }));
                }
                if (aspect === '16:9') {
                  const expectedCompact = prepared.fitPhrase.replace(/\s+/g, '').toLowerCase();
                  // Apple renders the active lyric one glyph at a time, with multiple glow/fill passes
                  // per glyph. Reconstruct glyph order from on-canvas positions instead of concatenating
                  // every paint pass (which duplicates letters and makes this assertion fail falsely).
                  const glyphs = [];
                  let previousGlyphKey = '';
                  for (const call of rendered.lyricCalls) {
                    if (call.text.length !== 1 || call.x < 0 || call.x >= rendered.canvas.width) continue;
                    const key = Math.round(call.x) + ':' + call.text;
                    // Glow and gradient passes paint the same glyph at the same x; count it once.
                    if (key === previousGlyphKey) continue;
                    glyphs.push({ x: call.x, text: call.text });
                    previousGlyphKey = key;
                  }
                  const drawnCompact = glyphs.map(glyph => glyph.text).join('').replace(/\s+/g, '').toLowerCase();
                  const phraseStart = drawnCompact.indexOf(expectedCompact);
                  assert.ok(phraseStart >= 0,
                    label + ': landscape lyric characters did not render in order: ' + drawnCompact);
                  // Only inspect the target phrase: unrelated visible lyric rows can reset x independently.
                  const phraseGlyphs = glyphs.slice(phraseStart, phraseStart + expectedCompact.length);
                  const rowBreaks = phraseGlyphs.reduce((count, glyph, index, calls) =>
                    count + (index > 0 && glyph.x < calls[index - 1].x - rendered.canvas.width * 0.1 ? 1 : 0), 0);
                  assert.equal(rowBreaks, 0,
                    label + ': landscape lyric line wrapped instead of using the extra width');
                }

                await page.screenshot({ path: (label === 'local source' ? 'local' : 'live') + '-apple-lyrics-' + aspect.replace(':', '-') + '.png', fullPage: false });
                await page.locator('#previewFullscreen').click();
                await page.waitForFunction(() => {
                  const stage = document.querySelector('.kefe-stage');
                  return document.fullscreenElement === stage || stage.classList.contains('kefe-pseudo-fullscreen');
                }, { timeout: 8000 });
                const fullscreen = await page.evaluate(() => ({
                  active: document.fullscreenElement === document.querySelector('.kefe-stage') ||
                    document.querySelector('.kefe-stage').classList.contains('kefe-pseudo-fullscreen'),
                  canvasWidth: document.getElementById('kefeCanvas').width,
                  canvasHeight: document.getElementById('kefeCanvas').height
                }));
                assert.ok(fullscreen.active, label + ': fullscreen did not activate for ' + aspect);
                assert.deepEqual([fullscreen.canvasWidth, fullscreen.canvasHeight], expected,
                  label + ': fullscreen changed the selected canvas ratio for ' + aspect);
                await page.locator('#previewFullscreen').click();
                await page.waitForFunction(() => !document.fullscreenElement &&
                  !document.querySelector('.kefe-stage').classList.contains('kefe-pseudo-fullscreen'),
                  null, { timeout: 8000 });
                results.push({ aspect, canvas: rendered.canvas, titleDrawn: rendered.titleDrawn, lyricDrawCalls: rendered.lyricCalls.length, fullscreen: 'PASS' });
              }
              assert.deepEqual(errors, [], label + ': browser runtime errors: ' + errors.join('; '));
              console.log(JSON.stringify({ target: label, result: 'PASS', landscapeRegressionPhrase: prepared.fitPhrase, aspects: results, runtimeErrors: errors }, null, 2));
            } finally {
              await page.close();
            }
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              await verify(browser, 'http://127.0.0.1:4173', 'local source');
              await verify(browser, 'https://tezzaaaaaa.github.io/Kefe/apps/web', 'published GitHub Pages');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          python3 -m http.server 4173 --directory apps/web > /tmp/kefe-apple-layout-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:4173/index.html -o /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/index.html -o /dev/null
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/kefe-apple-layout-check.cjs

      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kefe-apple-lyrics-layout-screenshots
          path: '*-apple-lyrics-*.png'
          if-no-files-found: ignore
